<style>
/* ===== Announcements (admin): ported from ams-portal-v2 resources/js/pages/announcements/*.tsx ===== */
.an-list{list-style:none;margin:0;padding:0;display:grid;gap:.75rem}
.an-item{display:grid;gap:1rem;padding:1.25rem;transition:border-color .15s,box-shadow .15s}
.an-item:hover{border-color:color-mix(in oklab,var(--foreground) 20%,transparent);box-shadow:0 4px 6px -1px rgb(0 0 0/.1),0 2px 4px -2px rgb(0 0 0/.1)}
.an-top{display:flex;flex-wrap:wrap;align-items:flex-start;justify-content:space-between;gap:.75rem}
.an-subj{margin:0;font-size:14px;line-height:20px;font-weight:600;overflow-wrap:anywhere}
.an-re{margin-right:.375rem;font-size:12px;font-weight:600;letter-spacing:.025em;color:var(--muted-foreground)}
.an-meta{margin:.25rem 0 0;font-size:12px;line-height:16px;color:var(--muted-foreground);overflow-wrap:anywhere}
.an-pills{display:flex;flex-wrap:wrap;gap:.5rem}
.an-pills .statusbadge{gap:.25rem}.an-pills .statusbadge svg{width:.75rem;height:.75rem}
.an-warn{margin:0;border-radius:.75rem;border:1px solid color-mix(in oklab,var(--rose-500) 25%,transparent);background:color-mix(in oklab,var(--rose-500) 5%,transparent);padding:.5rem .75rem;font-size:14px;color:var(--rose-600)}
:root[data-theme="dark"] .an-warn{color:var(--rose-400)}
.an-note{margin:0;border-radius:1rem;border:1px solid color-mix(in oklab,var(--amber-500) 25%,transparent);background:color-mix(in oklab,var(--amber-500) 5%,transparent);padding:.75rem 1rem;font-size:12px;color:var(--amber-700)}
:root[data-theme="dark"] .an-note{color:var(--amber-400)}
.an-acts{display:flex;flex-wrap:wrap;gap:.5rem;border-top:1px solid var(--border);padding-top:1rem}
.an-acts .rm{margin-left:auto}
.an-sh{border-bottom:1px solid var(--border);padding:1rem 1.25rem}.an-sh h2{margin:0;font-size:14px;font-weight:600}.an-sh p{margin:0;font-size:12px;line-height:16px;color:var(--muted-foreground)}
.an-sb{padding:1.25rem}.an-sb>div:last-child{margin-bottom:0}
.an-count{margin:0;text-align:right;font-size:12px;font-variant-numeric:tabular-nums}
.an-pager{display:flex;align-items:center;justify-content:flex-end;gap:.5rem;padding:0 .25rem}
.cf-body{display:grid;gap:1rem}
.cf-sec{display:grid;gap:.5rem}.cf-sec+.cf-sec{border-top:1px solid var(--border);padding-top:1rem}.cf-sec h3{display:flex;align-items:center;gap:.5rem;margin:0;font-size:14px;font-weight:600}.cf-sec h3 svg{width:1rem;height:1rem}
.cf-img{display:flex;max-height:60vh;width:100%;align-items:center;justify-content:center;overflow:hidden;border-radius:.75rem;border:1px solid var(--border);background:var(--muted)}.cf-img img{max-height:60vh;width:100%;object-fit:contain}
.cf-pdf{display:none;height:55vh;width:100%;border:1px solid var(--border);border-radius:.75rem;background:var(--muted)}
.cf-pdfm{display:flex;flex-direction:column;align-items:center;gap:.75rem;border:1px solid var(--border);border-radius:.75rem;background:color-mix(in oklab,var(--muted) 60%,transparent);padding:2rem 1rem;text-align:center}.cf-pdfm p{margin:0;font-size:14px;color:var(--muted-foreground)}.cf-pdfm svg{width:2rem;height:2rem;color:var(--muted-foreground)}
.cf-open{display:none;align-items:center;gap:.25rem;font-size:12px;color:var(--muted-foreground)}.cf-open:hover{color:var(--foreground)}.cf-open svg{width:.75rem;height:.75rem}
@media(min-width:640px){.cf-pdf{display:block}.cf-pdfm{display:none}.cf-open{display:inline-flex}}
</style>
<script>
/* ===== Certificates, chain of command, announcements, recruitment, settings ===== */
/* ---------- certificates (ported 1:1 from resources/js/pages/certificates/index.tsx) ---------- */
Object.assign(ICONS, {
  file: 'M15 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V7zM14 2v4a2 2 0 0 0 2 2h4M10 9H8M16 13H8M16 17H8',
  externalLink: 'M15 3h6v6M10 14 21 3M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6',
  settings2: 'M20 7h-9M14 17H5M20 17a3 3 0 1 0-6 0 3 3 0 0 0 6 0M10 7a3 3 0 1 0-6 0 3 3 0 0 0 6 0'
});
const CF = { modal: null, urls: [], local: null };
const CF_TONE = { issued: 'emerald', revoked: 'rose', pending: 'amber', none: 'muted' };
const cfPill = c => '<span class="statusbadge t-' + CF_TONE[c ? c.status : 'none'] + '" style="text-transform:capitalize">' + h(c ? c.status : 'Not issued') + '</span>';
const cfDate = iso => { const d = new Date(iso); return isNaN(d) ? '' : d.toLocaleDateString(); };
const cfClose = () => { if (CF.modal) { const m = CF.modal; CF.modal = null; m.close(); } };
const cfReload = () => go(State.path + qs(State.q), false, true);
/** Image or PDF preview (FilePreview in the original): PDFs use an iframe on wide screens and an "Open PDF" button on phones. */
function cfPreview(src, mime, title) {
  const img = String(mime || '').indexOf('image/') === 0;
  return '<div style="display:grid;gap:.5rem">' + (img
    ? '<div class="cf-img"><img src="' + src + '" alt="' + h(title) + '"></div>'
    : '<iframe class="cf-pdf" src="' + src + '" title="' + h(title) + '"></iframe><div class="cf-pdfm">' + icon('file') + '<p>PDF previews are not supported inside this view on mobile.</p><a class="btn sm primary rx" href="' + src + '" target="_blank" rel="noopener">' + icon('externalLink') + 'Open PDF</a></div>') +
    '<a class="cf-open" href="' + src + '" target="_blank" rel="noopener">' + icon('externalLink') + 'Preview not showing? Open in a new tab</a></div>';
}

route('/certificates', async (p, q, id) => {
  loadingShell('/certificates', '');
  const d = await A('certificates.list', { search: q.search, page: q.page }); if (!current(id)) return;
  State.cfRows = {}; d.trainees.forEach(t => { State.cfRows[t.id] = t; });
  const head = '<div class="ghead"><div class="row" style="gap:1rem;flex-wrap:nowrap"><span class="chipicon t-violet" aria-hidden="true" style="width:3.5rem;height:3.5rem;border-radius:1rem;background:color-mix(in oklab,var(--violet-500) 15%,transparent)">' + bIcon('award', 24) + '</span>' +
    '<div><h1>Certificates</h1><p class="muted" style="margin:.25rem 0 0;font-size:14px">Open Manage to issue, preview or revoke a certificate. Files are private and served through the portal.</p></div></div>' +
    '<form data-form="certSearch" class="row" style="gap:.5rem;flex-wrap:nowrap"><div class="gsearch">' + icon('search') + '<input type="search" name="search" placeholder="Search name or username" value="' + h(q.search || '') + '" aria-label="Search trainees"></div><button class="btn primary rx" type="submit">Search</button></form></div>';
  const rows = d.trainees.length === 0 ? '<tr><td colspan="4" class="muted center" style="padding:3rem 1.25rem">No trainees found.</td></tr>'
    : d.trainees.map(t => { const c = t.certificate;
      return '<tr style="vertical-align:top"><td style="padding-left:1.25rem"><div class="row" style="gap:.75rem;flex-wrap:nowrap"><span class="gini" aria-hidden="true">' + h(initials(t.name)) + '</span><div style="min-width:0"><div style="font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">' + h(t.name) + '</div><div class="muted" style="font-size:12px">@' + h(t.username) + '</div></div></div></td>' +
        '<td>' + cfPill(c) + (c && c.number ? '<div class="muted" style="margin-top:.25rem;font-size:12px">' + h(c.number) + '</div>' : '') + '</td>' +
        '<td class="muted">' + (c && c.issued_at ? h(cfDate(c.issued_at)) : '-') + '</td>' +
        '<td style="padding-right:1.25rem"><button type="button" class="btn sm rx" data-act="certManage" data-id="' + h(t.id) + '">' + icon('settings2') + 'Manage</button></td></tr>'; }).join('');
  const th = '<th style="padding-left:1.25rem">Trainee</th><th>Certificate</th><th>Issued</th><th style="padding-right:1.25rem">Actions</th>';
  mount(shell('/certificates', '', '', '<div class="dg">' + head + '<div class="gtab"><div style="overflow-x:auto"><table><thead><tr>' + th + '</tr></thead><tbody>' + rows + '</tbody></table></div></div>' + gpager(d.meta) + '</div>', '', 'Certificates'));
});
Forms.certSearch = f => setQuery({ search: ($('[name=search]', f).value || '').trim() });

/** Manage dialog (ManageDialog in the original): current file preview, issue / re-issue with a local preview, revoke. */
Actions.certManage = el => {
  const t = (State.cfRows || {})[el.dataset.id]; if (!t) return;
  const c = t.certificate, issued = !!c && c.status === 'issued', revoked = !!c && c.status === 'revoked';
  const body = '<div class="cf-body"><p class="muted" style="margin:0;font-size:14px;overflow-wrap:anywhere">' + h(t.name) + ' (@' + h(t.username) + ')' + (c && c.number ? ' · ' + h(c.number) : '') + '</p>' +
    '<div class="row" style="gap:.5rem">' + cfPill(c) + (c && c.issued_at ? '<span class="muted" style="font-size:12px">Issued ' + h(cfDate(c.issued_at)) + '</span>' : '') + '</div>' +
    (c && c.has_file ? '<section class="cf-sec"><h3>' + icon('file') + (issued ? 'Issued certificate' : 'Previous file (revoked)') + '</h3><div id="cf-prev"><div class="skeleton"></div><div class="skeleton" style="width:70%"></div></div><div><button type="button" class="btn sm rx" data-act="certDownload" data-id="' + h(c.id) + '">Download</button></div></section>' : '') +
    (!issued ? '<section class="cf-sec"><h3>' + (revoked ? 'Re-issue certificate' : 'Issue certificate') + '</h3><form data-form="certIssue" data-id="' + h(t.id) + '" class="cf-body" novalidate>' +
      '<div class="field" style="margin:0"><input type="file" name="file" id="f-file" accept="application/pdf,image/jpeg,image/png,image/webp" required data-cf-file aria-label="Certificate file for ' + h(t.name) + '"><div class="hint">PDF, JPG, PNG or WebP, up to 5 MB.</div></div><div id="cf-local"></div>' +
      '<div class="row" style="justify-content:flex-end;gap:.5rem"><button type="button" class="btn ghost rx" data-modal-close>Cancel</button><button type="submit" class="btn primary rx" disabled>' + (revoked ? 'Re-issue' : 'Issue') + '</button></div></form></section>' : '') +
    (issued ? '<section class="cf-sec"><div><button type="button" class="btn sm danger solid rx" data-act="certRevoke" data-id="' + h(c.id) + '" data-number="' + h(c.number || '') + '">Revoke certificate</button></div></section>' : '') + '</div>';
  CF.urls = []; CF.local = null;
  const m = CF.modal = openModal({ title: 'Manage certificate', wide: true, body, onClose: () => { CF.urls.concat(CF.local ? [CF.local] : []).forEach(u => URL.revokeObjectURL(u)); CF.urls = []; CF.local = null; if (CF.modal === m) CF.modal = null; } });
  if (c && c.has_file) {
    A('certificates.preview', { id: c.id }).then(f => {
      const box = $('#cf-prev', m.el); if (!box) return;
      const url = URL.createObjectURL(saveBlob(f.base64, f.mime)); CF.urls.push(url);
      box.innerHTML = cfPreview(url, f.mime, 'Certificate ' + (c.number || ''));
    }).catch(e => { const box = $('#cf-prev', m.el); if (box) box.innerHTML = '<div class="alert warn" style="margin:0">' + h(e.message || 'The preview is unavailable.') + '</div>'; });
  }
};
document.addEventListener('change', e => {
  const t = e.target; if (!t || !t.matches || !t.matches('input[data-cf-file]')) return;
  const file = t.files[0], box = $('#cf-local'), btn = $('[type=submit]', t.closest('form'));
  if (CF.local) { URL.revokeObjectURL(CF.local); CF.local = null; }
  if (btn) btn.disabled = !file;
  if (!box) return;
  if (!file) { box.innerHTML = ''; return; }
  CF.local = URL.createObjectURL(file);
  box.innerHTML = '<p class="muted" style="margin:0 0 .25rem;font-size:12px;overflow-wrap:anywhere">Preview of ' + h(file.name) + '. Not issued until you confirm.</p>' + cfPreview(CF.local, file.type, 'Selected file preview');
});
Forms.certIssue = async f => {
  const file = $('[name=file]', f).files[0], btn = $('[type=submit]', f);
  if (!file) { clearErrors(f); return showErrors(f, { code: 'VALIDATION_ERROR', message: 'Choose a file.', fields: { file: 'Choose a file.' } }); }
  if (file.size > 5 * 1024 * 1024) return showErrors(f, { code: 'VALIDATION_ERROR', message: 'The certificate must be 5 MB or smaller.', fields: { file: 'The certificate must be 5 MB or smaller.' } });
  const label = btn.textContent; btn.disabled = true; btn.textContent = 'Uploading…'; clearErrors(f);
  try {
    const b64 = await fileToBase64(file);
    await A('certificates.issue', { trainee_id: f.dataset.id, file: { name: file.name, base64: b64 } });
    if (A.lastMessage) toast(A.lastMessage, 'ok');
    cfClose(); cfReload();
  } catch (e) { showErrors(f, e); }
  finally { if (btn.isConnected) { btn.disabled = false; btn.textContent = label; } }
};
Actions.certRevoke = async el => {
  const ok = await confirmDialog({ title: 'Revoke certificate?', message: 'Revoke ' + (el.dataset.number || 'this certificate') + '? The trainee will lose access to the file.', confirmText: 'Revoke certificate', danger: true }); if (!ok) return;
  await busy(el, async () => { await A('certificates.revoke', { id: el.dataset.id }); toast(A.lastMessage, 'ok'); cfClose(); cfReload(); });
};
Actions.certDownload = async el => busy(el, async () => { const f = await A('certificates.download', { id: el.dataset.id }); const url = URL.createObjectURL(saveBlob(f.base64, f.mime)); const a = document.createElement('a'); a.href = url; a.download = f.name; document.body.appendChild(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(url), 5000); });
Actions.certPreview = async el => busy(el, async () => {
  const f = await A('certificates.preview', { id: el.dataset.id }), url = URL.createObjectURL(saveBlob(f.base64, f.mime));
  openModal({ title: 'Certificate', wide: true, onClose: () => URL.revokeObjectURL(url), body: f.mime === 'application/pdf' ? '<iframe src="' + url + '" style="width:100%;height:70vh;border:1px solid var(--border);border-radius:8px" title="Certificate"></iframe><p class="muted small">If the preview does not display, use Download instead.</p>' : '<img src="' + url + '" alt="Certificate" style="max-width:100%;border-radius:8px">' });
});

/* ---------- chain of command (manage) ---------- */
route('/chain-of-command/manage', async (p, q, id) => {
  loadingShell('/chain-of-command/manage', 'Chain of Command');
  const d = await A('chain.manage'); if (!current(id)) return;
  State.chainHosts = d.image_hosts;
  mount(shell('/chain-of-command/manage', 'Chain of Command', '<button class="btn primary" data-act="chainEdit">' + icon('plus') + 'Add entry</button><a class="btn" href="#/chain-of-command" data-go="/chain-of-command">Public page</a>', '<div class="card">' + table([{ h: 'Order', cls: 'center', f: e => e.sort_order }, { h: 'Person', f: e => '<b>' + h(e.name) + '</b><div class="muted small">' + h(e.rank) + '</div>' }, { h: 'Position', f: e => h(e.position) }, { h: 'Portrait', cls: 'hide-sm', f: e => e.image_url ? badge('Image', 'ok') : '—' },
    { h: '', cls: 'right nowrap', f: e => '<button class="btn sm" data-act="chainEdit" data-e="' + h(JSON.stringify(e)) + '">' + icon('edit') + 'Edit</button> <button class="btn sm danger" data-act="chainDelete" data-id="' + h(e.id) + '" aria-label="Delete">' + icon('trash') + '</button>' }], d.entries, 'No entries yet.') + '</div>'));
});
Actions.chainEdit = el => {
  const e = el.dataset.e ? JSON.parse(el.dataset.e) : null;
  openModal({ title: e ? 'Edit entry' : 'Add entry', body: '<form data-form="chainSave" ' + (e ? 'data-id="' + h(e.id) + '"' : '') + ' novalidate>' + field('Name', input('name', { value: e && e.name, required: true, max: 150 })) + '<div class="grid g2">' + field('Rank', input('rank', { value: e && e.rank, required: true, max: 100 })) + field('Sort order', input('sort_order', { type: 'number', value: e ? e.sort_order : 0, min: 0, maxn: 65535 })) + '</div>' + field('Position', input('position', { value: e && e.position, required: true, max: 150 })) +
    field('Portrait image URL', input('image_url', { value: e && e.image_url, max: 500, ph: 'https://i.imgur.com/example.png' }), { hint: 'Direct https link (.jpg, .png, .webp) hosted on: ' + (State.chainHosts || []).join(', ') }) + field('Note', '<textarea name="note" maxlength="1000">' + h(e && e.note) + '</textarea>') + '<div class="row" style="justify-content:flex-end"><button type="button" class="btn" data-modal-close>Cancel</button><button class="btn primary" type="submit">Save</button></div></form>' });
};
Forms.chainSave = async f => { const v = formVals(f); if (f.dataset.id) v.id = f.dataset.id; await submitForm(f, f.dataset.id ? 'chain.update' : 'chain.create', v, () => { const o = f.closest('.overlay'); if (o) o.remove(); go(State.path); }); };
Actions.chainDelete = async el => { const ok = await confirmDialog({ title: 'Remove entry?', message: 'It will disappear from the public page.', confirmText: 'Remove', danger: true }); if (!ok) return; await busy(el, async () => { await A('chain.delete', { id: el.dataset.id }); toast(A.lastMessage, 'ok'); go(State.path); }); };

/* ---------- announcements (ported 1:1 from resources/js/pages/announcements/index.tsx, form.tsx, create.tsx and edit.tsx) ---------- */
Object.assign(ICONS, { pinOff: 'M12 17v5M15 9.34V7a1 1 0 0 1 1-1 2 2 0 0 0 0-4H7.89M2 2l20 20M9 9v1.76a2 2 0 0 1-1.11 1.79l-1.78.9A2 2 0 0 0 5 15.24V16a1 1 0 0 0 1 1h11' });
const AN_DISCORD = { not_sent: ['muted', 'Discord: not sent'], sending: ['amber', 'Discord: sending…'], sent: ['emerald', 'Discord: sent'], failed: ['rose', 'Discord: failed'] };
/** 14 x 14 (size-14) amber megaphone tile used in the page headers. */
const anTile = () => '<span class="chipicon t-amber" aria-hidden="true" style="width:3.5rem;height:3.5rem;border-radius:1rem;background:color-mix(in oklab,var(--amber-500) 15%,transparent)">' + bIcon('announce', 24) + '</span>';
/** inner must already be escaped HTML. */
const anPill = (tone, inner, big) => '<span class="statusbadge t-' + tone + '"' + (big ? ' style="padding:.375rem .75rem;font-size:14px;font-weight:600"' : '') + '>' + inner + '</span>';
const anBack = () => '<a class="btn sm rx" style="background:color-mix(in oklab,var(--background) 70%,transparent)" href="#/announcements" data-go="/announcements">' + icon('arrowLeft') + 'Back</a>';
const anHead = (title, sub, right, trunc) => {
  const t = trunc ? ';overflow:hidden;text-overflow:ellipsis;white-space:nowrap' : '';
  return '<div class="ghead"><div class="row" style="gap:1rem;flex-wrap:nowrap;min-width:0">' + anTile() + '<div style="min-width:0"><h1' + (trunc ? ' style="overflow:hidden;text-overflow:ellipsis;white-space:nowrap"' : '') + '>' + h(title) + '</h1><p class="muted" style="margin:.25rem 0 0;font-size:14px' + t + '">' + h(sub) + '</p></div></div>' + (right ? '<div class="row" style="gap:.5rem">' + right + '</div>' : '') + '</div>';
};
const anCrumbs = last => [{ t: 'Announcements', to: '/announcements' }, last];

route('/announcements', async (p, q, id) => {
  loadingShell('/announcements', '');
  const d = await A('announcements.list', { page: q.page }); if (!current(id)) return;
  const items = d.announcements.map(a => {
    const dl = AN_DISCORD[a.discord_status] || AN_DISCORD.not_sent, pub = a.is_published, did = ' data-id="' + h(a.id) + '"';
    const pills = anPill(pub ? 'sky' : 'muted', pub ? 'Published ' + h(a.published_label) : 'Draft') + (pub && a.is_pinned ? anPill('amber', icon('pin') + 'Pinned') : '') + (pub ? anPill(dl[0], h(dl[1])) : '');
    const warn = pub && a.discord_status === 'failed' ? '<p class="an-warn">' + h(a.discord_error || 'Discord delivery failed.') + ' The announcement is live in the portal; retry to post it to Discord.</p>' : '';
    const acts = '<div class="an-acts"><a class="btn sm rx" href="#/announcements/' + h(a.id) + '/edit" data-go="/announcements/' + h(a.id) + '/edit">Edit</a>' +
      (!pub ? '<button class="btn sm primary rx" data-act="annDo" data-op="publish"' + did + '>Publish</button>' : '') +
      (pub ? '<button class="btn sm rx" data-act="annDo" data-op="unpublish"' + did + '>Unpublish</button>' : '') +
      (pub ? '<button class="btn sm rx" data-act="annDo" data-op="' + (a.is_pinned ? 'unpin' : 'pin') + '"' + did + '>' + icon(a.is_pinned ? 'pinOff' : 'pin') + (a.is_pinned ? 'Unpin' : 'Pin') + '</button>' : '') +
      (pub && (a.discord_status === 'failed' || a.discord_status === 'sending') ? '<button class="btn sm primary rx" data-act="annDo" data-op="retry"' + did + '>Retry Discord</button>' : '') +
      '<button class="btn sm danger solid rx rm" data-act="annDelete"' + did + '>Remove</button></div>';
    return '<li class="dcard an-item"><div class="an-top"><div style="min-width:0"><p class="an-subj"><span class="an-re">RE:</span>' + h(a.subject) + '</p><p class="an-meta">To: ' + h(a.recipient) + ' · From: ' + h(a.sender) + (a.author ? ' · by ' + h(a.author) : '') + '</p></div><div class="an-pills">' + pills + '</div></div>' + warn + acts + '</li>';
  }).join('');
  const m = d.meta, pg = m && m.last_page > 1 ? '<div class="an-pager">' + (m.page > 1 ? '<button class="btn sm rx" data-act="page" data-page="' + (m.page - 1) + '">Newer</button>' : '') + (m.page < m.last_page ? '<button class="btn sm rx" data-act="page" data-page="' + (m.page + 1) + '">Older</button>' : '') + '</div>' : '';
  const empty = d.announcements.length === 0 ? '<div class="gempty">' + icon('announce') + '<p style="margin:0;font-weight:500;color:var(--foreground)">No announcements yet</p><p style="margin:0">Create one to share it with trainees.</p></div>' : '';
  const body = '<div class="dg">' + anHead('Announcements', 'Draft, publish and pin notices shown on the public page', '<a class="btn primary rx" href="#/announcements/create" data-go="/announcements/create">' + icon('plus') + 'New announcement</a>') + empty + (items ? '<ul class="an-list">' + items + '</ul>' : '') + pg + '</div>';
  mount(shell('/announcements', '', '', body, '', 'Announcements'));
});

const anSection = (title, sub, inner) => '<section class="dcard"><header class="an-sh"><h2>' + h(title) + '</h2>' + (sub ? '<p>' + h(sub) + '</p>' : '') + '</header><div class="an-sb">' + inner + '</div></section>';
const anInput = (name, label, ph, val) => bField(label, 'f-' + name, rxi(input(name, { value: val, max: 150, ph: ph })));
function annForm(a) {
  const v = k => (a && a[k] !== null && a[k] !== undefined ? a[k] : ''), published = !!(a && a.is_published), len = String(v('body')).length;
  return '<form data-form="annSave" ' + (a ? 'data-id="' + h(a.id) + '"' : '') + ' class="dg" novalidate>' +
    anSection('Memo header', 'Shown as TO, FROM and RE on the public page.', anInput('recipient', 'To', 'All Medical Trainees', v('recipient')) + anInput('sender', 'From', 'Office of the Dean of Medicine', v('sender')) + anInput('subject', 'RE:', 'Subject', v('subject'))) +
    anSection('Message', '', bField('Context', 'f-body', '<textarea class="rx" name="body" id="f-body" rows="10" maxlength="3000" data-count="3000">' + h(v('body')) + '</textarea><p class="an-count muted" id="an-count">' + len + '/3000</p>') + anInput('signature', 'Name / signature', '[RANK] [USERNAME], [POSITION]', v('signature'))) +
    (published && a.discord_status === 'sent' ? '<p class="an-note">Edits update the portal only; the message already posted in Discord is not changed.</p>' : '') +
    '<div class="an-form-acts row" style="gap:.75rem"><button type="submit" class="btn rx">' + (a ? 'Save changes' : 'Save as draft') + '</button>' +
    (!published ? '<button type="button" class="btn primary rx" data-act="annPublish">' + (a ? 'Save &amp; publish' : 'Publish now') + '</button>' : '') + '</div></form>';
}
document.addEventListener('input', e => { const t = e.target; if (t && t.matches && t.matches('textarea[data-count]')) { const c = document.getElementById('an-count'); if (c) c.textContent = t.value.length + '/' + t.dataset.count; } });

route('/announcements/create', async () => {
  mount(shell('/announcements', '', '', '<div style="max-width:48rem;margin:0 auto"><div class="dg">' + anHead('New announcement', 'Save as draft or publish to the portal and Discord', anBack()) + annForm(null) + '</div></div>', '', anCrumbs({ t: 'New', to: '/announcements/create' })));
});
route('/announcements/:id/edit', async (p, q, id) => {
  loadingShell('/announcements', '');
  const d = await A('announcements.get', { id: p.id }); if (!current(id)) return;
  const a = d.announcement;
  mount(shell('/announcements', '', '', '<div style="max-width:48rem;margin:0 auto"><div class="dg">' + anHead('Edit announcement', 'RE: ' + a.subject, anPill(a.is_published ? 'emerald' : 'muted', a.is_published ? 'Published' : 'Draft', true) + anBack(), true) + annForm(a) + '</div></div>', '', anCrumbs({ t: 'Edit', to: '/announcements' })));
});
async function annSubmit(f, btn, publish) {
  const v = formVals(f); v.publish = !!publish; if (f.dataset.id) v.id = f.dataset.id;
  const all = $$('.an-form-acts button', f), label = btn ? btn.textContent : '';
  all.forEach(b => { b.disabled = true; }); if (btn) btn.textContent = 'Saving…'; clearErrors(f);
  try { await A(f.dataset.id ? 'announcements.update' : 'announcements.create', v); if (A.lastMessage) toast(A.lastMessage, /failed/i.test(A.lastMessage) ? 'bad' : 'ok'); await go('/announcements'); }
  catch (e) { showErrors(f, e); }
  finally { if (btn && btn.isConnected) btn.textContent = label; all.forEach(b => { if (b.isConnected) b.disabled = false; }); }
}
Forms.annSave = async (f, e) => annSubmit(f, (e && e.submitter) || $('[type=submit]', f), false);
Actions.annPublish = async el => annSubmit(el.closest('form'), el, true);
Actions.annDo = async el => busy(el, async () => { await A('announcements.' + el.dataset.op, { id: el.dataset.id }); const m = A.lastMessage; if (m) toast(m, /failed/i.test(m) ? 'bad' : 'ok'); go(State.path + qs(State.q), false, true); });
Actions.annDelete = async el => { const ok = await confirmDialog({ title: 'Remove announcement?', message: 'Remove this announcement? A copy already in Discord is not deleted.', confirmText: 'Remove', danger: true }); if (!ok) return; await busy(el, async () => { await A('announcements.delete', { id: el.dataset.id }); toast(A.lastMessage, 'ok'); go(State.path + qs(State.q), false, true); }); };

/* ---------- recruitment (intake) ---------- */
route('/intake', async (p, q, id) => {
  loadingShell('/intake', 'Recruitment');
  const d = await A('intake.get'); if (!current(id)) return;
  mount(shell('/intake', 'Recruitment', '', '<div class="card" style="max-width:560px"><div class="bd"><form data-form="intake" novalidate><p style="margin-top:0">Controls the banner shown on the public home page and dashboards.</p>' + field('Status', select('status', [{ value: 'open', label: 'Open — ' + d.messages.open }, { value: 'closed', label: 'Closed — ' + d.messages.closed }], d.status)) + '<button class="btn primary" type="submit">Save</button></form></div></div>'));
});
Forms.intake = async f => { await submitForm(f, 'intake.update', formVals(f), () => { go(State.path); }); };

/* ---------- settings ---------- */
function settingsFrame(active, body) {
  const tabs = [['/settings/profile', 'Profile'], ['/settings/security', 'Password'], ['/settings/appearance', 'Appearance']];
  return shell(active, 'Settings', '', '<div class="row" style="margin-bottom:16px">' + tabs.map(t => '<a class="btn sm ' + (t[0] === active ? 'primary' : '') + '" href="#' + t[0] + '" data-go="' + t[0] + '">' + t[1] + '</a>').join('') + '</div>' + body);
}
route('/settings', async () => go('/settings/profile'));
route('/settings/profile', async () => {
  const u = State.user;
  mount(settingsFrame('/settings/profile', '<div class="card" style="max-width:560px"><div class="bd"><form data-form="profile" novalidate>' + field('Name', input('name', { value: u.name, required: true, max: 255 })) + field('Username', input('x', { value: u.username, disabled: true })) + field('Email', input('y', { value: u.email || '—', disabled: true }), { hint: 'Contact an administrator to change your username or email.' }) + field('Role', input('z', { value: u.role_label, disabled: true })) + '<button class="btn primary" type="submit">Save</button></form></div></div>'));
});
Forms.profile = async f => { await submitForm(f, 'settings.profile', { name: formVals(f).name }, d => { State.user = d.user; go('/settings/profile'); }); };
route('/settings/security', async () => {
  mount(settingsFrame('/settings/security', (State.user.force_password_change ? '<div class="alert warn">You are using a temporary password. Choose a new one to continue.</div>' : '') + '<div class="card" style="max-width:560px"><div class="bd"><form data-form="password" novalidate>' + field('Current password', input('current_password', { type: 'password', required: true, auto: 'current-password' })) + field('New password', input('password', { type: 'password', required: true, auto: 'new-password' }), { hint: 'At least 12 characters. Changing it signs you out of other devices.' }) + field('Confirm new password', input('password_confirmation', { type: 'password', required: true, auto: 'new-password' })) + '<button class="btn primary" type="submit">Update password</button></form></div></div>'));
});
Forms.password = async f => { await submitForm(f, 'settings.password', formVals(f), d => { State.user = d.user; f.reset(); go('/dashboard'); }); };
route('/settings/appearance', async () => {
  const cur = Store.get('ams_theme') || 'system';
  mount(settingsFrame('/settings/appearance', '<div class="card" style="max-width:560px"><div class="bd"><p style="margin-top:0">Choose how the portal looks on this device.</p><div class="row">' + [['light', 'Light', 'sun'], ['dark', 'Dark', 'moon'], ['system', 'System', 'settings']].map(t => '<button class="btn ' + (cur === t[0] ? 'primary' : '') + '" data-act="theme" data-v="' + t[0] + '">' + icon(t[2]) + t[1] + '</button>').join('') + '</div></div></div>'));
});
Actions.theme = el => { Store.set('ams_theme', el.dataset.v); applyTheme(); go('/settings/appearance'); };
</script>
