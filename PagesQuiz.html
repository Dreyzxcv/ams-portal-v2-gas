<style>
/* ===== Quiz attempt page: ported from ams-portal-v2 resources/js/pages/quizzes/attempt.tsx (no sidebar, one question at a time) ===== */
.qz{display:flex;flex-direction:column;min-height:100vh;min-height:100svh;background:var(--background);color:var(--foreground)}
.qz *{box-sizing:border-box}.qz h1,.qz h2,.qz p,.qz fieldset,.qz legend{margin:0}.qz fieldset{border:0;padding:0;min-width:0}.qz svg{flex:none}
.qz .sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap}
.qz-head{position:sticky;top:0;z-index:10;border-bottom:1px solid var(--border);background:color-mix(in oklab,var(--background) 90%,transparent);-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px)}
.qz-hin{display:flex;align-items:center;justify-content:space-between;gap:.75rem;width:100%;max-width:48rem;margin:0 auto;padding:.75rem 1rem}
.qz-t{min-width:0}.qz-t h1{font-size:14px;line-height:20px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.qz-t p{font-size:12px;line-height:16px;color:var(--muted-foreground)}
.qz-r{display:flex;flex:none;flex-direction:column;align-items:flex-end;gap:.25rem}
.qz-clock{display:flex;align-items:center;gap:.375rem;border:1px solid var(--border);border-radius:.75rem;padding:.375rem .75rem;font-size:16px;line-height:24px;font-weight:600;font-variant-numeric:tabular-nums}.qz-clock svg{width:1rem;height:1rem}
.qz-clock.low{border-color:color-mix(in oklab,var(--destructive) 50%,transparent);color:var(--destructive)}
.qz-save{display:flex;align-items:center;gap:.375rem;font-size:12px;line-height:16px;color:var(--muted-foreground)}.qz-save svg{width:.875rem;height:.875rem}
.qz-save .ok{color:var(--emerald-600)}:root[data-theme="dark"] .qz-save .ok{color:var(--emerald-400)}.qz-save.err{color:var(--destructive);gap:.5rem}
.qz-save .spin{animation:qzspin 1s linear infinite}@keyframes qzspin{to{transform:rotate(360deg)}}@media(prefers-reduced-motion:reduce){.qz-save .spin{animation:none}}
.qz-retry{display:inline-flex;align-items:center;gap:.25rem;border:1px solid color-mix(in oklab,var(--destructive) 40%,transparent);border-radius:.375rem;padding:.125rem .5rem;font:inherit;font-weight:500;color:inherit;background:transparent;cursor:pointer}.qz-retry:hover{background:color-mix(in oklab,var(--destructive) 10%,transparent)}.qz-retry svg{width:.75rem;height:.75rem}
.qz-bar{height:4px;background:var(--muted)}.qz-bar div{height:100%;background:var(--sky-600);transition:width .3s}@media(prefers-reduced-motion:reduce){.qz-bar div{transition:none}}
.qz-main{flex:1;display:flex;flex-direction:column;gap:1rem;width:100%;max-width:48rem;margin:0 auto;padding:1rem}
.qz-b{display:contents}
.qz-gate{display:flex;flex-direction:column;align-items:center;gap:1rem;border:1px solid var(--border);border-radius:1rem;background:var(--card);padding:2rem;text-align:center;box-shadow:var(--sh-xs)}
.qz-gate .ic{display:flex;width:3rem;height:3rem;align-items:center;justify-content:center;border-radius:1rem;background:color-mix(in oklab,var(--sky-500) 10%,transparent);color:var(--sky-700)}:root[data-theme="dark"] .qz-gate .ic{color:var(--sky-300)}.qz-gate .ic svg{width:1.5rem;height:1.5rem}
.qz-gate h2{font-size:18px;line-height:28px;font-weight:600}.qz-gate p{margin-top:.25rem;font-size:14px;line-height:20px;color:var(--muted-foreground)}
.qz-note{font-size:12px;line-height:16px;color:var(--muted-foreground)}
.qz-away{display:flex;align-items:center;justify-content:space-between;gap:.75rem;border:1px solid var(--border);border-radius:.75rem;padding:.75rem 1rem;font-size:14px;line-height:20px;color:var(--muted-foreground)}
.qz-away button{flex:none;border:0;background:none;padding:0;font:inherit;font-size:12px;font-weight:500;text-decoration:underline;color:inherit;cursor:pointer}
.qz-err{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:.75rem;border:1px solid color-mix(in oklab,var(--destructive) 40%,transparent);border-radius:.75rem;background:color-mix(in oklab,var(--destructive) 5%,transparent);padding:.75rem 1rem;font-size:14px;line-height:20px;color:var(--destructive)}
.qz-nav{display:flex;flex-wrap:wrap;gap:.375rem}
.qz-n{display:flex;width:2rem;height:2rem;align-items:center;justify-content:center;border:1px solid var(--border);border-radius:.5rem;background:transparent;font:inherit;font-size:12px;font-weight:500;font-variant-numeric:tabular-nums;color:inherit;cursor:pointer}
.qz-n:disabled{cursor:not-allowed;opacity:.4}.qz-n.done{background:color-mix(in oklab,var(--emerald-500) 10%,transparent);color:var(--emerald-700)}:root[data-theme="dark"] .qz-n.done{color:var(--emerald-300)}
.qz-n.cur{border-color:var(--sky-600);background:var(--sky-600);color:#fff}
.qz-card{display:flex;flex-direction:column;gap:1.25rem;border:1px solid var(--border);border-radius:1rem;background:var(--card);padding:1.25rem;box-shadow:var(--sh-xs)}
.qz-qh{display:flex;align-items:flex-start;justify-content:space-between;gap:1rem}.qz-qh h2{font-size:16px;line-height:1.625;font-weight:500;white-space:pre-wrap;overflow-wrap:anywhere}
.qz-pts{flex:none;border-radius:9999px;background:var(--muted);padding:.25rem .625rem;font-size:12px;line-height:16px;color:var(--muted-foreground)}
.qz-opts{display:grid;gap:.5rem}
.qz-opt{display:flex;min-height:3rem;align-items:flex-start;gap:.75rem;border:1px solid var(--border);border-radius:.75rem;padding:.75rem;font-size:14px;line-height:20px;cursor:pointer}.qz-opt:hover{background:color-mix(in oklab,var(--muted) 50%,transparent)}
.qz-opt input{width:1rem;height:1rem;margin:.125rem 0 0;accent-color:var(--sky-600)}.qz-opt.sel{border-color:var(--sky-600);background:color-mix(in oklab,var(--sky-500) 10%,transparent)}.qz-opt.lock{cursor:not-allowed;opacity:.7}
.qz-card textarea{width:100%;min-height:11rem;resize:vertical;border:1px solid var(--input);border-radius:.75rem;background:var(--background);padding:.5rem .75rem;font:inherit;font-size:14px;line-height:20px;color:inherit;box-shadow:var(--sh-xs);outline:none}
.qz-card textarea:focus-visible{border-color:var(--ring);box-shadow:0 0 0 3px color-mix(in oklab,var(--ring) 50%,transparent)}.qz-card textarea:disabled{cursor:not-allowed;opacity:.5}
.qz-hint{font-size:12px;line-height:16px;color:var(--muted-foreground)}
.qz-foot{position:sticky;bottom:0;z-index:10;border-top:1px solid var(--border);padding-bottom:env(safe-area-inset-bottom,0px);background:color-mix(in oklab,var(--background) 90%,transparent);-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px)}
.qz-fin{display:flex;align-items:center;justify-content:space-between;gap:.5rem;width:100%;max-width:48rem;margin:0 auto;padding:.75rem 1rem}
.qz .btn{border-radius:.75rem}.qz .btn .xs{display:none}@media(max-width:639px){.qz .btn .xs{display:inline}.qz .btn .sm-up{display:none}}
@media(min-width:640px){.qz-t h1{font-size:16px;line-height:24px}.qz-clock{font-size:18px;line-height:28px}.qz-main{padding-top:1.5rem;padding-bottom:1.5rem}.qz-card{padding:1.5rem}.qz-qh h2{font-size:18px}}
</style>
<script>
/* ===== Quizzes: manager, trainee attempt, review ===== */
const qStatus = s => statusBadge(s).replace(/>(\w+)</, (m, t) => '>' + ({ in_progress: 'In progress', graded: 'Graded', submitted: 'Awaiting review', available: 'Available' }[s] || t) + '<');

route('/quizzes', async (p, q, id) => {
  loadingShell('/quizzes', 'Quizzes');
  const d = await A('quizzes.list'); if (!current(id)) return;
  if (d.mode === 'trainee') {
    return mount(shell('/quizzes', 'My quizzes', '', d.quizzes.length ? '<div class="grid g2">' + d.quizzes.map(z => '<div class="card"><div class="bd stack"><div class="row between"><h2>' + h(z.title) + '</h2>' + qStatus(z.status) + '</div><div class="muted small">' + h(z.phase) + ' · ' + z.duration_minutes + ' min · ' + num(z.total_points) + ' points</div>' +
      (z.status === 'graded' ? '<div>Score: <b>' + num(z.score) + '</b> / ' + num(z.total_points) + '</div>' : '') + '<div>' + (z.status === 'in_progress' ? '<a class="btn primary" href="#/quizzes/attempts/' + h(z.attempt_id) + '" data-go="/quizzes/attempts/' + h(z.attempt_id) + '">Continue</a>' : z.status === 'available' ? '<a class="btn primary" href="#/quizzes/' + h(z.id) + '" data-go="/quizzes/' + h(z.id) + '">View and start</a>' : '<a class="btn" href="#/quizzes/' + h(z.id) + '" data-go="/quizzes/' + h(z.id) + '">View</a>') + '</div></div></div>').join('') + '</div>' : '<div class="card">' + emptyState('No quizzes have been assigned to you.', 'quiz') + '</div>'));
  }
  mount(shell('/quizzes', 'Quizzes', d.can_create ? '<a class="btn primary" href="#/quizzes/create" data-go="/quizzes/create">' + icon('plus') + 'New quiz</a>' : '', '<div class="card">' + table([{ h: 'Quiz', f: z => '<a href="#/quizzes/' + h(z.id) + '" data-go="/quizzes/' + h(z.id) + '"><b>' + h(z.title) + '</b></a><div class="muted small">' + h(z.phase) + '</div>' }, { h: 'Questions', cls: 'center', f: z => z.question_count + ' · ' + num(z.total_points) + ' pts' }, { h: 'Time', cls: 'hide-sm', f: z => z.duration_minutes + ' min' }, { h: 'Access', cls: 'center', f: z => z.access_count },
    { h: 'Attempts', cls: 'center', f: z => z.submitted_count + '/' + z.attempt_count }, { h: 'To review', cls: 'center', f: z => z.pending_review ? badge(z.pending_review, 'warn') : '—' }, { h: '', cls: 'right', f: z => '<a class="btn sm" href="#/quizzes/' + h(z.id) + '/edit" data-go="/quizzes/' + h(z.id) + '/edit">' + icon('edit') + 'Edit</a>' }], d.quizzes, 'No quizzes yet. Quizzes exist for Phase 1 and the Final Examination.') + '</div>'));
});

/* ---------- quiz editor ---------- */
let QF = { questions: [], locked: false };
const blankQ = type => ({ type: type || 'multiple_choice', prompt: '', points: 1, options: type === 'paragraph' ? null : ['', ''], correct_option: type === 'paragraph' ? null : 0 });
function syncQF() {
  QF.questions = $$('.qeditor').map(el => {
    const type = $('[name=q-type]', el).value, q = { id: el.dataset.qid || undefined, type, prompt: $('[name=q-prompt]', el).value, points: $('[name=q-points]', el).value };
    if (type === 'multiple_choice') { q.options = $$('.q-opt', el).map(i => i.value); const r = $('input[type=radio]:checked', el); q.correct_option = r ? parseInt(r.value, 10) : 0; }
    return q;
  });
}
function renderQuestions() {
  const box = $('#qlist'); if (!box) return;
  box.innerHTML = QF.questions.map((q, i) => {
    const locked = QF.locked && q.id;
    return '<div class="qeditor" data-i="' + i + '" data-qid="' + h(q.id || '') + '"><div class="row between" style="margin-bottom:10px"><b>Question ' + (i + 1) + '</b><span class="row"><button type="button" class="btn sm" data-act="qMove" data-i="' + i + '" data-d="-1"' + (locked || i === 0 ? ' disabled' : '') + ' aria-label="Move up">↑</button><button type="button" class="btn sm" data-act="qMove" data-i="' + i + '" data-d="1"' + (locked || i === QF.questions.length - 1 ? ' disabled' : '') + ' aria-label="Move down">↓</button><button type="button" class="btn sm danger" data-act="qRemove" data-i="' + i + '"' + (locked ? ' disabled' : '') + ' aria-label="Remove">' + icon('trash') + '</button></span></div>' +
      '<div class="grid g2"><div class="field"><label>Type</label><select name="q-type" data-act="qType" data-i="' + i + '"><option value="multiple_choice"' + (q.type === 'multiple_choice' ? ' selected' : '') + '>Multiple choice (auto-graded)</option><option value="paragraph"' + (q.type === 'paragraph' ? ' selected' : '') + '>Paragraph (manual review)</option></select></div><div class="field"><label>Points</label><input type="number" name="q-points" min="0.01" step="0.01" value="' + h(q.points) + '"></div></div>' +
      '<div class="field"><label>Prompt</label><textarea name="q-prompt" maxlength="10000">' + h(q.prompt) + '</textarea></div>' +
      (q.type === 'multiple_choice' ? '<div class="field"><label>Answer options (select the correct one)</label>' + q.options.map((o, j) => '<div class="opt"><input type="radio" name="q-correct-' + i + '" value="' + j + '"' + (q.correct_option === j ? ' checked' : '') + ' aria-label="Correct answer"><input type="text" class="q-opt" maxlength="1000" value="' + h(o) + '" placeholder="Option ' + (j + 1) + '"><button type="button" class="btn sm ghost" data-act="optRemove" data-i="' + i + '" data-j="' + j + '"' + (q.options.length <= 2 ? ' disabled' : '') + ' aria-label="Remove option">' + icon('x') + '</button></div>').join('') + (q.options.length < 8 ? '<button type="button" class="btn sm" data-act="optAdd" data-i="' + i + '">' + icon('plus') + 'Add option</button>' : '') + '</div>' : '') + '</div>';
  }).join('') || '<p class="muted">No questions yet.</p>';
}
function quizFormPage(d) {
  const z = d.quiz; QF = { questions: z ? z.questions.map(q => ({ id: q.id, type: q.type, prompt: q.prompt, points: q.points, options: q.options, correct_option: q.correct_option })) : [blankQ()], locked: d.has_attempts };
  const comps = (z && !d.components.some(c => c.key === z.grade_component_key) ? [{ key: z.grade_component_key, label: z.grade_component_key }] : []).concat(d.components);
  return '<form data-form="quizSave" ' + (z ? 'data-id="' + h(z.id) + '"' : '') + ' novalidate>' + (d.has_attempts ? '<div class="alert warn">Attempts exist for this quiz. You can edit wording, points and answer keys (submitted attempts are re-graded automatically) and add new questions, but not remove or reorder existing ones.</div>' : '') +
    '<div class="card" style="margin-bottom:16px"><div class="bd"><div class="grid g2">' + field('Phase', select('grade_component_key', comps.map(c => ({ value: c.key, label: c.label })), z ? z.grade_component_key : (comps[0] || {}).key, { disabled: d.has_attempts })) + field('Time limit (minutes)', input('duration_minutes', { type: 'number', value: z ? z.duration_minutes : 30, min: 1, maxn: 65535, required: true })) + '</div>' +
    field('Title', input('title', { value: z && z.title, required: true, max: 150 })) + field('Instructions', '<textarea name="instructions" maxlength="10000" required>' + h(z && z.instructions) + '</textarea>') + '</div></div><div id="qlist"></div>' +
    '<div class="row" style="margin:8px 0 18px"><button type="button" class="btn" data-act="qAdd" data-t="multiple_choice">' + icon('plus') + 'Multiple choice</button><button type="button" class="btn" data-act="qAdd" data-t="paragraph">' + icon('plus') + 'Paragraph</button></div><div class="row"><button class="btn primary" type="submit">' + (z ? 'Save quiz' : 'Create quiz') + '</button><a class="btn" href="#/quizzes" data-go="/quizzes">Cancel</a></div></form>';
}
route('/quizzes/create', async (p, q, id) => {
  loadingShell('/quizzes', 'New quiz'); const d = await A('quizzes.form', {}); if (!current(id)) return;
  if (!d.components.length) return mount(shell('/quizzes', 'New quiz', '', '<div class="alert info">Every quiz-eligible phase already has a quiz.</div>'));
  mount(shell('/quizzes', 'New quiz', '', quizFormPage(d))); renderQuestions();
});
route('/quizzes/:id/edit', async (p, q, id) => {
  loadingShell('/quizzes', 'Edit quiz'); const d = await A('quizzes.form', { id: p.id }); if (!current(id)) return;
  mount(shell('/quizzes', 'Edit quiz', '', quizFormPage(d))); renderQuestions();
});
Actions.qAdd = el => { syncQF(); QF.questions.push(blankQ(el.dataset.t)); renderQuestions(); };
Actions.qRemove = el => { syncQF(); QF.questions.splice(+el.dataset.i, 1); renderQuestions(); };
Actions.qMove = el => { syncQF(); const i = +el.dataset.i, j = i + +el.dataset.d; if (j < 0 || j >= QF.questions.length) return; const t = QF.questions[i]; QF.questions[i] = QF.questions[j]; QF.questions[j] = t; renderQuestions(); };
Actions.optAdd = el => { syncQF(); QF.questions[+el.dataset.i].options.push(''); renderQuestions(); };
Actions.optRemove = el => { syncQF(); const q = QF.questions[+el.dataset.i], j = +el.dataset.j; q.options.splice(j, 1); if (q.correct_option >= q.options.length) q.correct_option = 0; else if (q.correct_option > j) q.correct_option--; renderQuestions(); };
document.addEventListener('change', e => { if (e.target.matches('select[data-act="qType"]')) { syncQF(); const i = +e.target.dataset.i, q = QF.questions[i]; if (q.type === 'paragraph') { q.options = null; q.correct_option = null; } else { q.options = ['', '']; q.correct_option = 0; } renderQuestions(); } });
Forms.quizSave = async f => {
  syncQF(); const v = formVals(f), edit = !!f.dataset.id;
  const payload = { title: v.title, instructions: v.instructions, duration_minutes: v.duration_minutes, grade_component_key: $('[name=grade_component_key]', f).value,
    questions: QF.questions.map(q => { const o = { type: q.type, prompt: q.prompt, points: q.points }; if (q.id) o.id = q.id; if (q.type === 'multiple_choice') { o.options = q.options; o.correct_option = q.correct_option; } return o; }) };
  if (edit) payload.id = f.dataset.id;
  await submitForm(f, edit ? 'quizzes.update' : 'quizzes.create', payload, d => go('/quizzes/' + d.id));
};

/* ---------- quiz detail ---------- */
route('/quizzes/attempts/:id', async (p, q, id) => renderAttempt(p.id, id));
route('/quizzes/:qid/review/:aid', async (p, q, id) => {
  loadingShell('/quizzes', 'Review attempt');
  const d = await A('quizzes.reviewGet', { quiz_id: p.qid, attempt_id: p.aid }); if (!current(id)) return;
  const a = d.attempt, editable = a.status === 'submitted';
  const body = (a.status === 'in_progress' ? '<div class="alert warn">This attempt has not been submitted yet.</div>' : '') +
    '<div class="card"><div class="bd">' + d.questions.map((qq, i) => '<div class="qa"><div class="row between"><b>' + (i + 1) + '. ' + h(qq.prompt).replace(/\n/g, '<br>') + '</b><span class="muted small nowrap">' + num(qq.points) + ' pts</span></div>' +
      (qq.type === 'multiple_choice' ? qq.options.map((o, j) => '<div class="choice ' + (j === qq.correct_option ? 'right' : (j === qq.selected_option ? 'wrong' : '')) + '">' + h(o) + (j === qq.selected_option ? ' <span class="small muted">(trainee’s answer)</span>' : '') + (j === qq.correct_option ? ' <span class="small">✔ correct</span>' : '') + '</div>').join('') + '<div class="small muted">Score: ' + num(qq.auto_score) + ' / ' + num(qq.points) + (qq.selected_option === null ? ' · no answer' : '') + '</div>'
        : '<div class="memo" style="margin:8px 0;white-space:pre-wrap">' + (qq.answer_text ? h(qq.answer_text) : '<span class="muted">No answer given.</span>') + '</div>' + (editable ? '<div class="field" style="max-width:220px"><label>Score (0 – ' + num(qq.points) + ')</label><input type="number" data-score data-qid="' + h(qq.id) + '" min="0" max="' + h(qq.points) + '" step="0.01" value="0"></div>' : '<div class="small muted">Score: ' + num(qq.manual_score) + ' / ' + num(qq.points) + '</div>')) + '</div>').join('') + '</div></div>' +
    (editable ? '<div class="row" style="margin-top:16px"><button class="btn primary" data-act="reviewSave" data-q="' + h(d.quiz.id) + '" data-a="' + h(a.id) + '">Save review and post grade</button></div>' : '<div class="alert ok" style="margin-top:16px">Reviewed. Final score <b>' + num(a.final_score) + '</b> / ' + num(d.quiz.total_points) + ' (auto ' + num(a.auto_score) + ' + manual ' + num(a.manual_score) + ').</div>');
  mount(shell('/quizzes', d.trainee.name, '<a class="btn" href="#/quizzes/' + h(d.quiz.id) + '" data-go="/quizzes/' + h(d.quiz.id) + '">← Quiz</a>', body, h(d.quiz.title) + ' · @' + h(d.trainee.username) + ' · submitted ' + h(fmtDT(a.submitted_at))));
});
Actions.reviewSave = async el => {
  const answers = $$('[data-score]').map(i => ({ question_id: i.dataset.qid, manual_score: i.value }));
  const ok = await confirmDialog({ title: 'Post grade?', message: 'The total is written to the trainee’s gradebook. A reviewed attempt cannot be reviewed again.', confirmText: 'Save review' }); if (!ok) return;
  await busy(el, async () => { await A('quizzes.reviewSave', { quiz_id: el.dataset.q, attempt_id: el.dataset.a, answers }); toast(A.lastMessage, 'ok'); go('/quizzes/' + el.dataset.q); });
};

route('/quizzes/:id', async (p, q, id) => {
  loadingShell('/quizzes', 'Quiz');
  const d = await A('quizzes.show', { id: p.id }); if (!current(id)) return;
  if (d.redirect) return go('/quizzes/attempts/' + d.redirect.id);
  if (d.status) { // trainee view
    const z = d.quiz;
    return mount(shell('/quizzes', z.title, '<a class="btn" href="#/quizzes" data-go="/quizzes">← My quizzes</a>', '<div class="card" style="max-width:720px"><div class="bd stack"><div class="muted">' + h(z.phase) + ' · ' + z.duration_minutes + ' minutes · one attempt only</div><div style="white-space:pre-wrap">' + h(z.instructions) + '</div>' +
      (d.status === 'available' ? '<div class="alert warn">The timer starts when you press Start and keeps running if you leave. You cannot retake the quiz.</div><button class="btn primary" data-act="quizStart" data-id="' + h(z.id) + '">Start quiz</button>' : '<div class="alert ok">You have already completed this quiz. ' + (d.status === 'graded' ? 'It has been graded — see your Grades page.' : 'It is waiting for review.') + '</div>') + '</div></div>'));
  }
  const z = d.quiz;
  const body = '<div class="grid g3"><div class="card stat"><div class="v">' + d.questions.length + '</div><div class="l">Questions</div></div><div class="card stat"><div class="v">' + num(z.total_points) + '</div><div class="l">Total points</div></div><div class="card stat"><div class="v">' + z.duration_minutes + '</div><div class="l">Minutes</div></div></div>' +
    '<div class="card" style="margin-top:16px"><div class="hd"><h2>Instructions</h2></div><div class="bd" style="white-space:pre-wrap">' + h(z.instructions) + '</div></div>' +

async function renderAttempt(attemptId, navId) {

  const fsSupported = document.fullscreenEnabled === true;

    '<div class="qz-r"><div class="qz-clock" id="qz-clock" role="timer" aria-label="Time left">' + icon('qzClock') + '<span id="qz-time"></span></div><span id="qz-save" class="qz-save" role="status"></span></div></div>' +
    '<div class="qz-bar" role="progressbar" aria-label="Answered questions" aria-valuemin="0" aria-valuemax="' + N + '"><div id="qz-fill"></div></div></header>' +
    '<main class="qz-main"><div class="qz-b" id="qz-banners"></div><nav class="qz-nav" id="qz-nav" aria-label="Question progress"></nav><section class="qz-card" id="qz-card"></section></main>' +
    '<footer class="qz-foot"><div class="qz-fin" id="qz-foot"></div></footer></div>');

  /* ----- painting (the question card is only redrawn when the question changes, so typing never loses focus) ----- */
  const paintHead = () => {
    $('#qz-sub').textContent = 'Question ' + (index + 1) + ' of ' + N;
    $('#qz-time').textContent = fmt(secs); $('#qz-clock').classList.toggle('low', secs <= 300);
    const n = questions.filter(isAns).length; $('#qz-fill').style.width = (n / N * 100) + '%'; $('#qz-fill').parentNode.setAttribute('aria-valuenow', n);

      (!last ? '<button type="button" class="btn ghost" data-qa="submit"' + (lk ? ' disabled' : '') + '>Submit quiz</button>' : '') +
      (last ? '<button type="button" class="btn primary" data-qa="submit"' + (lk ? ' disabled' : '') + '>' + (submitting ? 'Submitting…' : 'Submit quiz') + '</button>'

  const paintCard = () => {

      (q.type === 'multiple_choice' ? '<fieldset class="qz-opts"><legend class="sr">Choose one answer</legend>' + (q.options || []).map((o, j) => '<label class="qz-opt' + (a.selected_option === j ? ' sel' : '') + '"><input type="radio" name="qz-' + h(q.id) + '" value="' + j + '"' + (a.selected_option === j ? ' checked' : '') + '><span>' + h(o) + '</span></label>').join('') + '</fieldset>'
        : '<textarea data-qtext="' + h(q.id) + '" maxlength="20000" rows="8" aria-label="Response to question ' + (index + 1) + '">' + h(a.answer_text || '') + '</textarea>') + '<p class="qz-hint" id="qz-hint"></p>';
