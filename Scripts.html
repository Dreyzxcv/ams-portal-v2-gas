/* ---------- theme ---------- */ 
function applyTheme() {
  const pref = Store.get('ams_theme') || 'system';
  const dark = pref === 'dark' || (pref === 'system' && window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches);
  document.documentElement.setAttribute('data-theme', dark ? 'dark' : 'light');
}

/* ---------- API bridge ---------- */
function callApi(action, payload) {
  return new Promise((resolve, reject) => {
    if (!window.google || !google.script || !google.script.run) { reject({ code: 'OFFLINE', message: 'This page must be opened from the deployed web app.' }); return; }
    google.script.run
      .withSuccessHandler(res => { if (res && res.success) resolve(res); else reject((res && res.error) || { code: 'SERVER_ERROR', message: 'Unexpected response from the server.' }); })
      .withFailureHandler(() => reject({ code: 'NETWORK', message: 'Could not reach the server. Check your connection and try again.' }))
      .api(action, State.token, payload || {});
  });
}
/** API call with global handling; resolves with res.data, rejects with the error object. */
async function A(action, payload) {
  try { const r = await callApi(action, payload); if (r.pulse && !Live.first) Live.first = r.pulse; if (r.message) A.lastMessage = r.message; else A.lastMessage = null; return r.data; }
  catch (e) {
    if (e.code === 'UNAUTHENTICATED' && State.user) { clearSession(); toast('Your session has ended. Please sign in again.', 'bad'); go('/login'); }
    else if (e.code === 'PASSWORD_CHANGE_REQUIRED') { State.user && (State.user.force_password_change = true); go('/settings/security'); }
    throw e;
  }
}
function clearSession() { State.user = null; State.token = null; Store.del('ams_token'); Store.sdel('ams_token'); }
function saveToken(t, remember) { State.token = t; if (remember) { Store.set('ams_token', t); Store.sdel('ams_token'); } else { Store.sset('ams_token', t); Store.del('ams_token'); } }

/* ---------- toasts / modals ---------- */
function toast(msg, tone) {
  let box = $('#toasts'); if (!box) { box = document.createElement('div'); box.id = 'toasts'; box.className = 'toasts'; document.body.appendChild(box); }
  const t = document.createElement('div'); t.className = 'toast ' + (tone || ''); t.setAttribute('role', 'status'); t.textContent = msg; box.appendChild(t);
  setTimeout(() => t.remove(), tone === 'bad' ? 7000 : 3800);
}
function openModal(o) {
  const ov = document.createElement('div'); ov.className = 'overlay';
  ov.innerHTML = '<div class="modal ' + (o.wide ? 'wide' : '') + '" role="dialog" aria-modal="true"><div class="hd"><h2>' + h(o.title) + '</h2><button class="btn ghost sm" data-modal-close aria-label="Close">' + icon('x') + '</button></div><div class="bd">' + o.body + '</div>' + (o.footer ? '<div class="ft">' + o.footer + '</div>' : '') + '</div>';
  const close = () => { ov.remove(); if (o.onClose) o.onClose(); };
  ov.addEventListener('mousedown', e => { if (e.target === ov && !o.sticky) close(); });
  ov.addEventListener('click', e => { if (e.target.closest('[data-modal-close]')) close(); });
  document.body.appendChild(ov);
  const first = $('input,textarea,select,button.primary', ov); if (first) first.focus();
  return { el: ov, close };
}
function confirmDialog(o) {
  return new Promise(resolve => {

  for (let i = 0; i <= 4; i++) { const v = Math.round((max * i) / 4), yy = y(v); g += '<line class="grid" x1="' + P.l + '" x2="' + (W - P.r) + '" y1="' + yy + '" y2="' + yy + '"/><text x="' + (P.l - 6) + '" y="' + (yy + 3) + '" text-anchor="end">' + v + '</text>'; }
  weeks.forEach((w, i) => { g += '<text x="' + x(i) + '" y="' + (H - 6) + '" text-anchor="middle">' + h(fmtD(w).replace(/ \d{4}$/, '')) + '</text>'; });
  series.forEach((s, k) => { const pts = s.values.map((v, i) => x(i) + ',' + y(v)).join(' '); g += '<polyline fill="none" stroke="' + colors[k % 3] + '" stroke-width="2.2" points="' + pts + '"/>' + s.values.map((v, i) => '<circle cx="' + x(i) + '" cy="' + y(v) + '" r="3" fill="' + colors[k % 3] + '"><title>' + h(s.label) + ': ' + v + '</title></circle>').join(''); });
  return '<svg class="chart" viewBox="0 0 ' + W + ' ' + H + '" width="100%" role="img" aria-label="Weekly trend chart">' + g + '</svg><div class="row small" style="margin-top:6px">' + series.map((s, k) => '<span class="row" style="gap:6px"><i style="width:10px;height:10px;border-radius:3px;background:' + colors[k % 3] + ';display:inline-block"></i>' + h(s.label) + '</span>').join('') + '</div>';
}

/* ---------- 6-box code input (typing, backspace, arrows, paste, one-time-code autofill) ---------- */
(function () {
  const boxesOf = g => Array.prototype.slice.call(g.querySelectorAll('.otp-box'));
  function focusBox(g, i) { const bs = boxesOf(g), b = bs[Math.min(Math.max(i, 0), bs.length - 1)]; b.focus(); b.select(); }
  function sync(g) {
    const bs = boxesOf(g), code = bs.map(b => b.value).join('');
    g.querySelector('input[type=hidden]').value = code;
    bs.forEach(b => b.classList.toggle('filled', b.value !== ''));
    if (code.length === bs.length && g.hasAttribute('data-autosubmit')) {
      const f = g.closest('form'), btn = f && f.querySelector('[type=submit]');
      if (f && !(btn && btn.disabled)) f.requestSubmit();
    }
  }
  function fill(g, i, raw) {
    const bs = boxesOf(g), chars = String(raw).replace(/\D/g, '').slice(0, bs.length - i).split('').filter(Boolean);
    if (!chars.length) return;
    chars.forEach((c, k) => { bs[i + k].value = c; });
    sync(g); focusBox(g, i + chars.length);
  }
  document.addEventListener('input', e => {
    const b = e.target.closest && e.target.closest('.otp-box'); if (!b) return;
    const g = b.closest('.otp'), i = +b.dataset.i, v = b.value.replace(/\D/g, '');
    if (!v) { b.value = ''; sync(g); return; }
    b.value = ''; fill(g, i, v);
  });
  document.addEventListener('keydown', e => {
    const b = e.target.closest && e.target.closest('.otp-box'); if (!b) return;
    const g = b.closest('.otp'), i = +b.dataset.i;
    if (e.key === 'Backspace') {
      e.preventDefault();
      if (b.value !== '') { b.value = ''; sync(g); }
      else if (i > 0) { boxesOf(g)[i - 1].value = ''; sync(g); focusBox(g, i - 1); }
    } else if (e.key === 'ArrowLeft') { e.preventDefault(); focusBox(g, i - 1); }
    else if (e.key === 'ArrowRight') { e.preventDefault(); focusBox(g, i + 1); }
  });
  document.addEventListener('paste', e => {
    const b = e.target.closest && e.target.closest('.otp-box'); if (!b) return;
    e.preventDefault(); fill(b.closest('.otp'), +b.dataset.i, (e.clipboardData || window.clipboardData).getData('text'));
  });
  document.addEventListener('focusin', e => { if (e.target.classList && e.target.classList.contains('otp-box')) e.target.select(); });
})();

/* ---------- forms ---------- */
function formVals(form) {
  const o = {};
  $$('[name]', form).forEach(el => {
    if (el.type === 'checkbox') o[el.name] = el.checked;
    else if (el.type === 'radio') { if (el.checked) o[el.name] = el.value; }
    else if (el.type === 'file') return;
    else o[el.name] = el.value;

}
function clearErrors(form) { $$('.err', form).forEach(e => e.remove()); $$('.invalid', form).forEach(e => e.classList.remove('invalid')); }
function showErrors(form, e) {

    const el = $('[name="' + k + '"]', form);
    if (el) { el.classList.add('invalid'); const d = document.createElement('div'); d.className = 'err'; d.textContent = e.fields[k]; (el.closest('.field') || el.parentNode).appendChild(d); shown++; }
  });

  else { const first = $('.invalid', form); if (first) first.focus(); }
}
/** Runs an API action for a form with busy state and error mapping. */
async function submitForm(form, action, payload, onOk) {
  const btn = $('[type=submit]', form) || $('button.primary', form);
  if (btn) { btn.disabled = true; btn.dataset.label = btn.textContent; btn.textContent = 'Saving…'; }
  clearErrors(form);
  try { const d = await A(action, payload); if (A.lastMessage) toast(A.lastMessage, 'ok'); if (onOk) await onOk(d); }
  catch (e) { showErrors(form, e); }
  finally { if (btn && btn.isConnected) { btn.disabled = false; btn.textContent = btn.dataset.label; } }
}
async function busy(btn, fn) {
  if (btn) btn.disabled = true;
  try { return await fn(); } catch (e) { toast(e.message || 'Something went wrong.', 'bad'); } finally { if (btn && btn.isConnected) btn.disabled = false; }
}

/* ---------- router ---------- */
/** Pages that refresh themselves (near real time) -> channels they listen to. Mirrors the useEcho/usePoll pages in the Laravel portal. */
const LIVE = {
  '/': ['announcements'], '/announcements': ['announcements'], '/announcements/archive': ['announcements'],
  '/dashboard': ['grades', 'batches'], '/batches': ['batches'], '/batches/:id': ['batches'],
  '/grades': ['grades'], '/grades/:id': ['grades'], '/quizzes': ['quizzes'], '/quizzes/:id': ['quizzes']
};
function route(pattern, handler, opts) {
  const keys = [];
  const re = new RegExp('^' + pattern.replace(/:([a-z_]+)/g, (m, k) => { keys.push(k); return '([^/]+)'; }) + '$');
  Routes.push({ re, keys, handler, opts: Object.assign({ live: LIVE[pattern] || null }, opts || {}) });
}
function parseQuery(s) { const o = {}; (s || '').replace(/^\?/, '').split('&').filter(Boolean).forEach(p => { const [k, v] = p.split('='); o[decodeURIComponent(k)] = decodeURIComponent((v || '').replace(/\+/g, ' ')); }); return o; }
function mount(html) { const y = State.silent ? window.scrollY : 0; $('#root').innerHTML = html; window.scrollTo(0, y); }
async function go(path, replace, silent) {
  State.silent = !!silent; State.liveHook = null; State.live = null; Live.first = null; Live.pending = false;
  if (State.cleanup) { try { State.cleanup(); } catch (e) { /* ignore */ } State.cleanup = null; }
  path = String(path || '/').replace(/^#/, ''); if (path.charAt(0) !== '/') path = '/' + path;
  const [pn, query] = path.split('?'), id = ++State.navId;
  let r = null, params = {};
  for (const rt of Routes) { const m = rt.re.exec(pn); if (m) { r = rt; rt.keys.forEach((k, i) => { params[k] = decodeURIComponent(m[i + 1]); }); break; } }
  if (!r) { mount(publicFrame('<div class="pubwrap">' + emptyState('Page not found.') + '<p class="center"><a href="#/" data-go="/">Go home</a></p></div>')); return; }
  if (!r.opts.public && !State.user) { State.next = path; return go('/login'); }
  if (r.opts.guest && State.user) return go('/dashboard');
  if (State.user && State.user.force_password_change && pn !== '/settings/security' && !r.opts.public) { toast('You must change your temporary password before continuing.', 'bad'); return go('/settings/security'); }
  // Graduates can only use their dashboard (and Settings to change their password).
  if (State.user && State.user.role === 'graduate' && !r.opts.public && pn !== '/dashboard' && pn.indexOf('/settings') !== 0) return go('/dashboard');
  State.path = pn; State.q = parseQuery(query); State.params = params; State.live = r.opts.live || null;
  try { window.history.replaceState(null, '', '#' + path); } catch (e) { try { window.location.hash = path; } catch (e2) { /* sandboxed */ } }
  // Remember the page so a browser refresh reopens it (the web app lives in an iframe, so its own #hash does not survive a reload).
  Store.sset('ams_last', path);
  try { if (window.google && google.script && google.script.history) google.script.history.replace(null, null, path); } catch (e) { /* not in a deployed web app */ }
  try { await r.handler(params, State.q, id); }
  catch (e) { if (id === State.navId && !silent) mount(State.user ? shell(pn, 'Something went wrong', '', '<div class="alert bad">' + h(e.message || 'Unexpected error') + '</div><button class="btn" data-act="reload">Try again</button>') : publicFrame('<div class="pubwrap"><div class="alert bad">' + h(e.message || 'Unexpected error') + '</div><button class="btn" data-act="reload">Try again</button></div>')); }
  finally { if (id === State.navId) State.silent = false; }
}
const current = id => id === State.navId;
function setQuery(upd) { const q = Object.assign({}, State.q, upd); Object.keys(upd).forEach(k => { if (upd[k] === '' || upd[k] === null) delete q[k]; }); if (!('page' in upd)) delete q.page; return go(State.path + qs(q), false, true); }

function saveBlob(base64, mime, name) {

/* ---------- global events ---------- */
document.addEventListener('click', e => {
  const g = e.target.closest('[data-go]');
  if (g && !e.ctrlKey && !e.metaKey) { e.preventDefault(); $('#sidebar') && $('#sidebar').classList.remove('open'); go(g.getAttribute('data-go')); return; }
  const a = e.target.closest('[data-act]');
  if (a && Actions[a.dataset.act]) { e.preventDefault(); Promise.resolve(Actions[a.dataset.act](a, e)).catch(err => toast((err && err.message) || 'Something went wrong.', 'bad')); }

  const f = e.target.closest('form[data-form]');

let searchTimer = null;

  const t = e.target;

    await setQuery({ search: term });
    const n = $('input[type=search][name=search], input[data-search]');
    if (n) {
      n.value = t.isConnected ? n.value : val;   // keep anything typed while loading
      n.focus(); const L = n.value.length; try { n.setSelectionRange(L, L); } catch (err) { /* ignore */ }
    }

});

/* ---------- near real time: polling (Apps Script cannot push) ---------- */
/* Every API reply carries the current channel stamps; the page remembers the ones from its own first load (Live.first).
   Every LIVE_MS the browser asks for the stamps only (cache read, no sheet access). If a channel this page listens to has
   changed, the page quietly re-renders (same scroll position, no skeleton). While you are typing, a dialog/menu is open, or
   the tab is hidden, the refresh waits so nothing you are doing is interrupted. */
const LIVE_MS = 8000;
const Live = { first: null, pending: false, busy: false };
function liveIdle() {
  if (document.hidden || $('.overlay')) return false;
  const ae = document.activeElement;
  if (ae && ae !== document.body && /^(INPUT|TEXTAREA|SELECT)$/.test(ae.tagName) && $('#root') && $('#root').contains(ae)) return false;
  const sb = $('#sidebar'); if (sb && sb.classList.contains('open')) return false;
  const um = $('#usermenu'); if (um && !um.classList.contains('hidden')) return false;
  return true;
}
async function liveTick() {
  const want = State.live;
  if (Live.busy || document.hidden || !want || !Live.first) return;
  Live.busy = true;
  try {
    if (!Live.pending) {
      const r = await callApi('live.pulse'), s = r.data || {};
      if (want.some(c => s[c] !== Live.first[c])) Live.pending = true;
    }
    if (Live.pending && liveIdle()) {
      Live.pending = false;
      if (State.liveHook) { Live.first = null; await State.liveHook(); }
      else await go(State.path + qs(State.q), false, true);
    }
  } catch (e) { /* silent: try again next tick */ }
  Live.busy = false;
}
setInterval(liveTick, LIVE_MS);
document.addEventListener('visibilitychange', () => { if (!document.hidden) liveTick(); });
Actions.reload = () => go(State.path + qs(State.q));
Actions.logout = async () => { try { await A('auth.logout'); } catch (e) { /* ignore */ } clearSession(); toast('Signed out.'); go('/'); };
window.addEventListener('error', () => { /* surfaced per-call; avoid blank screens */ });
try { window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', applyTheme); } catch (e) { /* old browsers */ }
