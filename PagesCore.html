<script>
/* ===== Dashboard, users, batches, grades, violations, progress ===== */

/* ---- dashboard (ported 1:1 from resources/js/pages/dashboard.tsx) ---- */
const greeting = () => { const hr = new Date().getHours(); return hr < 12 ? 'Good morning' : hr < 18 ? 'Good afternoon' : 'Good evening'; };
const chipIcon = (i, tone, cls) => '<span class="chipicon t-' + tone + (cls ? ' ' + cls : '') + '">' + icon(i) + '</span>';
const sBadge = (tone, text) => '<span class="statusbadge t-' + tone + '">' + h(text) + '</span>';
const meterHtml = (value, total, tone, label) => { const pct = total > 0 ? Math.max(0, Math.min(100, (value / total) * 100)) : 0; return '<div class="meter t-' + tone + '" role="progressbar"' + (label ? ' aria-label="' + h(label) + '"' : '') + ' aria-valuenow="' + value + '" aria-valuemin="0" aria-valuemax="' + total + '"><i style="width:' + pct + '%"></i></div>'; };
/** Ring with optional centred content (Ring in the original). */
function ringHtml(pct, tone, size, inner) {
  size = size || 112; const sw = 10, r = (size - sw) / 2, c = 2 * Math.PI * r, p = Math.max(0, Math.min(100, pct));
  return '<div class="ring t-' + tone + '" style="width:' + size + 'px;height:' + size + 'px" role="img" aria-label="' + Math.round(p) + '%"><svg width="' + size + '" height="' + size + '"><circle cx="' + size / 2 + '" cy="' + size / 2 + '" r="' + r + '" fill="none" stroke-width="' + sw + '" style="stroke:color-mix(in oklab,var(--foreground) 10%,transparent)"/><circle cx="' + size / 2 + '" cy="' + size / 2 + '" r="' + r + '" fill="none" stroke-width="' + sw + '" stroke-linecap="round" stroke-dasharray="' + c + '" stroke-dashoffset="' + (c - (p / 100) * c) + '" style="stroke:var(--tb)"/></svg><div class="c">' + (inner !== undefined ? inner : '<span style="font-size:20px;font-weight:600;font-variant-numeric:tabular-nums">' + Math.round(p) + '%</span>') + '</div></div>';
}
function heroHtml(o) {
  return '<div class="hero">' + (o.deco ? '<span class="deco">' + icon(o.deco).replace('<svg ', '<svg style="width:100%;height:100%;stroke-width:1.5" ') + '</span>' : '') +
    '<div class="row2"><div style="min-width:0"><p class="greet" style="margin:0">' + greeting() + '</p><h1>' + h(o.title) + '</h1><p class="sub" style="margin:.5rem 0 0">' + h(o.subtitle) + '</p>' +
    (o.chips && o.chips.length ? '<dl class="chips">' + o.chips.map(c => '<div class="chip"><dd class="tc t-' + c.tone + '" style="margin:0"><b>' + h(c.value) + '</b></dd><dt class="muted" style="font-size:12px">' + h(c.label) + '</dt></div>').join('') + '</dl>' : '') +
    '</div>' + (o.aside ? '<div style="position:relative">' + o.aside + '</div>' : '') + '</div></div>';
}
const dpanel = (title, ic, aside, inner, cls) => '<section class="dcard dpanel' + (cls ? ' ' + cls : '') + '"><header><h2>' + (ic ? icon(ic) : '') + h(title) + '</h2>' + (aside || '') + '</header>' + inner + '</section>';
const sumCard = o => '<div class="dcard sumcard t-' + o.tone + '"><div class="top">' + chipIcon(o.icon, o.tone) + (o.badge || '') + '</div><div class="big">' + o.value + '</div><div class="lbl">' + h(o.label) + '</div></div>';
const barRow = (label, right, value, total, tone) => '<div class="barrow t-' + tone + '"><div class="hd2"><span>' + h(label) + '</span><b>' + h(right) + '</b></div>' + meterHtml(value, total, tone, label) + '</div>';
const dlink = (href, cls, inner) => '<a class="' + cls + '" href="' + h(href) + '" data-go="' + h(href.replace(/^#/, '')) + '">' + inner + '</a>';
const fixScore = c => (c.score === undefined || c.score === '' ? Object.assign({}, c, { score: null }) : c);

route('/dashboard', async (p, q, id) => {
  loadingShell('/dashboard', '');
  const d = await A('dashboard.get');
  if (!current(id)) return;
  if (d.mode === 'trainee') return renderTraineeDash(d.trainee);
  mount(shell('/dashboard', '', '', renderStaffDash(d), '', 'Dashboard'));
});

/* ---------- Trainee (TraineeView) ---------- */
function renderTraineeDash(t) {
  const entered = Number(t.grades_entered), passed = Number(t.grades_passed), total = Number(t.grades_total), v = Number(t.violations), issued = !!t.certificate_number;
  const comps = (t.components || []).map(fixScore), hasComps = comps.length > 0;
  const scored = comps.filter(c => c.score !== null && c.max && isFinite(Number(c.score))), sumS = scored.reduce((a, c) => a + Number(c.score), 0), sumM = scored.reduce((a, c) => a + Number(c.max), 0);
  const avg = sumM > 0 ? Math.round((sumS / sumM) * 10000) / 100 : null;
  const anyFail = comps.some(c => c.passed === false), allPass = hasComps && comps.every(c => c.passed === true);
  const complete = total > 0 && entered >= total, pct = total > 0 ? Math.min(100, Math.round((entered / total) * 100)) : 0;

  const first = avg !== null
    ? sumCard({ icon: 'grades', tone: 'blue', value: h(avg) + '%', label: 'Overall average', badge: anyFail ? sBadge('rose', 'Fail') : allPass ? sBadge('emerald', 'Pass') : sBadge('amber', 'Pending') })
    : sumCard({ icon: 'grades', tone: 'blue', value: passed + '<small> of ' + total + '</small>', label: 'Grades passed', badge: total === 0 ? sBadge('muted', 'No grades yet') : passed === total ? sBadge('emerald', 'All passed') : entered > passed ? sBadge('amber', (entered - passed) + ' not passed') : sBadge('muted', Math.max(0, total - entered) + ' pending') });

  const gradesBody = total === 0 ? '<p class="muted center" style="padding:1.5rem 0;margin:0;font-size:14px">No graded components yet.</p>'
    : hasComps ? comps.map((c, i) => { const has = c.score !== null, tone = !has ? 'muted' : c.passed === false ? 'rose' : 'emerald';
        return barRow(c.name || 'Component ' + (i + 1), has ? String(c.score) + (c.max ? '/' + c.max : '') : 'N/A', has ? Number(c.score) : 0, Number(c.max || 0), tone); }).join('')
    : barRow('Grades entered', entered + '/' + total, entered, total, 'blue') + barRow('Grades passed', passed + '/' + total, passed, total, 'emerald');

  const progressBody = '<div class="dprog"><div class="mid">' + (complete
    ? '<div class="done">' + ringHtml(100, 'emerald', 120, '<span class="tc t-emerald" style="width:2rem;height:2rem;display:block">' + icon('grades') + '</span>') + '<p class="t-emerald tc" style="margin:.75rem 0 0;font-size:18px;font-weight:600">Training completed</p><p class="muted" style="margin:0;font-size:12px">All graded components are in</p></div>'
    : '<div class="split">' + ringHtml(pct, 'sky', 120, '<span style="font-size:24px;line-height:32px;font-weight:600;font-variant-numeric:tabular-nums">' + pct + '%</span><span class="muted" style="font-size:11px">complete</span>') +
      '<div class="pair"><div class="softbox t-sky"><b>' + h(t.current_phase !== null && t.current_phase !== undefined ? t.current_phase : '—') + '</b><span>Current Phase</span></div>' +
      '<div class="softbox t-amber"><b>' + h(t.batch_ended ? 'Ended' : (t.remaining_days === null || t.remaining_days === undefined ? '—' : t.remaining_days)) + '</b><span>Days left</span></div></div></div>') + '</div>' +
    '<dl class="foot"><div><dt class="muted">Batch</dt><dd>' + h(t.batch || 'Not assigned') + '</dd></div><div><dt class="muted">Started on</dt><dd>' + h(t.started_on || 'Not set') + '</dd></div></dl></div>';

  const certBody = '<div class="dcert"><div class="row" style="gap:1rem;flex-wrap:nowrap">' + chipIcon(issued ? 'circleCheck' : 'cert', issued ? 'emerald' : 'muted', 'lg') +
    (issued ? '<div style="min-width:0"><p class="t-emerald tc" style="margin:0;font-size:16px;font-weight:600">Certificate issued</p><p class="muted" style="margin:0;font-size:12px">ID: ' + h(t.certificate_number) + '</p>' + (t.certificate_issued_at ? '<p class="muted" style="margin:0;font-size:12px">Issued: ' + h(t.certificate_issued_at) + '</p>' : '') + '</div>'
      : '<div><p style="margin:0;font-size:14px;font-weight:600">Not issued yet</p><p class="muted" style="margin:0;font-size:12px">Your certificate will appear here once it is issued.</p></div>') + '</div>' +
    (issued && t.certificate_id ? '<div class="row"><button class="btn" data-act="certPreview" data-id="' + h(t.certificate_id) + '">Open in new tab</button><button class="btn primary" data-act="certDownload" data-id="' + h(t.certificate_id) + '">Download</button></div>' : '') + '</div>';

  const body = '<div class="dg">' + heroHtml({ deco: 'stethoscope', title: State.user.name, subtitle: (t.batch || 'No batch assigned') + '. Here is where your training stands today.', aside: ringHtml(pct, 'sky', 104) }) +
    '<div class="dg dg-3sm">' + first +
    sumCard({ icon: 'alert', tone: v === 0 ? 'emerald' : 'amber', value: v, label: 'Violations', badge: v === 0 ? sBadge('emerald', 'Clean record') : sBadge('amber', v + ' recorded') }) +
    sumCard({ icon: issued ? 'circleCheck' : 'cert', tone: issued ? 'emerald' : 'muted', value: issued ? 'Issued' : 'Not yet', label: 'Certificate', badge: issued ? sBadge('emerald', 'Complete') : sBadge('muted', 'Waiting') }) + '</div>' +
    '<div class="dg dg-2lg" style="align-items:stretch">' + dpanel('Grades overview', 'clipboard', '', '<div class="dbars">' + gradesBody + '</div>') + dpanel('Training progress', 'flag', '', progressBody) + '</div>' +
    dpanel('Certificate status', 'cert', '', certBody) + '</div>';
  mount(shell('/dashboard', '', '', body, '', 'Dashboard'));
}

/* ---------- Staff (Dashboard page + NeedsAttention / KpiCard / TrendPanel / ...) ---------- */
const GROUP_ICON = { Users: 'users', Batches: 'batch', Grades: 'grades', Violations: 'alert', Progress: 'hourglass', Certificates: 'cert' };
const ACTION_LABELS = { Users: 'Manage users', Batches: 'Batches', Grades: 'Manage grades', Violations: 'Manage violations', Progress: 'Manage progress' };
const KEY_SPECS = [
  { group: 'Users', label: 'Active users', title: 'Active users', icon: 'users', tone: 'blue' },
  { label: 'Active trainees without a batch', title: 'Trainees without a batch', icon: 'userX', tone: 'amber' },
  { group: 'Violations', label: 'Last 30 days', title: 'Violations, 30 days', icon: 'alert', tone: 'rose' },
  { group: 'Certificates', label: 'Pending', title: 'Pending certificates', icon: 'cert', tone: 'violet' },
  { label: 'Grades entered, last 7 days', title: 'Grades entered, 7 days', icon: 'clipboard', tone: 'teal' },
  { label: 'Trainees who passed the final exam', title: 'Passed final exam', icon: 'grades', tone: 'emerald' }];
const ATTN_SPECS = [
  { label: 'Active trainees without a batch', title: 'Trainees without a batch', icon: 'userX', tone: 'amber' },
  { group: 'Certificates', label: 'Pending', title: 'Certificates pending', icon: 'cert', tone: 'amber' },
  { group: 'Violations', label: 'Last 30 days', title: 'Violations this month', icon: 'alert', tone: 'amber' }];
function resolveSpecs(groups, specs) {
  const out = [];
  specs.forEach(spec => { for (const g of groups) { if (spec.group && g.title !== spec.group) continue; const stat = g.stats.find(s => s.label === spec.label); if (stat) { out.push(Object.assign({}, spec, { group: g.title, stat })); break; } } });
  return out;
}
function kpiCard(k) {
  const s = k.stat, inner = '<div class="top">' + chipIcon(k.icon, k.tone, 'sm') + (s.href ? '<span class="muted arrow">' + icon('arrowUpRight') + '</span>' : '') + '</div><div class="kv' + (k.emphasis && Number(s.value) > 0 ? ' tc t-amber' : '') + '">' + h(s.value) + '</div><div class="kt">' + h(k.title) + '</div><div class="ks">' + h(k.group) + '</div>';
  return s.href ? dlink(s.href, 'dcard kpi hov', inner) : '<div class="dcard kpi">' + inner + '</div>';
}
function needsAttention(items) {
  const open = items.filter(i => Number(i.stat.value) > 0);
  if (!open.length) return '<div class="attnok"><span class="t-emerald tc">' + icon('circleCheck') + '</span>Nothing needs attention right now.</div>';
  return '<div class="attnbox"><p class="ttl t-amber">' + icon('alert') + 'Needs attention</p><ul class="dg-attn">' + open.map(i => {
    const row = '<span class="num t-amber">' + h(i.stat.value) + '</span><span style="min-width:0;flex:1"><span class="nm">' + h(i.title) + '</span><span class="gp">' + icon(i.icon) + h(i.group) + '</span></span>' + (i.stat.href ? '<span class="muted chev">' + icon('chevronRight') + '</span>' : '');
    return '<li>' + (i.stat.href ? dlink(i.stat.href, 'attnitem hov', row) : '<div class="attnitem">' + row + '</div>') + '</li>'; }).join('') + '</ul></div>';
}
function moreFigures(groups) {
  const shown = groups.filter(g => g.stats.length > 0); if (!shown.length) return '';
  return dpanel('All figures', 'batch', '', '<div class="dg-more">' + shown.map(g => '<div class="figbox"><h3>' + icon(GROUP_ICON[g.title] || 'batch') + h(g.title) + '</h3><dl>' + g.stats.map(s =>
    '<div class="figrow"><dt class="muted">' + (s.href ? dlink(s.href, 'fl', h(s.label)) : h(s.label)) + '</dt><dd>' + h(s.value) + '</dd></div>').join('') + '</dl></div>').join('') + '</div>');
}
function quickActions(actions) {
  return dpanel('Quick actions', 'zap', '', '<nav class="dg-qa" aria-label="Quick actions">' + actions.map((a, i) => dlink(a.href, 'qa' + (i === 0 ? ' primary' : ''), icon(a.icon) + '<span style="flex:1">' + h(a.label) + '</span><span class="chev">' + icon('chevronRight') + '</span>')).join('') + '</nav>');
}
function batchOverview(batches, href) {
  const shown = batches.slice(0, 4), extra = batches.length - shown.length, mx = Math.max(1, ...shown.map(b => Number(b.members)));
  return dpanel('Batch overview', 'batch', href ? dlink(href, 'asidelink', 'Manage') : '', batches.length === 0 ? '<p class="muted center" style="padding:0 1.25rem 1.5rem;margin:0;font-size:14px">No batches yet.</p>'
    : '<ul class="blist">' + shown.map(b => '<li><div class="bh"><span class="bn">' + h(b.name) + '</span><span class="muted bm" aria-label="' + h(b.members) + ' trainees">' + h(b.members) + ' trainees</span></div>' + meterHtml(Number(b.members), mx, 'violet', b.name) + '</li>').join('') + (extra > 0 ? '<li class="muted" style="font-size:12px">+' + extra + ' more batches</li>' : '') + '</ul>');
}
const SERIES_COLOR = { 'Grades entered': '#10b981', Violations: '#f59e0b' };
const weekLbl = iso => new Date(iso + 'T00:00:00').toLocaleDateString(undefined, { month: 'short', day: 'numeric' });
function barChart(trend, width) {
  const n = trend.weeks.length, k = trend.series.length, H = 176, P = { l: 26, r: 8, t: 4, b: 22 }, W = width;
  const max = Math.max(0, ...trend.series.flatMap(s => s.values)), step = Math.max(1, Math.ceil(Math.max(max, 3) / 3)), top = step * 3;
  const pw = W - P.l - P.r, ph = H - P.t - P.b, cw = pw / n, y = v => P.t + ph - (v / top) * ph;
  let g = '';
  for (let i = 0; i <= 3; i++) { const yy = y(i * step); g += '<line x1="' + P.l + '" x2="' + (W - P.r) + '" y1="' + yy + '" y2="' + yy + '" stroke="var(--border)" stroke-dasharray="3 3"/><text x="' + (P.l - 8) + '" y="' + (yy + 4) + '" text-anchor="end">' + (i * step) + '</text>'; }
  const gap = 3, bw = Math.min(16, (cw * 0.8 - gap * (k - 1)) / k), gw = bw * k + gap * (k - 1), every = cw < 44 ? 2 : 1;
  trend.weeks.forEach((w, i) => {
    const gx = P.l + cw * i + (cw - gw) / 2;
    if (i % every === 0) g += '<text x="' + (P.l + cw * i + cw / 2) + '" y="' + (H - 6) + '" text-anchor="middle">' + h(weekLbl(w)) + '</text>';
    trend.series.forEach((s, j) => {
      const val = s.values[i]; if (!val) return;
      const x = gx + j * (bw + gap), yt = y(val), hh = P.t + ph - yt, r = Math.min(6, bw / 2, hh), col = SERIES_COLOR[s.label] || 'var(--primary)';
      g += '<path d="M' + x + ',' + (yt + hh) + 'L' + x + ',' + (yt + r) + 'Q' + x + ',' + yt + ' ' + (x + r) + ',' + yt + 'L' + (x + bw - r) + ',' + yt + 'Q' + (x + bw) + ',' + yt + ' ' + (x + bw) + ',' + (yt + r) + 'L' + (x + bw) + ',' + (yt + hh) + 'Z" fill="' + col + '"><title>Week of ' + h(weekLbl(w)) + ' - ' + h(s.label) + ': ' + val + '</title></path>';
    });
  });
  return '<svg class="bchart" width="' + W + '" height="' + H + '" viewBox="0 0 ' + W + ' ' + H + '" aria-hidden="true">' + g + '</svg>';
}
function trendPanel(trend, wide, cls) {
  const all = trend.series.flatMap(s => s.values), max = Math.max(0, ...all), sum = all.reduce((a, b) => a + b, 0), n = trend.weeks.length;
  const summary = 'Weekly counts, ' + weekLbl(trend.weeks[0]) + ' to ' + weekLbl(trend.weeks[n - 1]);
  const host = document.querySelector('.content'), cs = host ? getComputedStyle(host) : null, avail = host ? host.clientWidth - parseFloat(cs.paddingLeft) - parseFloat(cs.paddingRight) : 760;
  const panelW = window.innerWidth >= 1024 && wide ? (avail - 16) * 2 / 3 : avail, W = Math.max(260, Math.round(panelW - 40));
  const inner = max === 0 ? '<p class="muted center" style="padding:2.5rem 1.25rem;margin:0;font-size:14px">Nothing recorded in the last ' + n + ' weeks.</p>'
    : '<div class="dpad"><div class="tlegend muted">' + trend.series.map(s => '<span><i style="background:' + (SERIES_COLOR[s.label] || 'var(--primary)') + '"></i>' + h(s.label) + '</span>').join('') + '<span class="peak">Peak: ' + max + '</span></div>' +
      '<div role="img" aria-label="' + h(summary) + '" style="height:11rem;overflow:hidden">' + barChart(trend, W) + '</div>' +
      '<table class="sr-only"><caption>' + h(summary) + '</caption><thead><tr><th>Week of</th>' + trend.series.map(s => '<th>' + h(s.label) + '</th>').join('') + '</tr></thead><tbody>' + trend.weeks.map((w, i) => '<tr><td>' + h(weekLbl(w)) + '</td>' + trend.series.map(s => '<td>' + s.values[i] + '</td>').join('') + '</tr>').join('') + '</tbody></table></div>';
  return dpanel('Weekly trend', 'clipboard', '<span class="pill">' + sum + ' in ' + n + ' weeks</span>', inner, cls);
}
function activityTable(activity) {
  const when = x => { if (!x) return ''; const dt = new Date(x); return isNaN(dt) ? fmtDT(x) : dt.toLocaleString(); };
  return dpanel('Recent activity', 'clipboard', '', '<div class="dtab"><table><thead><tr><th style="padding-left:1.25rem">When</th><th>Who</th><th>Action</th><th>Subject</th></tr></thead><tbody>' +
    (activity.length ? activity.map(a => '<tr><td class="muted nowrap" style="padding-left:1.25rem">' + h(when(a.occurred_at)) + '</td><td class="nowrap" style="font-weight:500">' + h(a.actor) + '</td><td class="nowrap"><span class="act">' + h(a.action) + '</span></td><td class="muted">' + h(a.subject || '') + '</td></tr>').join('')
      : '<tr><td colspan="4" class="muted center" style="padding:2rem 1.25rem">No activity yet.</td></tr>') + '</tbody></table></div>');
}
function renderStaffDash(d) {
  const key = resolveSpecs(d.groups, KEY_SPECS), attention = resolveSpecs(d.groups, ATTN_SPECS);
  key.forEach(k => { k.emphasis = k.stat.label === 'Active trainees without a batch'; });
  const keyIds = new Set(key.map(k => k.group + '|' + k.stat.label)), rest = d.groups.map(g => ({ title: g.title, stats: g.stats.filter(s => !keyIds.has(g.title + '|' + s.label)) }));
  const bg = d.groups.find(g => g.title === 'Batches'), bst = bg && bg.stats.find(s => s.href), batchesHref = bst ? bst.href : null;
  const side = d.batches != null, trend = d.trend;
  let body = '<div class="dg">' + heroHtml({ title: State.user.name, subtitle: 'Figures shown are limited to what your role can access.', chips: attention.filter(a => Number(a.stat.value) > 0).map(a => ({ label: a.title, value: a.stat.value, tone: 'amber' })) });
  if (!d.groups.length) body += '<p class="muted" style="margin:0;font-size:14px">Your role has no dashboard figures.</p>';
  if (attention.length) body += needsAttention(attention);
  if (key.length) body += '<h2 class="sect">Key figures</h2><div class="dg dg-kpi">' + key.map(kpiCard).join('') + '</div>';
  if (trend || side) body += '<div class="dg dg-trend">' + (trend ? trendPanel(trend, side, side ? 'span2' : 'span3') : '') +
    (side ? '<div class="dg ' + (!trend ? 'span3' : '') + '">' + batchOverview(d.batches, batchesHref) + '</div>' : '') + '</div>';
  body += moreFigures(rest);
  if (d.activity) body += activityTable(d.activity);
  return body + '</div>';
}

/* ---------- users ---------- */
function showCredentials(c, title) {
  const m = openModal({ title: title || 'Account credentials', sticky: true, body: '<div class="alert warn">Share these securely. The password is shown <b>only once</b> and must be changed at first sign-in.</div><div class="field"><label>Username</label><input type="text" readonly value="' + h(c.username) + '" id="cr-u"></div><div class="field"><label>Temporary password</label><input type="text" readonly value="' + h(c.password) + '" id="cr-p" class="mono"></div>',
    footer: '<button class="btn" data-act="copyCreds">Copy both</button><button class="btn primary" data-modal-close>Done</button>' });
  Actions.copyCreds = () => { const t = 'Username: ' + c.username + '\nTemporary password: ' + c.password; try { navigator.clipboard.writeText(t).then(() => toast('Copied.', 'ok')); } catch (e) { $('#cr-p', m.el).select(); document.execCommand('copy'); toast('Copied.', 'ok'); } };
}
const uTone = s => (s === 'active' ? 'emerald' : s === 'suspended' ? 'rose' : 'muted');
const uCap = s => { s = String(s || ''); return s.charAt(0).toUpperCase() + s.slice(1); };
const uPill = (s, big) => `<span class="statusbadge t-${uTone(s)}"${big ? ' style="padding:.375rem .75rem;font-size:14px;font-weight:600"' : ''}>${h(uCap(s))}</span>`;
const uTile = () => '<span class="chipicon t-violet" aria-hidden="true" style="width:3.5rem;height:3.5rem;border-radius:1rem;background:color-mix(in oklab,var(--violet-500) 15%,transparent)">' + bIcon('users', 24) + '</span>';
const uBack = (to, label) => `<a class="btn sm rx" style="background:color-mix(in oklab,var(--background) 70%,transparent)" href="#${to}" data-go="${to}">${icon('arrowLeft')}${label}</a>`;
const uSelStyle = 'width:auto;height:2.25rem;border-radius:.75rem;background:color-mix(in oklab,var(--background) 70%,transparent)';
const roleOpts = rs => rs.map(r => ({ value: r.value, label: r.label }));
const uPager = m => {
  if (!m) return '';
  const from = m.total ? (m.page - 1) * m.per_page + 1 : 0, to = Math.min(m.total, m.page * m.per_page);

const gfmt = v => (v === null || v === undefined ? '-' : String(Number(v)));
const gwhen = iso => { if (!iso) return ''; const d = new Date(iso); return isNaN(d) ? fmtDT(iso) : d.toLocaleString(undefined, { dateStyle: 'medium', timeStyle: 'short' }); };
const GSTATE = { pass: { cls: 'gs-pass', label: 'Passed', icon: 'check' }, fail: { cls: 'gs-fail', label: 'Failed', icon: 'x' }, none: { cls: 'gs-none', label: 'Not graded', icon: 'circleDashed' } };
const gstateOf = r => (r.score === null || r.score === undefined ? 'none' : r.passed === false ? 'fail' : 'pass');
const gpager = m => { if (!m) return ''; const from = m.total ? (m.page - 1) * m.per_page + 1 : 0, to = Math.min(m.total, m.page * m.per_page);
  return '<div class="gpager"><p class="muted" style="margin:0">' + (m.total === 0 ? 'No trainees' : 'Showing ' + from + ' to ' + to + ' of ' + m.total) + '</p><div class="row" style="gap:.5rem">' +
    (m.page > 1 ? '<button class="btn sm rx" data-act="page" data-page="' + (m.page - 1) + '">Previous</button>' : '') + (m.page < m.last_page ? '<button class="btn sm rx" data-act="page" data-page="' + (m.page + 1) + '">Next</button>' : '') + '</div></div>'; };

function scoreRing(pct, cls, inner) {
  const size = 84, w = 7, r = (size - w) / 2, c = 2 * Math.PI * r;
  return '<div class="gring ' + cls + '" style="width:' + size + 'px;height:' + size + 'px"><svg width="' + size + '" height="' + size + '" aria-hidden="true"><circle cx="' + size / 2 + '" cy="' + size / 2 + '" r="' + r + '" fill="none" stroke-width="' + w + '" style="stroke:color-mix(in oklab,var(--foreground) 10%,transparent)"/><circle cx="' + size / 2 + '" cy="' + size / 2 + '" r="' + r + '" fill="none" stroke-width="' + w + '" stroke-linecap="round" stroke-dasharray="' + c + '" stroke-dashoffset="' + (c - (c * Math.min(100, pct)) / 100) + '" style="stroke:var(--g-bar)"/></svg><div class="v">' + inner + '</div></div>';
}
function gradeCard(r) {
  const max = Number(r.max_score), pass = Number(r.pass_score), has = r.score !== null && r.score !== undefined, score = has ? Number(r.score) : 0, st = GSTATE[gstateOf(r)];
  const pct = max > 0 ? Math.min(100, (score / max) * 100) : 0, passPct = max > 0 ? Math.min(100, (pass / max) * 100) : 0;
  return '<div class="dcard gcard ' + st.cls + '">' + scoreRing(pct, st.cls, has ? gfmt(r.score) + '/' + max : '—') +
    '<div style="min-width:0;flex:1;display:grid;gap:.625rem"><div><div class="gt' + (r.is_final ? ' fin' : '') + '">' + h(r.label) + '</div>' + (r.is_final ? '<div class="muted" style="font-size:12px">Final component</div>' : '') + '</div>' +
    '<span class="gpill ' + st.cls + '">' + icon(st.icon) + st.label + '</span>' +
    '<div><div class="gbar" role="progressbar" aria-label="' + h(r.label) + ' score" aria-valuemin="0" aria-valuemax="' + max + '" aria-valuenow="' + score + '"><i style="width:' + pct + '%"></i><span style="left:calc(' + passPct + '% - 1px)"></span></div><div class="muted" style="margin-top:.375rem;font-size:12px;font-variant-numeric:tabular-nums">Passing: ' + pass + '/' + max + '</div></div></div></div>';
}
function gradeEditRow(r, tid) {
  const max = Number(r.max_score), has = r.score !== null && r.score !== undefined, locked = !!r.quiz_locked, off = locked ? ' disabled' : '';
  return '<form class="gedit" data-form="gradeSave" data-tid="' + h(tid) + '" data-cid="' + h(r.component_id) + '" novalidate><div class="lab"><label for="score-' + h(r.component_id) + '" style="font-size:14px;font-weight:500">' + h(r.label) + '</label><div class="muted" style="font-size:12px">Pass at ' + Number(r.pass_score) + ' of ' + max + '</div>' +
    (locked ? '<div class="muted" style="font-size:12px;margin-top:.25rem">' + h(r.quiz_locked) + '</div>' : '') + '</div>' +
    '<div><input class="rx" id="score-' + h(r.component_id) + '" name="score" type="number" inputmode="decimal" step="0.01" min="0" max="' + max + '" value="' + (has ? Number(r.score) : '') + '" placeholder="' + (locked ? 'Graded through the quiz' : '0 – ' + max) + '" aria-label="' + h(r.label) + ' score" required style="font-variant-numeric:tabular-nums"' + off + '></div>' +
    '<div><input class="rx" type="text" name="reason" maxlength="500" placeholder="' + (has ? 'Reason for change (required)' : 'Note (optional)') + '" autocomplete="off" aria-label="' + h(r.label) + ' reason"' + off + '></div>' +
    '<div class="row" style="gap:.5rem"><button class="btn sm primary rx" type="submit" disabled>Save</button></div></form>';
}
function historyItem(r, max) {
  const outOf = max ? ' out of ' + max : '', hadOld = r.old_score !== null && r.old_score !== undefined, hasNew = r.new_score !== null && r.new_score !== undefined, diff = hadOld && hasNew ? Number(r.new_score) - Number(r.old_score) : 0;
  let ic = 'progress', tone = 'gs-info', text;
  if (!hadOld && hasNew) { ic = 'plus'; tone = 'gs-pass'; text = 'Score added: <strong>' + h(gfmt(r.new_score)) + '</strong>' + outOf; }
  else if (hadOld && !hasNew) { ic = 'minus'; tone = 'gs-fail'; text = 'Score removed. It was <strong>' + h(gfmt(r.old_score)) + '</strong>' + outOf; }
  else {
    if (diff > 0) tone = 'gs-pass'; else if (diff < 0) { ic = 'trendingDown'; tone = 'gs-warn'; }
    text = 'Score changed from <strong>' + h(gfmt(r.old_score)) + '</strong> to <strong>' + h(gfmt(r.new_score)) + '</strong>' + outOf + (diff !== 0 ? '<span class="gdiff ' + (diff > 0 ? 'gs-pass' : 'gs-warn') + '">(' + (diff > 0 ? '+' : '') + (Math.round(diff * 100) / 100) + ' points)</span>' : '');
  }
  return '<li class="ghist"><span class="gico ' + tone + '" aria-hidden="true">' + icon(ic) + '</span><div style="min-width:0;flex:1;display:grid;gap:.25rem"><div style="font-size:14px;font-weight:600">' + h(r.component) + '</div><p style="margin:0;font-size:14px">' + text + '</p>' +
    '<p class="muted" style="margin:0;font-size:12px">By ' + h(r.changed_by || 'system') + (r.changed_at ? ' on <time datetime="' + h(r.changed_at) + '">' + h(gwhen(r.changed_at)) + '</time>' : '') + '</p>' +
    (r.reason ? '<p class="greason"><span class="muted">Reason: </span>' + h(r.reason) + '</p>' : '') + '</div></li>';
}
route('/grades/:id', async (p, q, id) => {
  loadingShell('/grades', '');
  const d = await A('grades.show', { id: p.id }); if (!current(id)) return;
  const rows = d.rows, t = d.trainee;
  const scored = rows.filter(r => r.score !== null && r.score !== undefined && Number(r.max_score) > 0), sumS = scored.reduce((a, r) => a + Number(r.score), 0), sumM = scored.reduce((a, r) => a + Number(r.max_score), 0);
  const avg = sumM > 0 ? Math.round((sumS / sumM) * 10000) / 100 : null;
  const anyFail = rows.some(r => r.passed === false), allPass = rows.length > 0 && rows.every(r => r.passed === true);
  const nPass = rows.filter(r => r.passed === true).length, nFail = rows.filter(r => r.passed === false).length, nPend = rows.length - nPass - nFail;
  const overall = anyFail ? { cls: 'gs-fail', label: 'Fail', icon: 'x' } : allPass ? { cls: 'gs-pass', label: 'Pass', icon: 'check' } : { cls: 'gs-warn', label: 'In progress', icon: 'clock' };
  const latest = rows.filter(r => r.graded_by && r.graded_at).sort((a, b) => new Date(b.graded_at) - new Date(a.graded_at))[0];
  const head = '<div class="ghead"><div class="row" style="gap:1rem;flex-wrap:nowrap;min-width:0"><div class="gav" aria-hidden="true">' + h(initials(t.name)) + '</div><div style="min-width:0"><h1 style="overflow:hidden;text-overflow:ellipsis;white-space:nowrap">' + h(t.name) + '</h1><p class="muted" style="margin:0;font-size:14px">@' + h(t.username) + ' · Performance across all training phases</p></div></div>' +
    (d.can.viewAll ? '<a class="btn sm rx" style="background:color-mix(in oklab,var(--background) 70%,transparent)" href="#/grades" data-go="/grades">' + icon('arrowLeft') + 'Back to grades</a>' : '') + '</div>';
  const cards = rows.length === 0 ? '<div class="gempty">' + icon('circleDashed') + '<p style="margin:0;font-weight:500;color:var(--foreground)">No grades yet</p><p style="margin:0">Scores will appear here once they are recorded.</p></div>' : '<div class="gcards">' + rows.map(gradeCard).join('') + '</div>';
  const overallSec = '<section class="dcard goverall ' + overall.cls + '" aria-label="Overall performance"><div class="main"><h2 class="muted" style="margin:0;font-size:14px;font-weight:500">Overall performance</h2><div class="big">' + (avg !== null ? avg + '%' : '—') + '</div>' +
    '<div class="gbar thick" role="progressbar" aria-label="Overall score" aria-valuemin="0" aria-valuemax="100" aria-valuenow="' + (avg || 0) + '"><i style="width:' + Math.min(100, avg || 0) + '%"></i></div>' +
    '<dl class="gchips"><div class="gs-pass"><dd>' + nPass + '</dd> <dt>passed</dt></div><div class="' + (nFail > 0 ? 'gs-fail' : 'gs-none') + '"><dd>' + nFail + '</dd> <dt>failed</dt></div><div class="gs-none"><dd>' + nPend + '</dd> <dt>not graded</dt></div></dl></div>' +
    '<div style="display:flex;flex-direction:column;align-items:flex-end;gap:.5rem;text-align:right"><span class="gpill lg ' + overall.cls + '">' + icon(overall.icon) + overall.label + '</span>' + (latest ? '<p class="muted" style="margin:0;font-size:12px">Updated by ' + h(latest.graded_by) + (latest.graded_at ? ' on ' + h(new Date(latest.graded_at).toLocaleDateString()) : '') + '</p>' : '') + '</div></section>';
  const edit = d.can.manage && rows.length > 0 ? '<section class="dcard gsec"><header><h2>Edit grades</h2><p class="muted">Changing an existing score needs a reason. Every change is kept in the history below.</p></header><div class="gdiv">' + rows.map(r => gradeEditRow(r, t.id)).join('') + '</div></section>' : '';
  const hist = '<section class="dcard gsec"><header><h2>Grade history</h2><p class="muted">Every time a score is added or changed, it is listed here.</p></header>' + (d.revisions.length === 0 ? '<div class="muted center" style="padding:2.5rem 1rem;font-size:14px">No grade changes yet. Updates will show here once a score is added.</div>'
    : '<ol class="gdiv">' + d.revisions.map(r => { const m = rows.find(x => x.label === r.component); return historyItem(r, m ? Number(m.max_score) : null); }).join('') + '</ol>') + '</section>';
  mount(shell('/grades', '', '', '<div class="dg">' + head + cards + overallSec + edit + hist + '</div>', '', [{ t: 'Grades', to: '/grades' }, { t: 'Trainee grades', to: '/grades' }]));
});

Actions.violationDelete = async el => { const ok = await confirmDialog({ title: 'Delete violation?', message: 'Delete this violation?', confirmText: 'Delete', danger: true }); if (!ok) return; await busy(el, async () => { await A('violations.delete', { id: el.dataset.id }); toast(A.lastMessage, 'ok'); go(State.path + qs(State.q), false, true); }); };

/* ---------- progress (ported 1:1 from resources/js/pages/progress/index.tsx and edit.tsx) ---------- */
const pPill = (extra, text) => '<span style="display:inline-flex;align-items:center;border-radius:9999px;padding:.25rem .625rem;font-size:12px;font-weight:500;' + extra + '">' + h(text) + '</span>';
const pTile = (ic, tone) => '<span class="chipicon t-' + tone + '" style="width:2.5rem;height:2.5rem">' + bIcon(ic, 20) + '</span>';
const pDays = t => t.batch_ended ? '<span class="muted">Ended</span>' : t.remaining_days !== null && t.remaining_days !== undefined ? '<span style="font-weight:600;font-variant-numeric:tabular-nums">' + h(t.remaining_days) + '</span>' : '<span class="muted">-</span>';

route('/progress', async (p, q, id) => {
  loadingShell('/progress', '');
  const d = await A('progress.list', { search: q.search, page: q.page }); if (!current(id)) return;
  if (d.redirect) return go('/dashboard');
  const head = '<div class="ghead"><div class="row" style="gap:1rem;flex-wrap:nowrap"><span class="chipicon t-teal" aria-hidden="true" style="width:3.5rem;height:3.5rem;border-radius:1rem;background:color-mix(in oklab,var(--teal-500) 15%,transparent)">' + bIcon('hourglass', 24) + '</span>' +
    '<div><h1>Progress</h1><p class="muted" style="margin:.25rem 0 0;font-size:14px">Current phase (1 to ' + h(d.max_phase) + ') and days left based on each trainee’s batch end date</p></div></div>' +
    '<form data-form="progressSearch" class="row" style="gap:.5rem;flex-wrap:nowrap"><div class="gsearch">' + icon('search') + '<input type="search" name="search" style="width:16rem" placeholder="Search name or username" value="' + h(q.search || '') + '" aria-label="Search trainees"></div></form></div>';
  const rows = d.trainees.length === 0 ? '<tr><td colspan="6" class="muted center" style="padding:3rem 1.25rem">No trainees found.</td></tr>'
    : d.trainees.map(t => '<tr><td style="padding-left:1.25rem"><div class="row" style="gap:.75rem;flex-wrap:nowrap"><span class="gini" aria-hidden="true">' + h(initials(t.name)) + '</span><div style="min-width:0"><div style="font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">' + h(t.name) + '</div><div class="muted" style="font-size:12px">@' + h(t.username) + '</div></div></div></td>' +
      '<td>' + (t.current_phase !== null && t.current_phase !== undefined ? pPill('background:color-mix(in oklab,var(--sky-500) 10%,transparent);color:var(--info-fg)', t.current_phase) : pPill('background:var(--muted);color:var(--muted-foreground)', 'Not set')) + '</td>' +
      '<td class="muted">' + h(t.started_on || 'Not set') + '</td><td>' + pDays(t) + '</td>' +
      '<td class="muted">' + (t.updated_at ? '<div>' + h(new Date(t.updated_at).toLocaleString()) + '</div>' + (t.updated_by ? '<div style="font-size:12px">by ' + h(t.updated_by) + '</div>' : '') : '-') + '</td>' +
      '<td class="right" style="padding-right:1.25rem"><a class="btn sm rx" href="#/progress/' + h(t.id) + '" data-go="/progress/' + h(t.id) + '">Update</a></td></tr>').join('');
  const th = '<th style="padding-left:1.25rem">Trainee</th><th>Phase</th><th>Start date</th><th>Days remaining</th><th>Last update</th><th style="padding-right:1.25rem"></th>';
  mount(shell('/progress', '', '', '<div class="dg">' + head + '<div class="gtab"><div style="overflow-x:auto"><table><thead><tr>' + th + '</tr></thead><tbody>' + rows + '</tbody></table></div></div>' + gpager(d.meta) + '</div>', '', 'Progress'));
});
Forms.progressSearch = f => setQuery({ search: ($('[name=search]', f).value || '').trim() });

route('/progress/:id', async (p, q, id) => {
  loadingShell('/progress', '');
  const d = await A('progress.get', { id: p.id }); if (!current(id)) return;
  const t = d.trainee, pr = d.progress, opts = []; for (let i = 1; i <= d.max_phase; i++) opts.push({ value: i, label: 'Phase ' + i });
  const head = '<div class="ghead"><div class="row" style="gap:1rem;flex-wrap:nowrap;min-width:0"><div class="gav" aria-hidden="true">' + h(initials(t.name)) + '</div><div style="min-width:0"><h1 style="overflow:hidden;text-overflow:ellipsis;white-space:nowrap">' + h(t.name) + '</h1><p class="muted" style="margin:0;font-size:14px">@' + h(t.username) + ' · Update training progress</p></div></div>' +
    '<a class="btn sm rx" style="background:color-mix(in oklab,var(--background) 70%,transparent)" href="#/progress" data-go="/progress">' + icon('arrowLeft') + 'Back to progress</a></div>';
  const stats = '<div style="display:grid;gap:1rem;grid-template-columns:repeat(auto-fit,minmax(18rem,1fr))">' +
    '<div class="dcard" style="padding:1.25rem">' + pTile('calendarClock', 'amber') + '<div style="margin-top:1rem;font-size:36px;line-height:1;font-weight:600;letter-spacing:-.025em;font-variant-numeric:tabular-nums">' + h(d.batch_ended ? 'Ended' : (d.remaining_days !== null && d.remaining_days !== undefined ? d.remaining_days : '-')) + '</div>' +
    '<div class="muted" style="margin-top:.5rem;font-size:14px">' + (d.batch_ends_on ? 'Based on batch end date ' + h(d.batch_ends_on) : 'Set an end date on the trainee’s batch to show days remaining') + '</div></div>' +
    '<div class="dcard" style="padding:1.25rem">' + pTile('clock', 'sky') + '<div style="margin-top:1rem;font-size:14px;font-weight:500">' + (pr.updated_at ? h(new Date(pr.updated_at).toLocaleString()) : 'No progress recorded yet') + '</div>' +
    '<div class="muted" style="margin-top:.5rem;font-size:14px">Last update' + (pr.updated_by ? ' by ' + h(pr.updated_by) : '') + '</div></div></div>';
  const form = '<section class="dcard"><header style="border-bottom:1px solid var(--border);padding:1rem 1.25rem"><h2>Progress details</h2></header><form data-form="progressSave" data-id="' + h(t.id) + '" style="padding:1.25rem" novalidate>' +
    bField('Current phase', 'f-current_phase', rxi(select('current_phase', opts, pr.current_phase))) +
    '<div style="display:grid;gap:.25rem;margin-bottom:1.25rem"><label style="margin:0">Start date</label><p class="muted" style="margin:0;font-size:14px">' + h(d.batch_starts_on || 'Not set') + ' (from the trainee\'s batch)</p></div>' +
    '<div class="row" style="gap:.75rem;padding-top:.25rem"><button class="btn primary rx" type="submit">Save progress</button><a class="btn ghost rx" href="#/progress" data-go="/progress">Cancel</a></div></form></section>';
  mount(shell('/progress', '', '', '<div style="max-width:48rem;margin:0 auto"><div class="dg">' + head + stats + form + '</div></div>', '', [{ t: 'Progress', to: '/progress' }, { t: 'Update progress', to: '/progress' }]));
});
Forms.progressSave = async f => { await submitForm(f, 'progress.save', { id: f.dataset.id, current_phase: formVals(f).current_phase }, () => go(State.path, false, true)); };
</script>
