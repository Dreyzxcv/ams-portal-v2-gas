async function finishLogin(d) {
  saveToken(d.token, !!State.remember);
  if (d.device_token) Store.set('ams_device', d.device_token);
  State.user = d.user; State.pending = null; Store.sdel('ams_pending');
  try { const me = await A('auth.me'); State.intake = me.intake; State.user = me.user; } catch (e) { /* non-fatal */ }
  const next = State.next; State.next = null;
  if (State.user.force_password_change) { toast('Please set a new password to continue.'); return go('/settings/security'); }
  go(next && next.indexOf('/login') !== 0 ? next : '/dashboard');
}
function setPending(p) { State.pending = p; if (p) Store.sset('ams_pending', p); }
const pendingToken = () => State.pending || Store.sget('ams_pending');
function resendButton(label, secs) {
  return '<button type="button" class="btn sm" id="resend" data-act="resend" data-secs="' + (secs || 0) + '">' + h(label) + '</button>';
}
function startCountdown(label) {
  const b = $('#resend'); if (!b) return; let s = parseInt(b.dataset.secs || '0', 10);
  const tick = () => { if (!b.isConnected) return; if (s > 0) { b.disabled = true; b.textContent = 'Resend in ' + s + 's'; s--; setTimeout(tick, 1000); } else { b.disabled = false; b.textContent = label; } };
  tick();
}

LP.slides = [LP.hero]; // add more image URLs here for the About slideshow

function lpAnnInner(anns) {
  return '<div class="lp-ahead"><div class="t">' + lpChip('announce', 'amber') + '<h2 class="lp-h2">Announcements</h2></div>' +
    lpGo('/announcements/archive', 'lp-all', 'View all' + icon('arrowRight')) + '</div>' +
    (anns.length ? '<div class="lp-grid a">' + anns.map(lpAnnCard).join('') + '</div>' :
      '<div class="lp-empty">' + lpChip('announce', 'amber', 'big') + '<b>No announcements yet</b><p>Announcements will show up here once the Office of the Dean posts them.</p></div>') ;
}
const lpPill = intake => intake ? '<span class="lp-pill"><i class="' + (intake.status === 'open' ? '' : 'warn') + '"></i>' + h(intake.message) + '</span>' : '';
const lpChip = (ic, tone, cls) => '<span class="lp-chip lp-t-' + tone + (cls ? ' ' + cls : '') + '">' + icon(ic) + '</span>';
const lpHeading = (title, desc) => '<div class="lp-sh"><h2 class="lp-h2">' + h(title) + '</h2>' + (desc ? '<p>' + h(desc) + '</p>' : '') + '</div>';
const lpPinned = () => '<span class="lp-pin">' + icon('pin') + 'Pinned</span>';
const lpGo = (to, cls, inner) => '<a class="' + cls + '" href="#' + to + '" data-go="' + to + '">' + inner + '</a>';
function lpAnnCard(a, i) {
  return '<article class="lp-card lp-ann"><button type="button" class="hit" data-act="lpAnn" data-i="' + i + '"><span style="position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0,0,0,0)">Read announcement: ' + h(a.subject) + '</span></button>' +
    '<div class="meta"><span>' + h(a.published_label || '') + '</span>' + (a.is_pinned ? lpPinned() : '') + '</div>' +
    '<h3><span class="lp-re">RE:</span>' + h(a.subject) + '</h3>' +
    '<dl><dt>TO:</dt><dd>' + h(a.recipient) + '</dd><dt>FROM:</dt><dd>' + h(a.sender) + '</dd></dl><hr><p class="bd">' + h(a.body) + '</p></article>';
}
function lpSlide(n) {
  const len = LP.slides.length; LP.slide = (n + len) % len;
  const im = $('#lp-slide'); if (im) im.src = LP.slides[LP.slide];
  document.querySelectorAll('.lp-dots button').forEach((b, k) => b.classList.toggle('on', k === LP.slide));
}
Actions.lpMenu = el => { const d = $('#lp-drawer'); if (!d) return; const open = d.classList.toggle('hidden') === false; el.innerHTML = icon(open ? 'x' : 'menu'); };
Actions.lpScroll = el => { const t = document.getElementById(el.dataset.to); const d = $('#lp-drawer'); if (d && !d.classList.contains('hidden')) Actions.lpMenu($('#lp-menubtn')); if (t) t.scrollIntoView({ behavior: 'smooth', block: 'start' }); };
Actions.lpSlide = el => lpSlide(LP.slide + parseInt(el.dataset.d, 10));
Actions.lpDot = el => lpSlide(parseInt(el.dataset.i, 10));
Actions.lpAnn = el => {
  const a = (State.lpAnn || [])[parseInt(el.dataset.i, 10)]; if (!a) return;
  const ov = document.createElement('div'); ov.className = 'overlay';
  ov.innerHTML = '<div class="modal lp-dlg" role="dialog" aria-modal="true"><button class="btn ghost sm lp-x" data-modal-close aria-label="Close">' + icon('x') + '</button>' +
    '<div>' + (a.is_pinned ? lpPinned() : '') + '<h3><span class="lp-re">RE:</span>' + h(a.subject) + '</h3></div>' +
    '<dl><dt>TO:</dt><dd>' + h(a.recipient) + '</dd><dt>FROM:</dt><dd>' + h(a.sender) + '</dd></dl><hr><p class="bd">' + h(a.body) + '</p><p class="sig">' + h(a.signature) + '</p>' + (a.published_label ? '<p class="pub">' + h(a.published_label) + '</p>' : '') + '</div>';
  const close = () => { ov.remove(); document.removeEventListener('keydown', esc); };
  const esc = e => { if (e.key === 'Escape') close(); };
  ov.addEventListener('mousedown', e => { if (e.target === ov) close(); });
  ov.addEventListener('click', e => { if (e.target.closest('[data-modal-close]')) close(); });
  document.addEventListener('keydown', esc); document.body.appendChild(ov);
};

      '<div class="lp-dots">' + LP.slides.map((_, k) => '<button type="button" data-act="lpDot" data-i="' + k + '" aria-label="Slide ' + (k + 1) + '" class="' + (k === 0 ? 'on' : '') + '"></button>').join('') + '</div>' : '') + '</div>' +
    '<div>' + lpHeading('Forged in service, built for medicine', 'The Army Medical School operates under the Army Medical Corps of the Philippine Army, dedicated to producing highly capable medical personnel who embody the values of discipline, integrity, and service.') +
    '<ul class="lp-pts">' + LP.about.map(t => '<li class="lp-card">' + icon('circleCheck') + '<span>' + h(t) + '</span></li>').join('') + '</ul></div></div></section>';

  const programs = '<section id="programs" class="lp-sec">' + lpHeading('Training tracks and roles', 'AMS trains personnel across medical instruction, logistics, and operational roles, each with defined responsibilities and a clear path to advancement.') +

  // near real time (see LIVE in Scripts.html): patch only the intake badge + announcements, keep scroll/menu/slideshow as they are

/* ---------- login ---------- */
route('/login', async () => {
  mount(authFrame('<h1>Welcome back</h1><p>Sign in with your username and password to continue</p>' +
    '<form data-form="login" class="fl" novalidate>' +
    '<div class="g"><label for="f-username">Username</label><div class="iw">' + icon('user') + input('username', { required: true, auto: 'username', max: 100, ph: 'Enter your username' }) + '</div></div>' +
    '<div class="g"><div class="lr"><label for="f-password">Password</label><a href="#/forgot" data-go="/forgot" tabindex="5">Forgot password?</a></div><div class="iw">' + icon('lock') + input('password', { type: 'password', required: true, auto: 'current-password', max: 200, ph: 'Enter your password' }) + '</div></div>' +
    '<label class="check" style="color:var(--muted-foreground)"><input type="checkbox" name="remember"> Keep me signed in</label>' +
    '<button class="btn sky lg" style="margin-top:.25rem" type="submit">Log in</button></form>'));
  const u = $('#f-username'); if (u) u.focus();
}, { public: true, guest: true });
Forms.login = async f => {
  const v = formVals(f); State.remember = !!v.remember;
  await submitForm(f, 'auth.login', { username: v.username, password: v.password, remember: !!v.remember, device_token: Store.get('ams_device') || '' }, async d => {
    if (d.step === 'done') return finishLogin(d);
    setPending(d.pending); State.maskEmail = d.email; State.resendIn = d.resend_in || 0; State.emailAddr = null;
    go(d.step === 'otp' ? '/login/otp' : '/login/email');
  });
};

route('/login/otp', async () => {
  const tok = pendingToken(); if (!tok) return go('/login');
  let info = { email: State.maskEmail || '', resend_in: State.resendIn || 0 };
  if (!State.maskEmail) { try { const d = await A('auth.pending', { pending: tok }); if (d.step !== 'otp') return go('/login/email'); info = d; } catch (e) { setPending(null); toast(e.message, 'bad'); return go('/login'); } }
  mount(authFrame('<h1 style="margin-bottom:4px">Check your email</h1><p class="muted" style="margin:0 0 18px">We sent a 6-digit code to <b>' + h(info.email) + '</b>. It expires in a few minutes.</p>' +
    '<form data-form="otp" novalidate>' + field('Verification code', '<input type="text" name="code" id="f-code" inputmode="numeric" autocomplete="one-time-code" maxlength="6" pattern="[0-9]{6}" required style="letter-spacing:.4em;font-size:20px;text-align:center">') +
    '<label class="check" style="margin-bottom:16px"><input type="checkbox" name="trust"> Trust this device for 30 days</label><button class="btn primary" style="width:100%" type="submit">Verify and sign in</button></form>' +
    '<div class="row between" style="margin-top:14px">' + resendButton('Resend code', info.resend_in) + '<a href="#/login" data-go="/login" class="small">Use a different account</a></div>'));
  startCountdown('Resend code'); $('#f-code').focus();
}, { public: true, guest: true });
Forms.otp = async f => {
  const v = formVals(f);
  await submitForm(f, 'auth.otpVerify', { pending: pendingToken(), code: v.code.trim(), trust: !!v.trust, device_label: (navigator.userAgent || '').slice(0, 100) }, finishLogin);
};
Actions.resend = async el => {
  const email = State.path === '/login/email';
  await busy(el, async () => { const d = await A(email ? 'auth.emailResend' : 'auth.otpResend', { pending: pendingToken() }); toast('A new code was sent.', 'ok'); el.dataset.secs = d.resend_in || 60; startCountdown('Resend code'); });
  if (!el.disabled && el.dataset.secs === '0') startCountdown('Resend code');
};

route('/login/email', async () => {
  const tok = pendingToken(); if (!tok) return go('/login');
  let email = State.emailAddr, resend = State.resendIn || 0;
  if (email === undefined || email === null) { try { const d = await A('auth.pending', { pending: tok }); if (d.step !== 'email_setup') return go('/login/otp'); email = d.email; resend = d.resend_in; } catch (e) { setPending(null); toast(e.message, 'bad'); return go('/login'); } }
  const body = !email
    ? '<h1 style="margin-bottom:4px">Add your email</h1><p class="muted" style="margin:0 0 18px">Your account has no email yet. Enter one to receive sign-in codes.</p><form data-form="emailSubmit" novalidate>' + field('Email address', input('email', { type: 'email', required: true, auto: 'email', max: 255 })) + '<button class="btn primary" style="width:100%" type="submit">Send code</button></form>'
    : '<h1 style="margin-bottom:4px">Verify your email</h1><p class="muted" style="margin:0 0 18px">Enter the 6-digit code sent to <b>' + h(email) + '</b>.</p><form data-form="emailVerify" novalidate>' + field('Verification code', '<input type="text" name="code" id="f-code" inputmode="numeric" maxlength="6" required style="letter-spacing:.4em;font-size:20px;text-align:center">') +
      '<label class="check" style="margin-bottom:16px"><input type="checkbox" name="trust"> Trust this device for 30 days</label><button class="btn primary" style="width:100%" type="submit">Verify and sign in</button></form><div class="row between" style="margin-top:14px">' + resendButton('Resend code', resend) + '<a href="#" data-act="emailChange" class="small">Use a different email</a></div>';
  mount(authFrame(body + '<p class="center small" style="margin:16px 0 0"><a href="#/login" data-go="/login">Cancel</a></p>')); startCountdown('Resend code');
}, { public: true, guest: true });
Forms.emailSubmit = async f => { const v = formVals(f); await submitForm(f, 'auth.emailSubmit', { pending: pendingToken(), email: v.email }, d => { State.emailAddr = d.email; State.resendIn = d.resend_in; go('/login/email'); }); };
Forms.emailVerify = async f => { const v = formVals(f); await submitForm(f, 'auth.emailVerify', { pending: pendingToken(), code: v.code.trim(), trust: !!v.trust, device_label: (navigator.userAgent || '').slice(0, 100) }, finishLogin); };
Actions.emailChange = async () => { await A('auth.emailChange', { pending: pendingToken() }); State.emailAddr = null; go('/login/email'); };

/* ---------- forgot / reset ---------- */
route('/forgot', async () => {
  mount(authFrame('<h1 style="margin-bottom:4px">Forgot password</h1><p class="muted" style="margin:0 0 18px">Enter the email on your account and we will send a reset code.</p><form data-form="forgot" novalidate>' + field('Email address', input('email', { type: 'email', required: true, max: 255 })) + '<button class="btn primary" style="width:100%" type="submit">Send reset code</button></form><p class="center small" style="margin:16px 0 0"><a href="#/login" data-go="/login">Back to sign in</a></p>'));
}, { public: true, guest: true });
Forms.forgot = async f => { await submitForm(f, 'auth.forgot', { email: formVals(f).email }, d => { State.resetPending = d.pending; toast('If that email matches an account, a code is on its way.', 'ok'); go('/reset'); }); };
route('/reset', async () => {
  if (!State.resetPending) return go('/forgot');
  mount(authFrame('<h1 style="margin-bottom:4px">Reset password</h1><p class="muted" style="margin:0 0 18px">Enter the code from your email and choose a new password.</p><form data-form="reset" novalidate>' +
    field('Code', '<input type="text" name="code" inputmode="numeric" maxlength="6" required>') + field('New password', input('password', { type: 'password', required: true, auto: 'new-password' }), { hint: 'At least 12 characters.' }) + field('Confirm password', input('password_confirmation', { type: 'password', required: true, auto: 'new-password' })) +
    '<button class="btn primary" style="width:100%" type="submit">Reset password</button></form>'));
}, { public: true, guest: true });
Forms.reset = async f => { const v = formVals(f); await submitForm(f, 'auth.reset', { pending: State.resetPending, code: v.code.trim(), password: v.password, password_confirmation: v.password_confirmation }, () => { State.resetPending = null; toast('Password reset. You can sign in now.', 'ok'); go('/login'); }); };
</script>
