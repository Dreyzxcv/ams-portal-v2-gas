<script>
/* ===== Dashboard, users, batches, grades, violations, progress ===== */

/* ---- dashboard building blocks (ported from resources/js/pages/dashboard.tsx) ---- */
const greeting = () => { const hr = new Date().getHours(); return hr < 12 ? 'Good morning' : hr < 18 ? 'Good afternoon' : 'Good evening'; };
const chipIcon = (i, tone) => '<span class="chipicon t-' + tone + '">' + icon(i) + '</span>';
const sBadge = (tone, text) => '<span class="statusbadge t-' + tone + '">' + h(text) + '</span>';
const meterHtml = (value, total, tone) => { const pct = total > 0 ? Math.max(0, Math.min(100, (value / total) * 100)) : 0; return '<div class="meter t-' + tone + '" role="progressbar" aria-valuenow="' + Math.round(pct) + '" aria-valuemin="0" aria-valuemax="100"><i style="width:' + pct + '%"></i></div>'; };
function ringHtml(pct, tone, size) {
  size = size || 104; const sw = 10, r = (size - sw) / 2, c = 2 * Math.PI * r, p = Math.max(0, Math.min(100, pct));
  return '<div class="ring t-' + tone + '" style="width:' + size + 'px;height:' + size + 'px"><svg width="' + size + '" height="' + size + '"><circle cx="' + size / 2 + '" cy="' + size / 2 + '" r="' + r + '" fill="none" stroke-width="' + sw + '" style="stroke:color-mix(in oklab,var(--foreground) 10%,transparent)"/><circle cx="' + size / 2 + '" cy="' + size / 2 + '" r="' + r + '" fill="none" stroke-width="' + sw + '" stroke-linecap="round" stroke-dasharray="' + c + '" stroke-dashoffset="' + (c * (1 - p / 100)) + '" style="stroke:var(--tb)"/></svg><div class="c"><span style="font-size:20px;font-weight:600;font-variant-numeric:tabular-nums">' + Math.round(p) + '%</span></div></div>';
}
function heroHtml(o) {
  return '<div class="hero">' + (o.deco ? '<span class="deco">' + icon(o.deco).replace('<svg ', '<svg style="width:100%;height:100%;stroke-width:1.5" ') + '</span>' : '') +
    '<div class="row2"><div style="min-width:0"><p class="greet" style="margin:0">' + greeting() + '</p><h1>' + h(o.title) + '</h1><p class="sub" style="margin:.5rem 0 0">' + h(o.subtitle) + '</p>' +
    (o.chips && o.chips.length ? '<dl class="chips">' + o.chips.map(c => '<div class="chip"><dd class="tc t-' + c.tone + '" style="margin:0"><b>' + h(c.value) + '</b></dd><dt class="muted" style="font-size:12px">' + h(c.label) + '</dt></div>').join('') + '</dl>' : '') +
    '</div>' + (o.aside ? '<div style="position:relative">' + o.aside + '</div>' : '') + '</div></div>';
}
const dpanel = (title, ic, aside, inner) => '<section class="dcard dpanel"><header><h2>' + (ic ? icon(ic) : '') + h(title) + '</h2>' + (aside || '') + '</header>' + inner + '</section>';
const sumCard = (o) => { const inner = '<div class="top">' + chipIcon(o.icon, o.tone) + (o.badge || (o.href ? '<span class="muted">' + icon('arrowUpRight').replace('<svg ', '<svg style="width:1rem;height:1rem" ') + '</span>' : '')) + '</div><div class="big">' + o.value + '</div><div class="lbl"' + (o.sub ? ' style="font-weight:500;color:var(--foreground)"' : '') + '>' + h(o.label) + '</div>' + (o.sub ? '<div class="small muted">' + h(o.sub) + '</div>' : '');
  return o.href ? '<a class="dcard sumcard t-' + o.tone + '" href="' + h(o.href) + '" data-go="' + h(o.href.replace(/^#/, '')) + '">' + inner + '</a>' : '<div class="dcard sumcard t-' + o.tone + '">' + inner + '</div>'; };
const statCard = s => '<div class="card stat">' + (s.href ? '<a href="' + h(s.href) + '" data-go="' + h(s.href.replace(/^#/, '')) + '">' : '') + '<div class="v">' + h(s.value) + '</div><div class="l">' + h(s.label) + '</div>' + (s.href ? '</a>' : '') + '</div>';
const GROUP_STYLE = { Users: ['users', 'blue'], Batches: ['batch', 'violet'], Grades: ['grades', 'teal'], Violations: ['alert', 'rose'], Progress: ['hourglass', 'sky'], Certificates: ['cert', 'violet'] };
const LABEL_TONE = { 'Pending': 'violet', 'Last 30 days': 'rose', 'Grades entered, last 7 days': 'teal', 'Trainees who passed the final exam': 'emerald', 'Active trainees without a batch': 'amber' };

route('/dashboard', async (p, q, id) => {
  loadingShell('/dashboard', '');
  const d = await A('dashboard.get');
  if (!current(id)) return;
  if (d.mode === 'trainee') return renderTraineeDash(d.trainee);
  const attn = [];
  d.groups.forEach(g => g.stats.forEach(s => { if (['Active trainees without a batch', 'Pending', 'Last 30 days'].indexOf(s.label) !== -1 && (g.title !== 'Certificates' || s.label === 'Pending') && (s.label !== 'Last 30 days' || g.title === 'Violations') && s.value > 0) attn.push({ label: s.label === 'Pending' ? 'Certificates pending' : s.label === 'Last 30 days' ? 'Violations this month' : 'Trainees without a batch', value: s.value, tone: 'amber' }); }));
  let body = '<div style="display:grid;gap:1rem">' + heroHtml({ title: State.user.name, subtitle: 'Figures shown are limited to what your role can access.', chips: attn }) + '';
  d.groups.forEach(g => {
    const gs = GROUP_STYLE[g.title] || ['dashboard', 'sky'];
    body += '<h2 class="sect">' + h(g.title) + '</h2><div class="grid g3">' + g.stats.map(s => sumCard({ icon: gs[0], tone: LABEL_TONE[s.label] || gs[1], value: h(s.value), label: s.label, href: s.href })).join('') + '</div>';
  });
  if (d.trend) body += dpanel('Last 8 weeks', 'progress', '<span class="muted small">Weekly counts</span>', '<div class="dbody">' + lineChart(d.trend.weeks, d.trend.series) + '</div>');
  const cols = [];
  if (d.batches) cols.push(dpanel('Batch overview', 'batch', '<a class="small muted" href="#/batches" data-go="/batches">Manage</a>', d.batches.length ? '<ul style="list-style:none;margin:0;padding:.25rem 1.25rem 1rem;display:grid;gap:.75rem">' + (() => { const shown = d.batches.slice(0, 4), mx = Math.max(1, ...shown.map(b => Number(b.members))); return shown.map(b => '<li><div class="row between" style="margin-bottom:.375rem;flex-wrap:nowrap"><a href="#/batches/' + h(b.id) + '" data-go="/batches/' + h(b.id) + '" style="font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">' + h(b.name) + '</a><span class="muted small nowrap">' + b.members + ' trainee' + (b.members === 1 ? '' : 's') + '</span></div>' + meterHtml(Number(b.members), mx, 'violet') + '</li>').join('') + (d.batches.length > 4 ? '<li class="muted small">+' + (d.batches.length - 4) + ' more batches</li>' : ''); })() + '</ul>' : '<p class="muted center" style="padding:0 1.25rem 1.5rem;margin:0">No batches yet.</p>'));
  if (d.activity) cols.push(dpanel('Recent activity', 'clock', '', d.activity.length ? '<div class="dbody" style="display:grid;gap:.75rem">' + d.activity.map(a => '<div class="row between small" style="flex-wrap:nowrap;gap:1rem"><span style="min-width:0"><b>' + h(a.actor) + '</b> <span class="mono">' + h(a.action) + '</span>' + (a.subject ? ' <span class="muted">' + h(a.subject) + '</span>' : '') + '</span><span class="muted nowrap">' + h(fmtDT(a.occurred_at)) + '</span></div>').join('') + '</div>' : '<p class="muted center" style="padding:0 1.25rem 1.5rem;margin:0">No activity yet.</p>'));
  if (cols.length) body += '<div class="grid g2" style="align-items:stretch">' + cols.join('') + '</div>';
  if (!d.groups.length && !cols.length && !d.trend) body += '<div class="dcard"><div class="empty">Nothing to show for your role yet.</div></div>';
  body += '</div>';
  mount(shell('/dashboard', '', '', body, '', 'Dashboard'));
});
function renderTraineeDash(t) {
  const total = Number(t.grades_total), entered = Number(t.grades_entered), passed = Number(t.grades_passed), pct = total > 0 ? Math.min(100, Math.round((entered / total) * 100)) : 0;
  const comps = t.components || [], scored = comps.filter(c => c.score !== null && c.max), sumS = scored.reduce((a, c) => a + Number(c.score), 0), sumM = scored.reduce((a, c) => a + Number(c.max), 0);
  const avg = sumM > 0 ? Math.round((sumS / sumM) * 10000) / 100 : null, anyFail = comps.some(c => c.passed === false), allPass = comps.length > 0 && comps.every(c => c.passed === true);
  const v = Number(t.violations), issued = !!t.certificate_number;
  const first = avg !== null
    ? sumCard({ icon: 'grades', tone: 'blue', value: h(avg) + '%', label: 'Overall average', badge: anyFail ? sBadge('rose', 'Fail') : allPass ? sBadge('emerald', 'Pass') : sBadge('amber', 'Pending') })
    : sumCard({ icon: 'grades', tone: 'blue', value: passed + '<small> of ' + total + '</small>', label: 'Grades passed', badge: total === 0 ? sBadge('muted', 'No grades yet') : passed === total ? sBadge('emerald', 'All passed') : entered > passed ? sBadge('amber', (entered - passed) + ' not passed') : sBadge('muted', Math.max(0, total - entered) + ' pending') });
  let body = '<div style="display:grid;gap:1rem">' + heroHtml({ deco: 'stethoscope', title: State.user.name, subtitle: (t.batch || 'No batch assigned') + '. Here is where your training stands today.', aside: ringHtml(pct, 'sky', 104) }) +
    '<div class="grid g3">' + first +
    sumCard({ icon: 'alert', tone: v === 0 ? 'emerald' : 'amber', value: v, label: 'Violations', badge: v === 0 ? sBadge('emerald', 'Clean record') : sBadge('amber', v + ' recorded'), href: '#/violations' }) +
    sumCard({ icon: issued ? 'circleCheck' : 'cert', tone: issued ? 'emerald' : 'muted', value: issued ? 'Issued' : 'Not yet', label: 'Certificate', badge: issued ? sBadge('emerald', 'Complete') : sBadge('muted', 'Waiting') }) + '</div>' +
    '<div class="grid g2" style="align-items:stretch">' +
    dpanel('Grades', 'grades', '<a class="small muted" href="#/grades" data-go="/grades">Details</a>',
      '<div class="dbody" style="display:grid;gap:1.25rem">' + (comps.length ? comps.map(c => '<div class="barrow t-' + (c.score === null ? 'muted' : c.passed ? 'emerald' : 'rose') + '"><div class="hd2"><span>' + h(c.name) + '</span><b>' + (c.score === null ? 'Pending' : num(c.score) + ' / ' + num(c.max)) + '</b></div>' + meterHtml(c.score === null ? 0 : Number(c.score), Number(c.max) || 1, c.score === null ? 'muted' : c.passed ? 'emerald' : 'rose') + '</div>').join('') : '<p class="muted center" style="margin:0">No grades yet.</p>') + '</div>') +
    dpanel('Certificate', 'cert', '', '<div class="dbody">' + (t.certificate_id ? '<p style="margin:0 0 1rem">Issued <b>' + h(t.certificate_number) + '</b> on ' + h(fmtD(t.certificate_issued_at)) + '.</p><div class="row"><button class="btn primary" data-act="certPreview" data-id="' + h(t.certificate_id) + '">' + icon('eye') + 'View</button><button class="btn" data-act="certDownload" data-id="' + h(t.certificate_id) + '">' + icon('download') + 'Download</button></div>' : '<p class="muted" style="margin:0">Your certificate will appear here once it has been issued.</p>') +
      '<div class="grid" style="grid-template-columns:repeat(2,minmax(0,1fr));gap:.75rem;margin-top:1.25rem"><div class="softbox t-sky"><b>' + (t.current_phase_title ? h(t.current_phase_title) : '—').replace(/^(.{0,0})/, '$1') + '</b><span>Current phase</span></div><div class="softbox t-amber"><b>' + (t.remaining_days === null ? '—' : h(t.remaining_days)) + '</b><span>' + (t.batch_ended ? 'Batch ended' : 'Days remaining') + '</span></div></div></div>') + '</div></div>';
  mount(shell('/dashboard', '', '', body, '', 'Dashboard'));
}

/* ---------- users ---------- */
function showCredentials(c, title) {
  const m = openModal({ title: title || 'Account credentials', sticky: true, body: '<div class="alert warn">Share these securely. The password is shown <b>only once</b> and must be changed at first sign-in.</div><div class="field"><label>Username</label><input type="text" readonly value="' + h(c.username) + '" id="cr-u"></div><div class="field"><label>Temporary password</label><input type="text" readonly value="' + h(c.password) + '" id="cr-p" class="mono"></div>',
    footer: '<button class="btn" data-act="copyCreds">Copy both</button><button class="btn primary" data-modal-close>Done</button>' });
  Actions.copyCreds = () => { const t = 'Username: ' + c.username + '\nTemporary password: ' + c.password; try { navigator.clipboard.writeText(t).then(() => toast('Copied.', 'ok')); } catch (e) { $('#cr-p', m.el).select(); document.execCommand('copy'); toast('Copied.', 'ok'); } };
}
route('/users', async (p, q, id) => {
  loadingShell('/users', 'Users');
  const d = await A('users.list', { search: q.search, role: q.role, status: q.status, page: q.page });
  if (!current(id)) return;
  const t = '<div class="toolbar">' + searchBox('Search name, username or email') + '<select data-filter="role" aria-label="Role"><option value="">All roles</option>' + d.roles.map(r => '<option value="' + r.value + '"' + (q.role === r.value ? ' selected' : '') + '>' + h(r.label) + '</option>').join('') + '</select><select data-filter="status" aria-label="Status"><option value="">All statuses</option>' + d.statuses.map(s => '<option value="' + s + '"' + (q.status === s ? ' selected' : '') + '>' + h(s) + '</option>').join('') + '</select></div>';
  const tbl = table([{ h: 'Name', f: u => '<b>' + h(u.name) + '</b><div class="muted small">@' + h(u.username) + '</div>' }, { h: 'Email', cls: 'hide-sm', f: u => h(u.email || '—') }, { h: 'Role', f: u => h(u.role_label) }, { h: 'Status', f: u => statusBadge(u.status) + (u.force_password_change ? ' ' + badge('temp password', 'warn') : '') },
    { h: 'Last sign-in', cls: 'hide-sm', f: u => h(fmtDT(u.last_login_at)) }, { h: '', cls: 'right', f: u => '<a class="btn sm" href="#/users/' + h(u.id) + '/edit" data-go="/users/' + h(u.id) + '/edit">' + icon('edit') + 'Edit</a>' }], d.users, 'No users match your filters.');
  mount(shell('/users', 'Users', '<a class="btn primary" href="#/users/create" data-go="/users/create">' + icon('plus') + 'New user</a>', t + '<div class="card">' + tbl + pager(d.meta) + '</div>'));
});
const roleOpts = rs => rs.map(r => ({ value: r.value, label: r.label }));
route('/users/create', async (p, q, id) => {
  loadingShell('/users', 'New user');
  const d = await A('users.list', { page: 1 }); if (!current(id)) return;
  mount(shell('/users', 'New user', '', '<div class="card" style="max-width:560px"><div class="bd"><form data-form="userCreate" novalidate>' + field('Full name', input('name', { required: true, max: 255 })) + field('Username', input('username', { required: true, max: 50, auto: 'off' }), { hint: '3–50 characters: letters, digits, dot, underscore or hyphen.' }) +
    field('Email (optional)', input('email', { type: 'email', max: 255 }), { hint: 'If empty, the user is asked to add and verify an email at first sign-in.' }) + field('Role', select('role', roleOpts(d.roles), 'trainee')) +
    '<div class="row"><button class="btn primary" type="submit">Create user</button><a class="btn" href="#/users" data-go="/users">Cancel</a></div></form></div></div>'));
});
Forms.userCreate = async f => { await submitForm(f, 'users.create', formVals(f), d => { go('/users'); showCredentials(d.credentials, 'User created'); }); };
route('/users/:id/edit', async (p, q, id) => {
  loadingShell('/users', 'Edit user');
  const d = await A('users.get', { id: p.id }); if (!current(id)) return;
  const u = d.user;
  mount(shell('/users', 'Edit user', '', '<div class="grid g2"><div class="card"><div class="hd"><h2>Profile</h2></div><div class="bd"><form data-form="userEdit" data-id="' + h(u.id) + '" novalidate>' + field('Full name', input('name', { value: u.name, required: true, max: 255 })) + field('Username', input('username', { value: u.username, disabled: true })) +
    field('Email', input('email', { type: 'email', value: u.email || '', max: 255 })) + field('Role', select('role', roleOpts(d.roles), u.role, { disabled: !d.can.changeRole }), { hint: d.can.changeRole ? '' : 'You cannot change your own role.' }) + '<button class="btn primary" type="submit">Save changes</button></form></div></div>' +
    '<div class="stack"><div class="card"><div class="hd"><h2>Status</h2>' + statusBadge(u.status) + '</div><div class="bd"><div class="row">' + select('status', d.statuses.map(s => ({ value: s, label: s })), u.status, { disabled: !d.can.changeStatus }) + '<button class="btn" data-act="userStatus" data-id="' + h(u.id) + '"' + (d.can.changeStatus ? '' : ' disabled') + '>Update status</button></div><p class="muted small" style="margin:10px 0 0">Inactive and suspended users are signed out immediately and cannot sign in.</p></div></div>' +
    '<div class="card"><div class="hd"><h2>Password</h2></div><div class="bd"><p class="muted" style="margin-top:0">Issue a new temporary password. All sessions and trusted devices are revoked.</p><button class="btn danger" data-act="userReset" data-id="' + h(u.id) + '"' + (d.can.resetPassword ? '' : ' disabled') + '>' + icon('key') + 'Reset password</button></div></div>' +
    '<p class="small muted">Last sign-in: ' + h(fmtDT(u.last_login_at)) + '</p></div></div>'));
});
Forms.userEdit = async f => { const v = formVals(f); const body = { id: f.dataset.id, name: v.name, email: v.email }; if (!$('[name=role]', f).disabled) body.role = v.role; if (!body.email) delete body.email; await submitForm(f, 'users.update', body, () => go(State.path)); };
Actions.userStatus = async el => { const s = $('[name=status]').value; await busy(el, async () => { await A('users.status', { id: el.dataset.id, status: s }); toast(A.lastMessage || 'Status updated.', 'ok'); go(State.path); }); };
Actions.userReset = async el => { const ok = await confirmDialog({ title: 'Reset password?', message: 'The current password stops working immediately and the user is signed out everywhere.', confirmText: 'Reset password', danger: true }); if (!ok) return; await busy(el, async () => { const d = await A('users.resetPassword', { id: el.dataset.id }); showCredentials(d.credentials, 'Password reset'); }); };

/* ---------- batches ---------- */
const dateRange = b => h(fmtD(b.starts_on)) + ' → ' + h(fmtD(b.ends_on));
const daysBadge = b => b.is_ended || b.batch_ended ? badge('Ended') : (b.days_left === null || b.days_left === undefined ? badge('No end date') : badge(b.days_left + ' day' + (b.days_left === 1 ? '' : 's') + ' left', 'ok'));
route('/batches', async (p, q, id) => {
  loadingShell('/batches', 'Batches');
  const d = await A('batches.list', { search: q.search, page: q.page }); if (!current(id)) return;
  mount(shell('/batches', 'Batches', d.can.create ? '<a class="btn primary" href="#/batches/create" data-go="/batches/create">' + icon('plus') + 'New batch</a>' : '', '<div class="toolbar">' + searchBox('Search batches') + '</div><div class="card">' +
    table([{ h: 'Batch', f: b => '<a href="#/batches/' + h(b.id) + '" data-go="/batches/' + h(b.id) + '"><b>' + h(b.name) + '</b></a>' }, { h: 'Dates', cls: 'hide-sm', f: dateRange }, { h: 'Status', f: daysBadge }, { h: 'Trainees', cls: 'right', f: b => b.trainee_count }], d.batches, 'No batches yet.') + pager(d.meta) + '</div>'));
});
const batchForm = (b, action) => '<form data-form="' + action + '" ' + (b ? 'data-id="' + h(b.id) + '"' : '') + ' novalidate>' + field('Batch name', input('name', { value: b ? b.name : '', required: true, max: 100 })) + '<div class="grid g2">' + field('Start date', input('starts_on', { type: 'date', value: b ? b.starts_on : '' })) + field('End date', input('ends_on', { type: 'date', value: b ? b.ends_on : '' })) + '</div>';
route('/batches/create', async () => { mount(shell('/batches', 'New batch', '', '<div class="card" style="max-width:560px"><div class="bd">' + batchForm(null, 'batchCreate') + '<div class="row"><button class="btn primary" type="submit">Create batch</button><a class="btn" href="#/batches" data-go="/batches">Cancel</a></div></form></div></div>')); });
Forms.batchCreate = async f => { await submitForm(f, 'batches.create', formVals(f), d => go('/batches/' + d.id)); };
route('/batches/:id', async (p, q, id) => {
  loadingShell('/batches', 'Batch');
  const d = await A('batches.show', { id: p.id }); if (!current(id)) return;
  const b = d.batch;
  let body = '<div class="grid g2"><div class="card"><div class="hd"><h2>Details</h2>' + (b.ends_on ? daysBadge(b) : '') + '</div><div class="bd">' +
    (d.can.update ? batchForm(b, 'batchEdit') + '<div class="row"><button class="btn primary" type="submit">Save</button>' + (d.can['delete'] ? '<button type="button" class="btn danger" data-act="batchDelete" data-id="' + h(b.id) + '">' + icon('trash') + 'Delete batch</button>' : '') + '</div></form>' : '<p><b>' + h(b.name) + '</b></p><p class="muted">' + dateRange(b) + '</p>') + '</div></div>';
  body += '<div class="card"><div class="hd"><h2>Trainees (' + d.members.length + ')</h2></div>' + (d.can.assign ? '<div class="bd" style="border-bottom:1px solid var(--border)"><div class="row"><select id="assign-user" style="flex:1;min-width:180px"><option value="">Select a trainee…</option>' + d.available.map(a => '<option value="' + h(a.id) + '">' + h(a.name) + ' (@' + h(a.username) + ')' + (a.current_batch ? ' — in ' + h(a.current_batch) : '') + '</option>').join('') + '</select><button class="btn primary" data-act="batchAssign" data-id="' + h(b.id) + '">Assign</button></div><p class="muted small" style="margin:8px 0 0">Assigning a trainee who is already in another batch moves them; their history is kept.</p></div>' : '') +
    table([{ h: 'Trainee', f: m => '<b>' + h(m.name) + '</b><div class="muted small">@' + h(m.username) + '</div>' }, { h: 'Assigned', cls: 'hide-sm', f: m => h(fmtDT(m.assigned_at)) }, { h: '', cls: 'right', f: m => d.can.assign ? '<button class="btn sm danger" data-act="batchUnassign" data-id="' + h(b.id) + '" data-aid="' + h(m.id) + '">Remove</button>' : '' }], d.members, 'No trainees in this batch yet.') + '</div></div>';
  mount(shell('/batches', b.name, '<a class="btn" href="#/batches" data-go="/batches">← All batches</a>', body));
});
Forms.batchEdit = async f => { const v = formVals(f); v.id = f.dataset.id; await submitForm(f, 'batches.update', v, () => go(State.path)); };
Actions.batchAssign = async el => { const u = $('#assign-user').value; if (!u) return toast('Choose a trainee first.', 'bad'); await busy(el, async () => { await A('batches.assign', { id: el.dataset.id, user_id: u }); toast(A.lastMessage, 'ok'); go(State.path); }); };
Actions.batchUnassign = async el => { const ok = await confirmDialog({ title: 'Remove trainee?', message: 'They will no longer belong to this batch.', confirmText: 'Remove', danger: true }); if (!ok) return; await busy(el, async () => { await A('batches.unassign', { id: el.dataset.id, assignment_id: el.dataset.aid }); toast(A.lastMessage, 'ok'); go(State.path); }); };
Actions.batchDelete = async el => { const ok = await confirmDialog({ title: 'Delete batch?', message: 'This cannot be undone. The batch must have no trainees.', confirmText: 'Delete', danger: true }); if (!ok) return; await busy(el, async () => { await A('batches.delete', { id: el.dataset.id }); toast(A.lastMessage, 'ok'); go('/batches'); }); };

/* ---------- grades ---------- */
route('/grades', async (p, q, id) => {
  loadingShell('/grades', 'Grades');
  const d = await A('grades.index', { search: q.search, page: q.page }); if (!current(id)) return;
  if (d.redirect) return go('/grades/' + d.redirect.id);
  const cols = [{ h: 'Trainee', f: t => '<a href="#/grades/' + h(t.id) + '" data-go="/grades/' + h(t.id) + '"><b>' + h(t.name) + '</b></a><div class="muted small">@' + h(t.username) + '</div>' }].concat(d.components.map(c => ({ h: c.label.split(':')[0] + ' /' + num(c.max_score), cls: 'center', f: t => { const s = t.scores[c.id]; return s === undefined || s === null ? '<span class="muted">—</span>' : badge(num(s), s >= Number(c.pass_score) ? 'ok' : 'bad'); } })));
  mount(shell('/grades', 'Grades', '', '<div class="toolbar">' + searchBox('Search trainees') + '</div><div class="card">' + table(cols, d.trainees, 'No trainees found.') + pager(d.meta) + '</div><p class="muted small">Green = at or above the pass mark. Maximum scores for quiz-based phases equal the total points of the quiz.</p>'));
});
route('/grades/:id', async (p, q, id) => {
  loadingShell('/grades', 'Grades');
  const d = await A('grades.show', { id: p.id }); if (!current(id)) return;
  const body = '<div class="card">' + table([{ h: 'Component', f: r => '<b>' + h(r.label) + '</b>' + (r.is_final ? ' ' + badge('Final', 'info') : '') }, { h: 'Score', cls: 'nowrap', f: r => r.score === null ? '<span class="muted">Not graded</span>' : '<b>' + h(num(r.score)) + '</b> / ' + h(num(r.max_score)) }, { h: 'Pass mark', cls: 'hide-sm', f: r => h(num(r.pass_score)) },
    { h: 'Result', f: r => r.passed === null ? badge('Pending') : badge(r.passed ? 'Passed' : 'Below pass mark', r.passed ? 'ok' : 'bad') }, { h: 'Graded', cls: 'hide-sm', f: r => r.graded_by ? h(r.graded_by) + '<div class="muted small">' + h(fmtDT(r.graded_at)) + '</div>' : '—' },
    { h: '', cls: 'right', f: r => d.can.manage ? '<button class="btn sm" data-act="gradeEdit" data-tid="' + h(d.trainee.id) + '" data-cid="' + h(r.component_id) + '" data-label="' + h(r.label) + '" data-max="' + h(r.max_score) + '" data-score="' + h(r.score === null ? '' : r.score) + '">' + icon('edit') + (r.score === null ? 'Enter' : 'Edit') + '</button>' : '' }], d.rows) + '</div>' +
    '<div class="card" style="margin-top:16px"><div class="hd"><h2>Change history</h2></div>' + table([{ h: 'When', cls: 'nowrap', f: r => h(fmtDT(r.changed_at)) }, { h: 'Component', f: r => h(r.component) }, { h: 'Change', cls: 'nowrap', f: r => h(num(r.old_score)) + ' → ' + h(num(r.new_score)) }, { h: 'By', f: r => h(r.changed_by || 'system') }, { h: 'Reason', f: r => h(r.reason || '—') }], d.revisions, 'No changes recorded yet.') + '</div>';
  mount(shell('/grades', d.trainee.name, d.can.viewAll ? '<a class="btn" href="#/grades" data-go="/grades">← All trainees</a>' : '', body, '@' + h(d.trainee.username)));
});
Actions.gradeEdit = el => {
  const d = el.dataset, existing = d.score !== '';
  openModal({ title: d.label, body: '<form data-form="gradeSave" data-tid="' + h(d.tid) + '" data-cid="' + h(d.cid) + '" novalidate>' + field('Score (max ' + num(d.max) + ')', input('score', { type: 'number', value: d.score, min: 0, maxn: d.max, step: '0.01', required: true })) + field('Reason' + (existing ? ' (required when changing)' : ' (optional)'), '<textarea name="reason" maxlength="500"></textarea>') + '<div class="row" style="justify-content:flex-end"><button type="button" class="btn" data-modal-close>Cancel</button><button class="btn primary" type="submit">Save grade</button></div></form>' });
};
Forms.gradeSave = async f => { const v = formVals(f); await submitForm(f, 'grades.save', { trainee_id: f.dataset.tid, component_id: f.dataset.cid, score: v.score, reason: v.reason }, () => { const o = f.closest('.overlay'); if (o) o.remove(); go(State.path); }); };

/* ---------- violations ---------- */
route('/violations', async (p, q, id) => {
  loadingShell('/violations', 'Violations');
  const d = await A('violations.list', { search: q.search, page: q.page }); if (!current(id)) return;
  const mgr = d.can.create;
  const cols = []; if (mgr) cols.push({ h: 'Trainee', f: v => '<b>' + h(v.trainee_name) + '</b><div class="muted small">@' + h(v.trainee_username) + '</div>' });
  cols.push({ h: 'Date', cls: 'nowrap', f: v => h(fmtD(v.occurred_on)) }, { h: 'Description', f: v => '<div style="white-space:pre-wrap;max-width:520px">' + h(v.description) + '</div>' }, { h: 'Issued by', cls: 'hide-sm', f: v => h(v.issued_by || '—') });
  if (mgr) cols.push({ h: '', cls: 'right nowrap', f: v => '<a class="btn sm" href="#/violations/' + h(v.id) + '/edit" data-go="/violations/' + h(v.id) + '/edit">' + icon('edit') + 'Edit</a> <button class="btn sm danger" data-act="violationDelete" data-id="' + h(v.id) + '" aria-label="Delete">' + icon('trash') + '</button>' });
  mount(shell('/violations', mgr ? 'Violations' : 'My violations', mgr ? '<a class="btn primary" href="#/violations/create" data-go="/violations/create">' + icon('plus') + 'Record violation</a>' : '', (mgr ? '<div class="toolbar">' + searchBox('Search by trainee') + '</div>' : '') + '<div class="card">' + table(cols, d.violations, mgr ? 'No violations recorded.' : 'You have no recorded violations.') + pager(d.meta) + '</div>'));
});
const violationForm = (v, trainees) => '<form data-form="' + (v ? 'violationEdit' : 'violationCreate') + '" ' + (v ? 'data-id="' + h(v.id) + '"' : '') + ' novalidate>' + (v ? field('Trainee', '<input type="text" disabled value="' + h(v.trainee_name) + ' (@' + h(v.trainee_username) + ')">') : field('Trainee', select('trainee_id', [{ value: '', label: 'Select a trainee…' }].concat(trainees.map(t => ({ value: t.id, label: t.name + ' (@' + t.username + ')' }))), ''))) +
  field('Date of violation', input('occurred_on', { type: 'date', value: v ? v.occurred_on : new Date().toISOString().slice(0, 10), required: true, maxn: new Date().toISOString().slice(0, 10) })) + field('Description', '<textarea name="description" maxlength="2000" required>' + h(v ? v.description : '') + '</textarea>') + '<div class="row"><button class="btn primary" type="submit">' + (v ? 'Save changes' : 'Record violation') + '</button><a class="btn" href="#/violations" data-go="/violations">Cancel</a></div></form>';
route('/violations/create', async (p, q, id) => { loadingShell('/violations', 'Record violation'); const d = await A('violations.options'); if (!current(id)) return; mount(shell('/violations', 'Record violation', '', '<div class="card" style="max-width:640px"><div class="bd">' + violationForm(null, d.trainees) + '</div></div>')); });
Forms.violationCreate = async f => { await submitForm(f, 'violations.create', formVals(f), () => go('/violations')); };
route('/violations/:id/edit', async (p, q, id) => { loadingShell('/violations', 'Edit violation'); const d = await A('violations.get', { id: p.id }); if (!current(id)) return; mount(shell('/violations', 'Edit violation', '', '<div class="card" style="max-width:640px"><div class="bd">' + violationForm(d.violation) + '</div></div>')); });
Forms.violationEdit = async f => { const v = formVals(f); v.id = f.dataset.id; await submitForm(f, 'violations.update', v, () => go('/violations')); };
Actions.violationDelete = async el => { const ok = await confirmDialog({ title: 'Delete violation?', message: 'The record is removed from lists and reports. This action is logged.', confirmText: 'Delete', danger: true }); if (!ok) return; await busy(el, async () => { await A('violations.delete', { id: el.dataset.id }); toast(A.lastMessage, 'ok'); go(State.path + qs(State.q)); }); };

/* ---------- progress ---------- */
route('/progress', async (p, q, id) => {
  loadingShell('/progress', 'Progress');
  const d = await A('progress.list', { search: q.search, page: q.page }); if (!current(id)) return;
  if (d.redirect) return go('/dashboard');
  mount(shell('/progress', 'Progress', '', '<div class="toolbar">' + searchBox('Search active trainees') + '</div><div class="card">' + table([{ h: 'Trainee', f: t => '<b>' + h(t.name) + '</b><div class="muted small">@' + h(t.username) + '</div>' }, { h: 'Current phase', f: t => t.current_phase ? badge(t.current_phase, 'info') : '—' }, { h: 'Started', cls: 'hide-sm', f: t => h(fmtD(t.started_on)) },
    { h: 'Remaining', f: t => t.batch_ended ? badge('Ended') : (t.remaining_days === null ? '—' : h(t.remaining_days + ' days')) }, { h: 'Last update', cls: 'hide-sm', f: t => t.updated_at ? h(fmtDT(t.updated_at)) + '<div class="muted small">' + h(t.updated_by || '') + '</div>' : '<span class="muted">Not set</span>' },
    { h: '', cls: 'right', f: t => '<a class="btn sm" href="#/progress/' + h(t.id) + '" data-go="/progress/' + h(t.id) + '">' + icon('edit') + 'Update</a>' }], d.trainees, 'No active trainees.') + pager(d.meta) + '</div>'));
});
route('/progress/:id', async (p, q, id) => {
  loadingShell('/progress', 'Update progress');
  const d = await A('progress.get', { id: p.id }); if (!current(id)) return;
  const opts = []; for (let i = 1; i <= d.max_phase; i++) opts.push({ value: i, label: 'Phase ' + i });
  mount(shell('/progress', d.trainee.name, '<a class="btn" href="#/progress" data-go="/progress">← Back</a>', '<div class="grid g2"><div class="card"><div class="hd"><h2>Phase</h2></div><div class="bd"><form data-form="progressSave" data-id="' + h(d.trainee.id) + '" novalidate>' + field('Current phase', select('current_phase', opts, d.progress.current_phase)) + '<button class="btn primary" type="submit">Save</button></form><p class="muted small" style="margin:12px 0 0">' + (d.progress.exists ? 'Last updated ' + h(fmtDT(d.progress.updated_at)) + (d.progress.updated_by ? ' by ' + h(d.progress.updated_by) : '') : 'No phase has been recorded yet.') + '</p></div></div>' +
    '<div class="card"><div class="hd"><h2>Batch schedule</h2></div><div class="bd"><p style="margin-top:0">Starts: <b>' + h(fmtD(d.batch_starts_on)) + '</b></p><p>Ends: <b>' + h(fmtD(d.batch_ends_on)) + '</b></p>' + (d.batch_ended ? badge('Batch ended') : d.remaining_days === null ? '<span class="muted">No end date set.</span>' : badge(d.remaining_days + ' days remaining', 'ok')) + '</div></div></div>', '@' + h(d.trainee.username)));
});
Forms.progressSave = async f => { await submitForm(f, 'progress.save', { id: f.dataset.id, current_phase: formVals(f).current_phase }, () => go('/progress')); };
</script>
