/* ===== Quiz pages (manager/trainee/review) ported from ams-portal-v2 quizzes/*.tsx ===== */

.qx-row{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:.75rem;padding:.75rem 1.25rem}.qx-row+.qx-row{border-top:1px solid var(--border)}

.qx-rules li{display:flex;gap:.75rem}.qx-rules .ri{display:flex;width:2.25rem;height:2.25rem;flex:none;align-items:center;justify-content:center;border-radius:.75rem;background:var(--background);color:var(--muted-foreground)}.qx-rules .ri svg{width:1rem;height:1rem}
.qx-rules b{display:block;font-size:14px;font-weight:500}.qx-rules span{display:block;margin-top:.125rem;font-size:12px;line-height:1.6;color:var(--muted-foreground)}
.qx-state{display:flex;align-items:flex-start;gap:.75rem;border:1px solid var(--border);border-radius:.75rem;background:color-mix(in oklab,var(--muted) 40%,transparent);padding:1rem;font-size:14px}.qx-state p{margin:0}

<script>
/* ===== Quizzes: manager, trainee attempt, review ===== */
Object.assign(ICONS, {
  play: 'M6 3l14 9-14 9z',
  clipboardCheck: 'M8 2h8a1 1 0 0 1 1 1v2a1 1 0 0 1-1 1H8a1 1 0 0 1-1-1V3a1 1 0 0 1 1-1zM16 4h2a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h2M9 14l2 2 4-4',
  userPlus: 'M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2M9 11a4 4 0 1 0 0-8 4 4 0 0 0 0 8M19 8v6M22 11h-6',
  save: 'M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2zM17 21v-8H7v8M7 3v5h8'
});
const qStatus = s => statusBadge(s).replace(/>(\w+)</, (m, t) => '>' + ({ in_progress: 'In progress', graded: 'Graded', submitted: 'Awaiting review', available: 'Available' }[s] || t) + '<');
const qDur = m => { const hr = Math.floor(m / 60), r = m % 60; if (!hr) return m + (m === 1 ? ' minute' : ' minutes'); const hs = hr + (hr === 1 ? ' hour' : ' hours'); return r === 0 ? hs : hs + ' ' + r + ' min'; };
const qHead = (title, sub, actions, ic) => `<header class="ghead"><div class="row" style="gap:1rem;flex-wrap:nowrap;min-width:0">${ic ? `<span class="qx-hico" aria-hidden="true">${icon(ic)}</span>` : ''}<div style="min-width:0"><h1 style="overflow:hidden;text-overflow:ellipsis">${h(title)}</h1>${sub ? `<p class="muted" style="margin:.25rem 0 0;font-size:14px">${sub}</p>` : ''}</div></div>${actions ? `<div class="row" style="gap:.5rem">${actions}</div>` : ''}</header>`;
const qBtn = (to, cls, inner) => `<a class="btn ${cls}" href="#${to}" data-go="${to}">${inner}</a>`;
const QT = {
  in_progress: { label: 'In progress', ic: 'play', tone: 'amber', action: 'Continue quiz', primary: true, order: 0 },
  available: { label: 'Available', ic: 'quiz', tone: 'sky', action: 'View quiz', primary: false, order: 1 },
  submitted: { label: 'Awaiting review', ic: 'hourglass', tone: 'muted', action: 'View status', primary: false, order: 2 },
  graded: { label: 'Graded', ic: 'clipboardCheck', tone: 'emerald', action: 'View status', primary: false, order: 3 }
};

/* ---------- list (manager table / trainee cards) ---------- */
route('/quizzes', async (p, q, id) => {
  loadingShell('/quizzes', 'Quizzes');
  const d = await A('quizzes.list'); if (!current(id)) return;
  if (d.mode === 'trainee') {
    const list = d.quizzes.slice().sort((a, b) => QT[a.status].order - QT[b.status].order);
    const todo = list.filter(z => z.status === 'available' || z.status === 'in_progress').length;
    const cards = list.map(z => {
      const s = QT[z.status], to = z.status === 'in_progress' ? '/quizzes/attempts/' + h(z.attempt_id) : '/quizzes/' + h(z.id);
      return `<li><article class="qx-card qx-tcard t-${s.tone}"><div class="row" style="gap:.75rem;flex-wrap:nowrap;align-items:flex-start;min-width:0"><span class="qx-ico" aria-hidden="true">${icon(s.ic)}</span>` +
        `<div style="min-width:0;display:grid;gap:.375rem"><h2 style="font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${h(z.title)}</h2><p class="muted" style="margin:0">${h(z.phase)}</p>` +
        `<div class="qx-meta"><span class="qx-chip">${s.label}</span><span class="muted row" style="gap:.25rem">${icon('clock')}${qDur(z.duration_minutes)}</span>` +
        (z.status === 'graded' && z.score !== null ? `<span class="muted">Score: <b style="color:var(--foreground)">${num(z.score)}</b> / ${num(z.total_points)}</span>` : '') + `</div></div></div>` +
        qBtn(to, (s.primary ? 'primary ' : '') + 'rx', s.action + icon('arrowRight')) + `</article></li>`;
    }).join('');
    const body = `<div class="qx-wrap qx-w5">${qHead('My quizzes', 'Quizzes assigned to you', list.length ? `<span class="qx-chip ${todo ? 't-amber' : 't-muted'}" style="padding:.25rem .75rem">${todo ? todo + ' to take' : 'Nothing to take right now'}</span>` : '')}` +
      (list.length ? `<ul class="qx-list">${cards}</ul>` : `<div class="gempty" style="background:var(--card)">${icon('quiz')}<p style="margin:0;font-weight:500;color:var(--foreground)">No quizzes yet</p><p style="margin:0">Quizzes appear here once an instructor gives you access.</p></div>`) + '</div>';
    return mount(shell('/quizzes', '', '', body, '', 'My quizzes'));
  }
  const rows = d.quizzes.map(z => `<tr><td style="padding-left:1.25rem;font-weight:500">${h(z.title)}</td><td class="muted">${h(z.phase)}</td><td style="font-variant-numeric:tabular-nums">${z.question_count} <span class="muted small">· ${num(z.total_points)} pts</span></td>` +
    `<td style="font-variant-numeric:tabular-nums">${z.attempt_count}${z.pending_review ? ' ' + badge(z.pending_review + ' to review', 'warn') : ''}</td><td class="right" style="padding-right:1.25rem">${qBtn('/quizzes/' + h(z.id), 'sm rx', 'Manage')}</td></tr>`).join('');
  const body = `<div class="qx-wrap qx-w7">${qHead('Quizzes', 'Phase 1 and Final Examination assessments', d.can_create ? qBtn('/quizzes/create', 'primary rx', icon('plus') + 'New quiz') : '')}` +
    (d.quizzes.length ? `<div class="qx-card"><div style="overflow-x:auto"><table><thead><tr style="background:color-mix(in oklab,var(--muted) 60%,transparent)"><th style="padding-left:1.25rem;font-size:12px;color:var(--muted-foreground)">Quiz</th><th style="font-size:12px;color:var(--muted-foreground)">Phase</th><th style="font-size:12px;color:var(--muted-foreground)">Questions</th><th style="font-size:12px;color:var(--muted-foreground)">Attempts</th><th></th></tr></thead><tbody>${rows}</tbody></table></div></div>`
      : `<div class="gempty" style="background:var(--card)">${icon('quiz')}<p style="margin:0">No quizzes have been created.</p></div>`) + '</div>';
  mount(shell('/quizzes', '', '', body, '', 'Quizzes'));
});

/* ---------- quiz editor ---------- */
let QF = { questions: [], locked: false };
const blankQ = type => ({ type: type || 'multiple_choice', prompt: '', points: 1, options: type === 'paragraph' ? null : ['', ''], correct_option: type === 'paragraph' ? null : 0 });
function syncQF() {
  QF.questions = $$('.qeditor').map(el => {
    const type = $('[name=q-type]', el).value, q = { id: el.dataset.qid || undefined, type, prompt: $('[name=q-prompt]', el).value, points: $('[name=q-points]', el).value };
    if (type === 'multiple_choice') { q.options = $$('.q-opt', el).map(i => i.value); const r = $('input[type=radio]:checked', el); q.correct_option = r ? parseInt(r.value, 10) : 0; }
    return q;
  });
}
function renderQuestions() {
  const box = $('#qlist'); if (!box) return;
  box.innerHTML = QF.questions.map((q, i) => {
    const locked = QF.locked && q.id, n = QF.questions.length;
    return `<section class="qx-card qx-pad lg qx-q qeditor" data-i="${i}" data-qid="${h(q.id || '')}">` +
      `<div class="qx-qh"><div class="row" style="gap:.625rem"><span class="qx-num">${i + 1}</span><h3>Question ${i + 1}</h3></div><span class="row" style="gap:.125rem">` +
      `<button type="button" class="iconbtn qx-ib" data-act="qMove" data-i="${i}" data-d="-1" ${locked || i === 0 ? 'disabled' : ''} aria-label="Move question up">↑</button>` +
      `<button type="button" class="iconbtn qx-ib" data-act="qMove" data-i="${i}" data-d="1" ${locked || i === n - 1 ? 'disabled' : ''} aria-label="Move question down">↓</button>` +

async function renderAttempt(attemptId, navId) {
  loadingShell('/quizzes', 'Quiz');
  const d = await A('quizzes.attempt', { id: attemptId }); if (!current(navId)) return;
  if (d.submitted) {
    return mount(shell('/quizzes', d.quiz.title, '<a class="btn" href="#/quizzes" data-go="/quizzes">My quizzes</a>', '<div class="card" style="max-width:640px"><div class="bd stack"><div class="alert ' + (d.timed_out ? 'warn' : 'ok') + '">' + (d.timed_out ? 'Time ran out and your answers were submitted automatically.' : 'Your answers were submitted.') + '</div><p style="margin:0">Submitted ' + h(fmtDT(d.submitted_at)) + '.</p>' + (d.status === 'graded' ? '<p style="margin:0"><b>Score: ' + num(d.score) + ' / ' + num(d.total_points) + '</b></p>' : '<p class="muted" style="margin:0">An instructor will review your paragraph answers and post your grade.</p>') + '</div></div>'));
  }
  const questions = d.questions, N = questions.length, title = d.quiz.title;
  if (!N) return mount(shell('/quizzes', title, '<a class="btn" href="#/quizzes" data-go="/quizzes">My quizzes</a>', '<div class="alert warn">This quiz has no questions.</div>'));

  /* ----- state ----- */
  const ans = {};
  d.answers.forEach(a => { const o = ans[a.question_id] = {}; if (a.selected_option !== null && a.selected_option !== undefined) o.selected_option = a.selected_option; if (a.answer_text !== null && a.answer_text !== undefined) o.answer_text = a.answer_text; });
  const isAns = q => { const a = ans[q.id] || {}; return q.type === 'multiple_choice' ? a.selected_option !== undefined : String(a.answer_text || '').trim() !== ''; };
  const payload = () => { const out = []; questions.forEach(q => { const a = ans[q.id] || {}; if (q.type === 'multiple_choice') { if (a.selected_option !== undefined) out.push({ question_id: q.id, selected_option: a.selected_option }); } else out.push({ question_id: q.id, answer_text: a.answer_text || '' }); }); return out; };
  let savedKey = JSON.stringify(payload());
  let index = (() => { const f = questions.findIndex(q => !isAns(q)); return f === -1 ? N - 1 : f; })();
  const offset = Date.parse(d.server_time) - Date.now(), exp = Date.parse(d.attempt.expires_at); // server clock, so a wrong device clock cannot change the timer
  const rem = () => Math.max(0, Math.ceil((exp - (Date.now() + offset)) / 1000));
  const pad = n => String(n).padStart(2, '0');
  const fmt = s => s >= 3600 ? pad(Math.floor(s / 3600)) + ':' + pad(Math.floor((s % 3600) / 60)) + ':' + pad(s % 60) : pad(Math.floor(s / 60)) + ':' + pad(s % 60);
  let secs = rem(), saveState = 'saved', submitting = false, navigating = false, error = null, away = null, finished = false, submitStarted = false;
  const fsSupported = document.fullscreenEnabled === true;
  let isFs = document.fullscreenElement != null, wasFs = isFs, fsWarn = false;
  const gated = () => fsSupported && !isFs && !submitting, locked = () => secs === 0 || submitting || gated();

  mount('<div class="qz"><header class="qz-head"><div class="qz-hin"><div class="qz-t"><h1>' + h(title) + '</h1><p id="qz-sub"></p></div>' +
    '<div class="qz-r"><div class="qz-clock" id="qz-clock" role="timer" aria-label="Time left">' + icon('qzClock') + '<span id="qz-time"></span></div><span id="qz-save" class="qz-save" role="status"></span></div></div>' +
    '<div class="qz-bar" role="progressbar" aria-label="Answered questions" aria-valuemin="0" aria-valuemax="' + N + '"><div id="qz-fill"></div></div></header>' +
    '<main class="qz-main"><div class="qz-b" id="qz-banners"></div><nav class="qz-nav" id="qz-nav" aria-label="Question progress"></nav><section class="qz-card" id="qz-card"></section></main>' +
    '<footer class="qz-foot"><div class="qz-fin" id="qz-foot"></div></footer></div>');

  /* ----- painting (the question card is only redrawn when the question changes, so typing never loses focus) ----- */
  const paintHead = () => {
    $('#qz-sub').textContent = 'Question ' + (index + 1) + ' of ' + N;
    $('#qz-time').textContent = fmt(secs); $('#qz-clock').classList.toggle('low', secs <= 300);
    const n = questions.filter(isAns).length; $('#qz-fill').style.width = (n / N * 100) + '%'; $('#qz-fill').parentNode.setAttribute('aria-valuenow', n);
    const s = $('#qz-save'); s.className = 'qz-save' + (saveState === 'error' ? ' err' : '');
    s.innerHTML = saveState === 'error' ? icon('qzWarn') + 'Not saved <button type="button" class="qz-retry" data-qa="retry">' + icon('qzRetry') + 'Retry</button>' :
      saveState === 'saving' ? '<span class="spin" style="display:inline-flex">' + icon('qzSpin') + '</span>Saving…' : saveState === 'saved' ? '<span class="ok" style="display:inline-flex">' + icon('qzCheck') + '</span>Saved' : 'Unsaved changes';
  };
  const paintBanners = () => {
    $('#qz-banners').innerHTML =
      (gated() ? '<section role="alert" class="qz-gate"><span class="ic">' + icon('qzExpand') + '</span><div><h2>' + (fsWarn ? 'You left fullscreen' : 'Fullscreen is required') + '</h2><p>' + (fsWarn ? 'This was recorded in your attempt log. ' : '') + 'Enter fullscreen to see and answer the questions. Your timer keeps running.</p></div>' +
        '<button type="button" class="btn primary" data-qa="fs">' + icon('qzExpand') + (fsWarn ? 'Return to fullscreen' : 'Enter fullscreen') + '</button></section>' : '') +
      (!fsSupported ? '<p class="qz-note">Fullscreen is not available in this browser, which is common on phones. You can still take the quiz normally.</p>' : '') +
      (away !== null ? '<div role="status" class="qz-away"><span>This page was inactive for ' + away + ' ' + (away === 1 ? 'second' : 'seconds') + '. The timer kept running, and the event was recorded.</span><button type="button" data-qa="away">Dismiss</button></div>' : '') +
      (error ? '<div role="alert" class="qz-err"><span>' + h(error) + '</span>' + (saveState === 'error' ? '<button type="button" class="btn sm" data-qa="retry">' + icon('qzRetry') + 'Retry save</button>' : '') + '</div>' : '');
  };
  const maxReach = () => { const f = questions.findIndex(q => !isAns(q)); return f === -1 ? N - 1 : f; };
  const paintNav = () => {
    const mr = maxReach(), lk = locked();
    $('#qz-nav').innerHTML = questions.map((q, i) => '<button type="button" class="qz-n' + (i === index ? ' cur' : isAns(q) ? ' done' : '') + '" data-qa="go" data-i="' + i + '"' + (i > mr || lk ? ' disabled' : '') +
      ' aria-label="Question ' + (i + 1) + (isAns(q) ? ', answered' : '') + '"' + (i === index ? ' aria-current="step"' : '') + '>' + (i + 1) + '</button>').join('');
  };
  const paintFoot = () => {
    const lk = locked(), last = index === N - 1, ok = isAns(questions[index]);
    $('#qz-foot').innerHTML = '<button type="button" class="btn" data-qa="prev"' + (index === 0 || navigating || lk ? ' disabled' : '') + '>' + icon('qzLeft') + '<span class="sm-up">Previous</span><span class="xs">Prev</span></button>' +
      (!last ? '<button type="button" class="btn ghost" data-qa="submit"' + (lk ? ' disabled' : '') + '>Submit quiz</button>' : '') +
      (last ? '<button type="button" class="btn primary" data-qa="submit"' + (lk ? ' disabled' : '') + '>' + (submitting ? 'Submitting…' : 'Submit quiz') + '</button>'
        : '<button type="button" class="btn primary" data-qa="next"' + (!ok || navigating || lk ? ' disabled' : '') + '>' + (navigating ? 'Saving…' : 'Next') + icon('qzRight') + '</button>');
    const hint = $('#qz-hint'); if (hint) hint.textContent = !ok && !last ? 'Answer this question to continue.' : '';
  };
  const paintLock = () => { const lk = locked(); $$('#qz-card input, #qz-card textarea').forEach(el => { el.disabled = lk; }); $$('#qz-card .qz-opt').forEach(el => el.classList.toggle('lock', lk)); };
  const paintCard = () => {
    const q = questions[index], a = ans[q.id] || {};
    $('#qz-card').innerHTML = '<div class="qz-qh"><h2>' + h(q.prompt) + '</h2><span class="qz-pts">' + num(q.points) + ' ' + (Number(q.points) === 1 ? 'point' : 'points') + '</span></div>' +
      (q.type === 'multiple_choice' ? '<fieldset class="qz-opts"><legend class="sr">Choose one answer</legend>' + (q.options || []).map((o, j) => '<label class="qz-opt' + (a.selected_option === j ? ' sel' : '') + '"><input type="radio" name="qz-' + h(q.id) + '" value="' + j + '"' + (a.selected_option === j ? ' checked' : '') + '><span>' + h(o) + '</span></label>').join('') + '</fieldset>'
        : '<textarea data-qtext="' + h(q.id) + '" maxlength="20000" rows="8" aria-label="Response to question ' + (index + 1) + '">' + h(a.answer_text || '') + '</textarea>') + '<p class="qz-hint" id="qz-hint"></p>';
    paintLock(); paintFoot();
  };
  const paintMeta = () => { paintHead(); paintNav(); paintFoot(); };
  const paintAll = () => { paintHead(); paintBanners(); paintNav(); paintFoot(); paintLock(); };

  /* ----- saving: one request at a time so saves cannot overwrite each other out of order ----- */
  let queue = Promise.resolve(true), autosaveT = null;
  const flush = () => {
    const run = async () => {
      const p = payload(), key = JSON.stringify(p);
      if (key === savedKey) { saveState = 'saved'; paintHead(); return true; }
      saveState = 'saving'; paintHead();
      let ok = false;
      try { const r = await A('quizzes.saveAnswers', { id: attemptId, answers: p }); if (r && r.expired) { finished = true; go('/quizzes/attempts/' + attemptId); return false; } ok = true; } catch (e) { ok = false; }
      if (ok) { savedKey = key; error = null; saveState = JSON.stringify(payload()) === key ? 'saved' : 'unsaved'; } else saveState = 'error';
      if (!finished) { paintBanners(); paintMeta(); } return ok;
    };
    queue = queue.then(run, run); return queue;
  };
  const changed = () => { if (submitStarted) return; saveState = JSON.stringify(payload()) === savedKey ? saveState : 'unsaved'; paintMeta(); clearTimeout(autosaveT); autosaveT = setTimeout(() => flush(), 700); };

  async function goTo(t) {
    if (navigating || locked() || t === index || t < 0 || t >= N) return;
    navigating = true; paintFoot(); paintNav();
    const ok = await flush(); navigating = false;
    if (finished) return;
    if (ok) { error = null; index = t; paintBanners(); paintCard(); paintMeta(); window.scrollTo(0, 0); }
    else { error = 'Your latest changes could not be saved, so you stayed on this question. Retry, then continue.'; paintBanners(); paintMeta(); }
  }
  async function retry() { const ok = await flush(); if (ok) { error = null; paintBanners(); } }
  async function submitAttempt() {
    if (submitStarted) return; submitStarted = true; submitting = true; error = null; clearTimeout(autosaveT); paintAll();
    try { await A('quizzes.submit', { id: attemptId, answers: payload() }); }
    catch (e) { submitStarted = false; submitting = false; error = 'Submission failed. Your saved answers are still available; try submitting again.'; paintAll(); return; }
    finished = true; clearInterval(tick); try { if (document.fullscreenElement) document.exitFullscreen().catch(() => {}); } catch (e) { /* ignore */ }
    go('/quizzes/attempts/' + attemptId);
  }
  function confirmSubmit() {
    if (locked()) return;
    const left = questions.filter(q => !isAns(q)).length;
    const m = openModal({ title: 'Submit your quiz?', body: '<p style="margin:0">' + (left > 0 ? 'You have ' + left + ' unanswered ' + (left === 1 ? 'question' : 'questions') + '. ' : 'All questions are answered. ') + 'Submission is final.</p>',
      footer: '<button class="btn ghost" data-modal-close>Keep working</button><button class="btn primary" id="qz-ok">Submit quiz</button>' });
    $('#qz-ok', m.el).addEventListener('click', () => { m.el.remove(); submitAttempt(); });
  }
  const enterFs = () => { try { const r = document.documentElement.requestFullscreen(); if (r && r.catch) r.catch(() => { error = 'Your browser did not allow fullscreen.'; paintBanners(); }); } catch (e) { error = 'Your browser did not allow fullscreen.'; paintBanners(); } };

  /* ----- events ----- */
  const root = $('#root');
  const onClick = e => {
    const b = e.target.closest('[data-qa]'); if (!b || b.disabled) return; const a = b.dataset.qa;
    if (a === 'prev') goTo(index - 1); else if (a === 'next') goTo(index + 1); else if (a === 'go') goTo(parseInt(b.dataset.i, 10));
    else if (a === 'submit') confirmSubmit(); else if (a === 'retry') retry(); else if (a === 'fs') enterFs(); else if (a === 'away') { away = null; paintBanners(); }
  };
  const onChange = e => { const r = e.target.closest('.qz-opt input[type=radio]'); if (!r || locked()) return; const q = questions[index]; ans[q.id] = { selected_option: parseInt(r.value, 10) }; $$('#qz-card .qz-opt').forEach(l => l.classList.toggle('sel', $('input', l).checked)); changed(); };
  const onInput = e => { const t = e.target.closest('textarea[data-qtext]'); if (!t || locked()) return; ans[t.dataset.qtext] = { answer_text: t.value }; changed(); };
  root.addEventListener('click', onClick); root.addEventListener('change', onChange); root.addEventListener('input', onInput);
  const ev = n => { if (!finished && !submitStarted) A('quizzes.event', { id: attemptId, event: n, client_time: new Date().toISOString() }).catch(() => {}); };
  let hiddenAt = null;
  const onVis = () => { if (document.hidden) { hiddenAt = Date.now(); ev('page_hidden'); return; } ev('page_visible'); if (hiddenAt !== null) { away = Math.round((Date.now() - hiddenAt) / 1000); hiddenAt = null; paintBanners(); } };
  const onBlur = () => ev('window_blur'), onFocus = () => ev('window_focus');
  const onFs = () => { const active = document.fullscreenElement != null; isFs = active; if (active) { wasFs = true; fsWarn = false; ev('fullscreen_entered'); } else if (wasFs) { wasFs = false; fsWarn = true; ev('fullscreen_exited'); } if (!finished) paintAll(); };
  const onUnload = e => { if (saveState !== 'saved' && !submitting && !finished) { e.preventDefault(); e.returnValue = ''; } };
  document.addEventListener('visibilitychange', onVis); window.addEventListener('blur', onBlur); window.addEventListener('focus', onFocus);
  document.addEventListener('fullscreenchange', onFs); window.addEventListener('beforeunload', onUnload);
  if (!fsSupported) ev('fullscreen_unsupported');

  const tick = setInterval(() => { const s = rem(); if (s === secs) return; secs = s; paintHead(); if (s === 0) { paintAll(); submitAttempt(); } }, 1000); // the server enforces the deadline; this only submits on time
  State.cleanup = () => {
    clearInterval(tick); clearTimeout(autosaveT);
    root.removeEventListener('click', onClick); root.removeEventListener('change', onChange); root.removeEventListener('input', onInput);
    document.removeEventListener('visibilitychange', onVis); window.removeEventListener('blur', onBlur); window.removeEventListener('focus', onFocus);
    document.removeEventListener('fullscreenchange', onFs); window.removeEventListener('beforeunload', onUnload);
    if (!finished && JSON.stringify(payload()) !== savedKey) { try { A('quizzes.saveAnswers', { id: attemptId, answers: payload() }).catch(() => {}); } catch (e) { /* best effort */ } }
    try { if (document.fullscreenElement) document.exitFullscreen().catch(() => {}); } catch (e) { /* ignore */ }
  };
  paintBanners(); paintCard(); paintMeta(); paintLock();
}
</script>
