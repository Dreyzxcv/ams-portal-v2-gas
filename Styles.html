<style>

/* ===== App shell: sidebar variant="inset" ===== */

.nav a:hover{background:var(--sidebar-accent);color:var(--foreground)}

:root[data-theme="dark"] .nav a.active{color:var(--sky-300)}:root[data-theme="dark"] .nav a.active svg{color:var(--sky-400)}
.userbtn{position:relative;background:color-mix(in oklab,var(--sidebar-accent) 60%,transparent)}.userbtn:hover,.userbtn[aria-expanded=true]{background:var(--sidebar-accent)}

.content{padding:1.5rem;max-width:80rem;width:100%;margin:0 auto;flex:1}
.sbscrim{display:none}

}

.pagehead{display:flex;gap:.75rem;align-items:flex-start;justify-content:space-between;flex-wrap:wrap;margin-bottom:2rem}.pagehead h1{font-size:20px;line-height:28px}.pagehead p{margin:2px 0 0;color:var(--muted-foreground);font-size:14px}

/* ===== Cards / grids ===== */

.card>.bd{padding:1.5rem}.card>.hd+.bd{padding-top:.25rem}
.grid{display:grid;gap:1rem}.g2{grid-template-columns:repeat(2,minmax(0,1fr))}.g3{grid-template-columns:repeat(3,minmax(0,1fr))}.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
.stat{padding:1rem 1.25rem}.stat .v{font-size:26px;font-weight:600;letter-spacing:-.025em}.stat .l{color:var(--muted-foreground);font-size:12px}.stat a:hover .v{color:var(--sky-600)}

.dcard{background:var(--card);border:1px solid var(--border);border-radius:1rem;box-shadow:var(--sh-xs);min-width:0}
.dpanel{display:flex;flex-direction:column;overflow:hidden}.dpanel>header{display:flex;align-items:center;justify-content:space-between;gap:.5rem;padding:1rem 1.25rem .75rem}.dpanel>header h2{display:flex;align-items:center;gap:.5rem;font-size:14px;font-weight:600}.dpanel>header h2 svg{width:1rem;height:1rem;color:var(--muted-foreground)}
.dpanel .dbody{padding:.25rem 1.25rem 1.25rem}
.sect{padding:.5rem .25rem 0;font-size:16px;font-weight:600;letter-spacing:-.025em;color:color-mix(in oklab,var(--foreground) 90%,transparent)}
.hero{position:relative;overflow:hidden;border-radius:1.5rem;border:1px solid var(--border);background:color-mix(in oklab,var(--sky-500) 10%,transparent);padding:1.5rem}

.hero .row2{position:relative;display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:1.5rem}
.hero .greet{font-size:14px;color:var(--muted-foreground)}.hero h1{margin-top:.25rem;font-size:30px;line-height:36px;font-weight:600;letter-spacing:-.025em;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.hero .sub{margin-top:.5rem;max-width:65ch;font-size:14px;color:var(--muted-foreground)}
.chips{display:flex;flex-wrap:wrap;gap:.5rem;margin:1.25rem 0 0}.chip{display:flex;align-items:baseline;gap:.5rem;border-radius:9999px;border:1px solid var(--border);padding:.375rem .875rem;background:color-mix(in oklab,var(--background) 70%,transparent);-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px)}.chip b{font-size:16px;font-weight:600;font-variant-numeric:tabular-nums}.chip span{font-size:12px;color:var(--muted-foreground)}

/* tones */
.t-blue{--tc:var(--blue-600);--tb:var(--blue-500)}.t-violet{--tc:var(--violet-600);--tb:var(--violet-500)}.t-emerald{--tc:var(--emerald-600);--tb:var(--emerald-500)}.t-amber{--tc:var(--amber-600);--tb:var(--amber-500)}.t-sky{--tc:var(--sky-600);--tb:var(--sky-500)}.t-teal{--tc:var(--teal-600);--tb:var(--teal-500)}.t-rose{--tc:var(--rose-600);--tb:var(--rose-500)}.t-muted{--tc:var(--muted-foreground);--tb:color-mix(in oklab,var(--muted-foreground) 40%,transparent)}
:root[data-theme="dark"] .t-blue{--tc:var(--blue-400)}:root[data-theme="dark"] .t-violet{--tc:var(--violet-400)}:root[data-theme="dark"] .t-emerald{--tc:var(--emerald-400)}:root[data-theme="dark"] .t-amber{--tc:var(--amber-400)}:root[data-theme="dark"] .t-sky{--tc:var(--sky-400)}:root[data-theme="dark"] .t-teal{--tc:var(--teal-400)}:root[data-theme="dark"] .t-rose{--tc:var(--rose-400)}
.tc{color:var(--tc)}.chipicon{display:inline-grid;place-items:center;width:2.75rem;height:2.75rem;flex:none;border-radius:.75rem;color:var(--tc);background:color-mix(in oklab,var(--tb) 10%,transparent)}.chipicon svg{width:18px;height:18px}.t-muted.chipicon{background:var(--muted)}
.sumcard{padding:1.25rem;display:block}.sumcard .top{display:flex;align-items:flex-start;justify-content:space-between}.sumcard .big{margin-top:1.25rem;font-size:36px;line-height:1;font-weight:600;letter-spacing:-.025em;font-variant-numeric:tabular-nums;color:var(--tc)}.sumcard .big small{font-size:18px;font-weight:400;color:var(--muted-foreground);letter-spacing:0}.sumcard .lbl{margin-top:.5rem;font-size:14px;color:var(--muted-foreground)}
a.sumcard{transition:border-color .15s,box-shadow .15s}a.sumcard:hover{box-shadow:var(--sh-sm);border-color:color-mix(in oklab,var(--tb) 40%,var(--border))}
.statusbadge{display:inline-flex;align-items:center;border-radius:9999px;padding:.25rem .625rem;font-size:12px;font-weight:500;color:var(--tc);background:color-mix(in oklab,var(--tb) 10%,transparent);white-space:nowrap}.statusbadge.t-muted{background:var(--muted)}
.ring{position:relative;flex:none}.ring svg{transform:rotate(-90deg)}.ring .c{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;flex-direction:column}
.meter{height:.5rem;border-radius:9999px;background:color-mix(in oklab,var(--foreground) 10%,transparent);overflow:hidden}.meter>i{display:block;height:100%;border-radius:9999px;background:var(--tb,var(--primary))}
.barrow .hd2{display:flex;align-items:baseline;justify-content:space-between;margin-bottom:.5rem;font-size:14px}.barrow .hd2 b{font-weight:600;font-variant-numeric:tabular-nums;color:var(--tc)}
.softbox{background:color-mix(in oklab,var(--muted) 60%,transparent);border-radius:.75rem;padding:.75rem;text-align:center}.softbox b{display:block;font-size:24px;line-height:32px;font-weight:600;font-variant-numeric:tabular-nums;color:var(--tc)}.softbox span{font-size:12px;color:var(--muted-foreground)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:.5rem;height:2.25rem;padding:.5rem 1rem;border-radius:var(--radius-md);border:1px solid var(--input);background:var(--background);color:var(--foreground);font:inherit;font-size:14px;font-weight:500;line-height:20px;cursor:pointer;white-space:nowrap;box-shadow:var(--sh-xs);transition:color .15s,box-shadow .15s,background-color .15s;outline:none}
.btn:hover{background:var(--accent);color:var(--accent-foreground);text-decoration:none}.btn:focus-visible{border-color:var(--ring);box-shadow:0 0 0 3px color-mix(in oklab,var(--ring) 50%,transparent)}.btn:disabled{opacity:.5;pointer-events:none}

.btn.danger{color:var(--bad-fg);border-color:color-mix(in oklab,var(--red-500) 35%,var(--border))}.btn.danger:hover{background:color-mix(in oklab,var(--red-500) 10%,transparent);color:var(--bad-fg)}
.btn.danger.solid{background:var(--destructive);color:#fff;border-color:var(--destructive)}.btn.danger.solid:hover{background:color-mix(in oklab,var(--destructive) 90%,transparent);color:#fff}
.btn.sm{height:2rem;padding:0 .75rem;font-size:14px}.btn.lg{height:2.75rem;border-radius:.75rem;width:100%}.btn.ghost{border-color:transparent;background:transparent;box-shadow:none}.btn.ghost:hover{background:var(--accent)}.btn svg{width:1rem;height:1rem}
label{display:block;font-size:14px;line-height:1;font-weight:500;margin-bottom:.5rem;user-select:none}.field{margin-bottom:1rem}.field .hint{color:var(--muted-foreground);font-size:12px;margin-top:.375rem}.field .err,.err{color:var(--destructive);font-size:14px;margin-top:.375rem}
:root[data-theme="dark"] .field .err,:root[data-theme="dark"] .err{color:var(--red-400)}
input[type=text],input[type=password],input[type=email],input[type=number],input[type=date],input[type=search],input[type=datetime-local],input[type=url],select,textarea{display:flex;width:100%;min-width:0;height:2.25rem;padding:.25rem .75rem;border:1px solid var(--input);border-radius:var(--radius-md);background:transparent;color:var(--foreground);font:inherit;font-size:14px;box-shadow:var(--sh-xs);outline:none;transition:color .15s,box-shadow .15s}
:root[data-theme="dark"] input[type=text],:root[data-theme="dark"] input[type=password],:root[data-theme="dark"] input[type=email],:root[data-theme="dark"] input[type=number],:root[data-theme="dark"] input[type=date],:root[data-theme="dark"] input[type=search],:root[data-theme="dark"] select,:root[data-theme="dark"] textarea{background:color-mix(in oklab,var(--input) 30%,transparent)}
