<script>
/** Where to land on load: the real address-bar #hash (Apps Script API), else the iframe's own hash, else the page remembered before the refresh. */
function bootPath() {
  return new Promise(resolve => {
    const clean = v => { v = String(v || ''); if (v && v.charAt(0) !== '/') { try { v = decodeURIComponent(v); } catch (e) { /* keep */ } } return v.charAt(0) === '/' ? v : ''; };
    const own = clean((window.location.hash || '').replace(/^#/, ''));
    if (own) return resolve(own);
    let done = false; const fin = v => { if (!done) { done = true; resolve(clean(v) || clean(Store.sget('ams_last'))); } };
    try { google.script.url.getLocation(loc => fin(loc && loc.hash)); setTimeout(() => fin(''), 1200); } catch (e) { fin(''); }
  });
}
(async function boot() {
  applyTheme();
  const t = Store.sget('ams_token') || Store.get('ams_token');
  if (t) {
    State.token = t;
    try { const d = await callApi('auth.me'); State.user = d.data.user; State.intake = d.data.intake; }
    catch (e) { clearSession(); }
  }
  go((await bootPath()) || (State.user ? '/dashboard' : '/'));
})();
</script>
